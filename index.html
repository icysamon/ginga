/* ---- military.js ---- */

/* ==========================================================
   military.js — 艦隊移動・会戦・包囲・侵攻・占領
   ========================================================== */
const PW = { BB: 9, CR: 5, DD: 2.8, CV: 5, LT: 0.2 };
// fleetPower を艦種別の打撃力で再定義
function fleetPower(fl) {
  const a = adm(fl);
  let p = 0;
  for (const k of SHIP_KEYS) p += fl.ships[k] * PW[k];
  const am = a ? 0.78 + (a.atk + a.def + a.lead) / 650 : 0.75;
  const tr = (hasTrait(a, 'genius') ? 1.1 : 1) * (hasTrait(a, 'inept') ? 0.85 : 1);
  const f = FAC(fl.owner);
  return p * (0.5 + fl.morale / 200) * (0.55 + 0.45 * fl.supply / 100) * (0.75 + fl.training / 400) * am * tr * (f ? modOf(f, 'fire') : 1);
}
function fleetHP(fl) { let h = 0; for (const k of SHIP_KEYS) h += fl.ships[k] * SHIP[k].hp; return h; }

/* ---------- 移動 ---------- */
function orderMove(fl, destSid) {
  if (fl.to != null && destSid === fl.from) {
    const t = fl.from; fl.from = fl.to; fl.to = t; fl.prog = 1 - fl.prog; fl.route = []; fl.dest = destSid;
    return { ok: true };
  }
  if (fl.to == null && fl.sid === destSid) { fl.route = []; fl.dest = null; return { ok: true }; }
  const start = fl.to != null ? fl.to : fl.sid;
  if (start === destSid) { fl.route = []; fl.dest = destSid; return { ok: true }; }
  const path = findPath(fl.owner, start, destSid);
  if (!path) return { ok: false, why: '到達できる航路がない（中立国・停戦中の敵国は通過できない）' };
  fl.route = path; fl.dest = destSid;
  return { ok: true, days: pathDays(fl, path) };
}
function stopFleet(fl) { fl.route = []; fl.dest = fl.to != null ? fl.to : null; }
function fleetEngaged(fl) {
  return G.pending.some(p => (p.type === 'battle' && p.battle.sides.some(sd => sd.fleets.includes(fl.id))) || (p.type === 'ground' && p.inv.fleetIds.includes(fl.id)));
}
function advanceFleets(dtDays) {
  for (const fl of G.fleets) {
    let budget = dtDays, guard = 0;
    while (budget > 1e-6 && guard++ < 8) {
      if (fl.to == null) {
        if (!fl.route.length) break;
        if (fleetEngaged(fl)) break;
        const nx = fl.route[0];
        if (!canEnter(fl.owner, G.systems[nx])) { fl.route = []; fl.dest = null; break; }
        const l = laneBetween(fl.sid, nx);
        if (!l) { fl.route = []; fl.dest = null; break; }
        fl.from = fl.sid; fl.to = nx; fl.sid = null; fl.prog = 0; fl.route.shift(); fl.moveStart = G.day;
      }
      const l = laneBetween(fl.from, fl.to);
      const v = fleetSpeed(fl) * laneFactor(l);
      const need = (1 - fl.prog) * l.len / v;
      if (budget >= need) { budget -= need; arriveFleet(fl); }
      else { fl.prog += budget * v / l.len; budget = 0; }
    }
  }
}
function arriveFleet(fl) {
  const s = G.systems[fl.to];
  fl.sid = fl.to; fl.from = null; fl.to = null; fl.prog = 0; fl.arrivedDay = G.day;
  const fp = fortressOf(s);
  if (hostileFleetsAt(s.id, fl.owner) || (fp && fp.fortress.hp > 0 && atWar(fl.owner, fp.owner))) { fl.route = []; fl.dest = null; }
  if (!fl.route.length) fl.dest = null;
  if (fl.ai && fl.ai.mission === 'retreat') fl.ai = { mission: 'idle' };
  emit('arrive', fl);
}

/* ---------- 会戦 ---------- */
function battleAt(sid) { return G.pending.find(p => p.type === 'battle' && p.battle.sid === sid); }
function dailyBattles() {
  for (const s of G.systems) {
    if (battleAt(s.id)) continue;
    const here = fleetsAt(s.id);
    if (!here.length) continue;
    const fp = fortressOf(s);
    const fortActive = fp && fp.fortress.hp > 0 && fp.owner;
    const owners = [...new Set(here.map(f => f.owner))];
    let pair = null;
    for (let i = 0; i < owners.length && !pair; i++) for (let j = i + 1; j < owners.length; j++) if (atWar(owners[i], owners[j])) { pair = [owners[i], owners[j]]; break; }
    if (!pair && fortActive) {
      const att = owners.find(o => atWar(o, fp.owner));
      if (att && here.some(f => f.owner === att && f.arrivedDay >= G.day - 1)) pair = [att, fp.owner];
    }
    if (!pair) continue;
    if (pair[0] === s.owner) pair.reverse();
    startBattle(makeBattle(s, pair[0], pair[1]));
  }
}
function makeBattle(s, att, def, opts) {
  const fp = fortressOf(s), mp = mainPlanet(s);
  const here = fleetsAt(s.id);
  return {
    id: nid(), sid: s.id, day: G.day, att, def, assault: !!(opts && opts.assault),
    sides: [{ fid: att, fleets: here.filter(f => f.owner === att).map(f => f.id) }, { fid: def, fleets: here.filter(f => f.owner === def).map(f => f.id) }],
    fortPid: fp && fp.fortress.hp > 0 && (fp.owner === att || fp.owner === def) ? fp.id : null,
    batteryPid: mp && !mp.fortress && mp.def > 0 && (mp.owner === att || mp.owner === def) ? mp.id : null
  };
}
function startBattle(b) {
  G.stats.battles++;
  const pl = b.att === G.player || b.def === G.player;
  if (pl && !G.headless) { G.pending.push({ type: 'battle', battle: b }); return; }
  finishBattle(b, autoBattle(b));
}
function snapshotFleets(b) {
  const m = new Map();
  for (const sd of b.sides) for (const id of sd.fleets) { const fl = fleetById(id); if (fl) m.set(id, Object.assign({}, fl.ships, { morale: fl.morale })); }
  return m;
}
function autoBattle(b) {
  const before = snapshotFleets(b);
  const sides = b.sides.map(sd => ({ fid: sd.fid, fleets: sd.fleets.map(fleetById).filter(f => f && fleetShips(f) > 0) }));
  const fort = b.fortPid != null ? G.planets[b.fortPid] : null;
  const fortSide = fort ? (fort.owner === sides[0].fid ? 0 : 1) : -1;
  const bat = b.batteryPid != null ? G.planets[b.batteryPid] : null;
  const batSide = bat ? (bat.owner === sides[0].fid ? 0 : 1) : -1;
  const sp = (i) => sum(sides[i].fleets, fleetPower) + (i === fortSide ? fortBattlePower(fort) : 0) + (i === batSide ? bat.def * 1500 : 0);
  const init = [sp(0), sp(1)];
  let loser = -1, rounds = 0;
  for (let r = 0; r < 10 && loser < 0; r++) {
    rounds++;
    const P = [sp(0), sp(1)];
    for (let i = 0; i < 2; i++) {
      const j = 1 - i;
      const sup = clamp(Math.pow(Math.max(1, P[j]) / Math.max(1, P[i]), 0.3), 0.6, 1.6);
      const dmg = P[j] * 0.05 * sup * randRange(0.8, 1.2);
      autoDamage(sides[i], dmg, i === fortSide ? fort : null);
      // 要塞主砲：射線上の艦隊をまとめて薙ぎ払う（戦術画面の主砲に合わせ、毎ラウンド大艦隊2個を撃つ）
      if (j === fortSide && fort.fortress.hp > 0 && sides[i].fleets.length) {
        const hpK = 0.4 + 0.6 * fort.fortress.hp / fort.fortress.max;
        const tgts = sides[i].fleets.slice().sort((a, c) => fleetShips(c) - fleetShips(a)).slice(0, 2);
        for (const tgt of tgts) {
          for (const k of SHIP_KEYS) tgt.ships[k] -= Math.round(tgt.ships[k] * 0.1 * hpK);
          tgt.morale = Math.max(0, tgt.morale - 9);
        }
      }
    }
    for (let i = 0; i < 2; i++) {
      const fl = sides[i].fleets.filter(f => fleetCombat(f) > 50);
      if (!fl.length) { if (i !== fortSide || (fort && fort.fortress.hp <= 0)) { loser = i; break; } continue; }
      const mor = sum(fl, f => f.morale * fleetShips(f)) / Math.max(1, sum(fl, fleetShips));
      if (mor < 24 || sp(i) < init[i] * 0.32) { loser = i; break; }
    }
  }
  if (loser < 0) {
    const r0 = sp(0) / Math.max(1, init[0]), r1 = sp(1) / Math.max(1, init[1]);
    loser = r0 < r1 ? 0 : 1;
    if (loser === fortSide && !sides[fortSide].fleets.length) loser = -1; // 要塞は退かない（包囲継続）
  }
  // 追撃損害
  if (loser >= 0) for (const fl of sides[loser].fleets) for (const k of SHIP_KEYS) fl.ships[k] -= Math.round(fl.ships[k] * 0.04);
  const flagLost = {};
  for (const sd of sides) for (const fl of sd.fleets) {
    const bf = before.get(fl.id); const n0 = SHIP_KEYS.reduce((s, k) => s + bf[k], 0);
    const lf = 1 - fleetShips(fl) / Math.max(1, n0);
    if (chance(lf > 0.5 ? 0.25 : lf * 0.15)) flagLost[fl.id] = true;
  }
  return { before, loser, flagLost, supplyUse: 6 + rounds * 1.6, fortHp: fort ? fort.fortress.hp : null, auto: true };
}
function autoDamage(sd, dmg, fort) {
  const hp = sd.fleets.map(fleetHP);
  const fortShare = fort && fort.fortress.hp > 0 ? fort.fortress.hp * 0.6 : 0;
  const tot = sum(hp) + fortShare;
  if (tot <= 0) return;
  if (fortShare > 0) fort.fortress.hp = Math.max(0, fort.fortress.hp - dmg * fortShare / tot * 0.4);
  const W = { BB: 0.8, CR: 1.0, DD: 1.2, CV: 0.9, LT: 1.1 };
  sd.fleets.forEach((fl, idx) => {
    if (hp[idx] <= 0) return;
    const a = adm(fl);
    let left = dmg * hp[idx] / tot * (a ? 1 - (a.def - 50) / 250 : 1) * (hasTrait(a, 'iron') ? 0.82 : 1);
    const n0 = fleetShips(fl);
    let wt = 0; for (const k of SHIP_KEYS) wt += fl.ships[k] * SHIP[k].hp * W[k];
    if (wt <= 0) return;
    for (const k of SHIP_KEYS) {
      if (!fl.ships[k]) continue;
      const share = left * fl.ships[k] * SHIP[k].hp * W[k] / wt;
      fl.ships[k] = Math.max(0, fl.ships[k] - Math.round(share / SHIP[k].hp));
    }
    const lf = (n0 - fleetShips(fl)) / Math.max(1, n0);
    const mr = (hasTrait(a, 'iron') ? 0.8 : 1) * (hasTrait(a, 'veteran') ? 0.75 : 1) * (a ? 1 - (a.lead - 50) / 200 : 1.1);
    fl.morale = Math.max(0, fl.morale - lf * 120 * mr);
  });
}

function finishBattle(b, res) {
  const s = G.systems[b.sid];
  const fids = [b.att, b.def];
  const lost = [0, 0], men = [0, 0], start = [0, 0];
  const names = [[], []];
  for (let i = 0; i < 2; i++) for (const id of b.sides[i].fleets) {
    const fl = fleetById(id);
    const bf = res.before.get(id);
    if (!fl || !bf) continue;
    const n0 = SHIP_KEYS.reduce((t, k) => t + bf[k], 0);
    start[i] += n0;
    const n1 = fleetShips(fl);
    lost[i] += n0 - n1;
    names[i].push(fl.name);
    if (bf.LT > 0 && fl.troops.length) {
      const fr = clamp(fl.ships.LT / bf.LT, 0, 1);
      if (fr < 1) for (const d of fl.troops) { const lm = Math.round(d.men * (1 - fr)); d.men -= lm; men[i] += lm; }
      fl.troops = fl.troops.filter(d => d.men > 400);
    }
    if (troopMen(fl.troops) > troopCap(fl)) {
      // 揚陸艦の損失で収容しきれない兵員は失われる
      let over = troopMen(fl.troops) - troopCap(fl);
      for (const d of fl.troops) { const c = Math.min(d.men, over); d.men -= c; over -= c; men[i] += c; }
      fl.troops = fl.troops.filter(d => d.men > 400);
    }
    fl.supply = Math.max(0, fl.supply - (res.supplyUse || 15));
    fl.lastBattle = G.day;
    const a = adm(fl);
    // 提督の運命
    if (a && (res.flagLost[id] || n1 < 200)) {
      const r = rand();
      const loserSide = res.loser === i;
      if (r < 0.32) { a.status = 'dead'; a.fleet = null; fl.admiral = null; log(`【訃報】${admiralLabel(a)}が${s.name}会戦で戦死した。`, 'alert', [fl.owner]); }
      else if (r < 0.55 && loserSide) { a.status = 'captured'; a.fleet = null; a.captor = fids[1 - i]; fl.admiral = null; log(`【捕虜】${admiralLabel(a)}が${s.name}会戦で捕虜となった。`, 'alert', [fl.owner]); }
    }
  }
  if (res.fortHp != null && b.fortPid != null) G.planets[b.fortPid].fortress.hp = Math.max(0, res.fortHp);
  for (let i = 0; i < 2; i++) for (const id of b.sides[i].fleets) {
    const fl = fleetById(id);
    if (!fl) continue;
    if (fleetShips(fl) < 200) { const a = adm(fl); if (a) a.fleet = null; removeFleet(fl); continue; }
    if (fl.admiral == null) assignStandIn(fl);
  }
  G.stats.shipsLost[fids[0]] = (G.stats.shipsLost[fids[0]] || 0) + lost[0];
  G.stats.shipsLost[fids[1]] = (G.stats.shipsLost[fids[1]] || 0) + lost[1];
  let resultText;
  if (res.loser >= 0) {
    const w = 1 - res.loser, Lf = fids[res.loser], Wf = fids[w];
    for (const id of b.sides[res.loser].fleets) { const fl = fleetById(id); if (fl && fl.sid === s.id && fl.to == null) retreatFleet(fl, s.id); }
    for (const id of b.sides[w].fleets) {
      const fl = fleetById(id);
      if (!fl) continue;
      fl.morale = Math.min(100, fl.morale + 6); fl.training = Math.min(95, fl.training + 2);
      const a = adm(fl); if (a) { a.victories++; a.xp += 1; }
    }
    for (const id of b.sides[res.loser].fleets) { const a = adm(fleetById(id) || {}); if (a) a.defeats++; }
    const scale = clamp((lost[0] + lost[1]) / 25000, 0.3, 1.8);
    polReact(Wf, 'victory', scale); polReact(Lf, 'defeat', scale);
    if (Wf === G.player && scale >= 1) {
      const top = b.sides[w].fleets.map(fleetById).filter(Boolean).map(adm).filter(a => a && a.victories >= 3).sort((x, y) => y.victories - x.victories)[0];
      if (top) G.flags.heroAdm = top.id;
    }
    resultText = `${FACTION_DEFS[Wf].army}の勝利`;
  } else resultText = '決着つかず（包囲継続）';
  lossWeariness(fids[0], lost[0], men[0]); lossWeariness(fids[1], lost[1], men[1]);
  const rep = {
    sid: b.sid, sys: s.name, att: b.att, def: b.def, start, lost, men, winner: res.loser >= 0 ? fids[1 - res.loser] : null,
    names, text: resultText, day: G.day, fort: b.fortPid != null
  };
  G.lastBattle = rep;
  log(`【会戦】${s.name}：${FACTION_DEFS[b.att].army}${fmt(start[0])}隻 対 ${FACTION_DEFS[b.def].army}${fmt(start[1])}隻 — ${resultText}（損失 ${FACTION_DEFS[b.att].short}${fmt(lost[0])}／${FACTION_DEFS[b.def].short}${fmt(lost[1])}）`, 'battle', [b.att, b.def]);
  computeSupply();
  emit('battleDone', rep);
  return rep;
}
function retreatFleet(fl, fromSid) {
  const s = G.systems[fromSid];
  let best = null, bs = -1e9;
  for (const a of s.adj) {
    const n = G.systems[a.to];
    if (!canEnter(fl.owner, n)) continue;
    if (hostileFleetsAt(n.id, fl.owner)) continue;
    const fp = fortressOf(n);
    if (fp && fp.fortress.hp > 0 && atWar(fl.owner, fp.owner)) continue;
    let sc = 0;
    if (n.owner === fl.owner) sc += 3;
    if (supplyState(fl.owner, n.id) === 2) sc += 2;
    if (!n.owner) sc += 0.5;
    sc += rand() * 0.3;
    if (sc > bs) { bs = sc; best = n.id; }
  }
  if (best == null) {
    const a = adm(fl);
    if (a) { a.status = 'captured'; a.fleet = null; }
    log(`【降伏】${fl.name}は退路を断たれ、${s.name}で降伏した。`, 'alert', [fl.owner]);
    removeFleet(fl);
    return false;
  }
  fl.route = []; fl.dest = best;
  fl.from = fromSid; fl.to = best; fl.sid = null; fl.prog = 0.02;
  fl.ai = { mission: 'retreat', target: best };
  return true;
}

/* ---------- 包囲 ---------- */
function dailySieges() {
  for (const s of G.systems) {
    const mp = mainPlanet(s);
    const here = fleetsAt(s.id);
    if (!mp) {
      // 無人星系：一定期間の駐留で制圧
      if (s.owner) {
        const hostile = here.filter(fl => atWar(fl.owner, s.owner));
        const own = here.some(fl => fl.owner === s.owner);
        if (hostile.length && !own) {
          if (!s.siege || s.siege.by !== hostile[0].owner) s.siege = { by: hostile[0].owner, days: 0 };
          s.siege.days++;
          if (s.siege.days >= 5) {
            const old = s.owner; s.owner = s.siege.by;
            for (const pid of s.planets) G.planets[pid].owner = s.owner;
            s.siege = null; G.terrVer++;
            log(`【制圧】${FACTION_DEFS[s.owner].army}が${s.name}星系を制圧した。`, 'military', [s.owner, old]);
            computeSupply();
          }
        } else s.siege = null;
      }
      continue;
    }
    if (!mp.owner) { s.siege = null; continue; }
    const hostile = here.filter(fl => atWar(fl.owner, mp.owner));
    const own = here.some(fl => fl.owner === mp.owner);
    if (hostile.length && !own) {
      if (!s.siege || s.siege.by !== hostile[0].owner) s.siege = { by: hostile[0].owner, days: 0 };
      s.siege.days++;

function aiPolitics(f) {

  };
  if (f.weariness > 45 && f.res.cr > 2000) tryA('propaganda');
  const keys = Object.keys(f.pfac);
  for (let i = 0; i < 2; i++) {
    const low = keys.slice().sort((a, b) => f.pfac[a].appr * (0.6 + f.pfac[a].power / 100) - f.pfac[b].appr * (0.6 + f.pfac[b].power / 100))[0];

  for (const p of G.planets) if (p.owner === f.id && p.unrest > 72 && !(p.martial > 0) && f.pc >= 8 && !PTYPE[p.type].uninhabited && p.type !== 'fortress') doPlanetAction(f.id, p.id, 'martial');

}

/* ==========================================================

   ========================================================== */
function simAdvance(dtDays) {
  if (!G || G.over || G.pending.length) return;
  G.dayFrac = (G.dayFrac || 0) + dtDays;
  let budget = dtDays;
  while (budget > 0) {
    const step = Math.min(budget, 1 - (G.moveFrac || 0));
    advanceFleets(step);
    G.moveFrac = (G.moveFrac || 0) + step;
    budget -= step;
    if (G.moveFrac >= 1 - 1e-9) {
      G.moveFrac = 0;
      dailyTick();
      if (G.pending.length || G.over) { G.dayFrac = 0; return; }
    }
  }
}
function dailyTick() {
  G.day++;
  computeSupply();
  dailyFleetLogistics();
  dailyEconomy();
  dailyConstruction();
  dailySieges();
  dailyBattles();
  dailyDiplomacy();
  dailyPolitics();
  aiDaily();
  if (G.day % DAYS_PER_MONTH === 0) {
    monthlyEconomy();
    monthlyPolitics();
    recordHistory();
    emit('month');
  }
  emit('day');
}

  onWheel(e) {

  clampCam() {

  },
  hitTest(sx, sy) {

  /* ---------- 描画 ---------- */
  fleetPos(fl) {

  },
  render(dt) {
    if (!G) return;

    const ctx = this.ctx, z = this.cam.z, dpr = this.dpr;
    if (this.terrVer !== G.terrVer || !this.terr) this.buildTerritory();
    if (this.visDay !== G.day || !this.vis || this.visIntel !== G.intel[G.player]) { this.vis = computeVisibility(G.player); this.visDay = G.day; this.visIntel = G.intel[G.player]; }

  drawGrid(ctx) {

    ctx.beginPath();
    for (let x = 0; x <= GAL_W; x += step) { const [sx] = this.w2s(x, 0); ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, this.h); }

      for (let y = 0; y < GAL_H; y += step) { const [sx, sy] = this.w2s(6, y + 6); if (sx > 0) ctx.fillText(String(y / step + 1).padStart(2, '0'), sx, sy + 12); }

  },
  drawLanes(ctx) {
    const z = this.cam.z;

      const a = G.systems[l.a], b = G.systems[l.b];
      const [ax, ay] = this.w2s(a.x, a.y), [bx, by] = this.w2s(b.x, b.y);
      if (Math.max(ax, bx) < -20 || Math.min(ax, bx) > this.w + 20 || Math.max(ay, by) < -20 || Math.min(ay, by) > this.h + 20) continue;

  drawRoutes(ctx) {

      if (fl.to != null) pts.push([G.systems[fl.to].x, G.systems[fl.to].y]);

  },
  etaDays(fl) {

  drawSystems(ctx) {

        ctx.beginPath(); ctx.moveTo(sx, sy - rr * 1.2); ctx.lineTo(sx + rr * 1.2, sy); ctx.lineTo(sx, sy + rr * 1.2); ctx.lineTo(sx - rr * 1.2, sy); ctx.closePath(); ctx.stroke();

        ctx.fillStyle = hexA(oc, 0.95);

  // 星系名の配置：重要な星系から順に、下・右・左・上のうち他の名前や星系と重ならない位置を選ぶ

    const hit = (r) => {
      for (const q of placed) if (r.x < q.x + q.w && r.x + r.w > q.x && r.y < q.y + q.h && r.y + r.h > q.y) return true;

      ctx.font = font;

        { x: sx + rr + 7, y: sy - fs / 2 - 1, al: 'left' },
        { x: sx - rr - 7 - w, y: sy - fs / 2 - 1, al: 'right' }

      for (const c of cands) { const r = { x: c.x, y: c.y, w, h }; if (!hit(r)) { pick = c; break; } }

  },
  drawFleets(ctx) {

      const s = G.systems[sid];

  },

/* ==========================================================
   ui.js — 戦略画面のUI（上部バー・一覧・詳細パネル・通知）
   ========================================================== */
const ICON = {

const PLANET_ICONS = {};
function buildPlanetIcons() {
  for (const t in PTYPE) {
    const c = document.createElement('canvas'); c.width = 68; c.height = 68;
    const g = c.getContext('2d');
    const pal = PTYPE[t].pal;

    g.fillStyle = pal[0]; g.fillRect(0, 0, 68, 68);
    if (t === 'gas') { for (let i = 0; i < 9; i++) { g.fillStyle = i % 2 ? pal[1] : pal[2]; g.globalAlpha = 0.35; g.fillRect(0, 12 + i * 5.5 + rng() * 2, 68, 2 + rng() * 3); } }

    else { for (let i = 0; i < 18; i++) { g.fillStyle = rng() < 0.5 ? pal[1] : pal[2]; g.globalAlpha = 0.25 + rng() * 0.35; g.beginPath(); g.ellipse(10 + rng() * 48, 10 + rng() * 48, 3 + rng() * 10, 2 + rng() * 6, rng() * 3, 0, Math.PI * 2); g.fill(); } }
    g.globalAlpha = 1;
    const sh = g.createRadialGradient(26, 24, 4, 34, 34, 26);
    sh.addColorStop(0, 'rgba(255,255,255,0.18)'); sh.addColorStop(0.55, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.7)');

    PLANET_ICONS[t] = c.toDataURL();
  }
}

      ${canClaim(fl) ? `<button class="btn" type="button" data-act="fleet-claim" data-id="${fl.id}">前哨基地を建設<span class="cost">資金600</span></button>` : ''}
      </div>${!inv.ok && here && mainPlanet(here) && mainPlanet(here).owner && mainPlanet(here).owner !== fl.owner ? `<div class="dim" style="font-size:11.5px">降下作戦：${esc(inv.why)}</div>` : ''}</div>`;
    // 陸戦隊

    const ownP = here ? sysPlanets(here).filter(p => p.owner === fl.owner && p.main) : [];

    html += '</div>';
    // 造船所
    if (own && mp && mp.yard) {
      html += `<div class="sec"><div class="eyebrow"><span>造船所 Lv${mp.yard}</span><span class="dim">同時建造 ${mp.yard}</span></div>`;
      if (!s.yardQueue.length) html += '<div class="dim" style="font-size:12px">建造中の艦艇はない。</div>';
      s.yardQueue.forEach((o, i) => { html += `<div class="row" style="font-size:12.5px"><span class="grow">${SHIP[o.cls].name} ${fmt(o.n)}隻${i >= mp.yard ? '<span class="dim">（待機）</span>' : ''}</span><span class="num dim">残り${o.days}日</span></div><div class="bar" style="color:var(--brass)"><i style="width:${100 - o.days / o.total * 100}%"></i></div>`; });
      html += `<button class="btn block" type="button" data-act="open-prod" data-sid="${s.id}">艦艇を発注する<span class="cost">生産画面</span></button></div>`;
    }
    const rv = own ? reserveTotal(s, G.player) : 0;
    if (rv > 0) {
      const r = s.reserve[G.player];
      html += `<div class="sec"><div class="eyebrow"><span>予備艦 ${fmt(rv)}隻</span></div><div class="dim" style="font-size:12px">${SHIP_KEYS.filter(k => r[k]).map(k => `${SHIP[k].name}${fmt(r[k])}`).join('・')}</div>
        <div class="actions"><button class="btn" type="button" data-act="newfleet" data-sid="${s.id}" ${freeAdmirals(G.player).length && rv >= 500 ? '' : 'disabled'}>新艦隊を編成</button></div>
        <div class="dim" style="font-size:11.5px">この星系に停泊中の艦隊は「予備艦を編入」で吸収できる。</div></div>`;

    // 艦隊
    const vis = MapView.vis || computeVisibility(G.player);

      html += '<div class="sec"><div class="eyebrow">艦隊</div>';
      for (const fl of fls) html += `<button class="btn block" type="button" data-act="sel-fleet" data-id="${fl.id}"><span class="row"><span class="sw" style="background:${FACTION_DEFS[fl.owner].color}"></span>${esc(fl.name)}</span><span class="cost">${fl.owner === G.player ? fmt(fleetShips(fl)) : '約' + fmt(Math.round(fleetShips(fl) / 500) * 500)}隻</span></button>`;
      for (const fl of moving) html += `<button class="btn block" type="button" data-act="sel-fleet" data-id="${fl.id}"><span class="row"><span class="sw" style="background:${FACTION_DEFS[fl.owner].color}"></span>${esc(fl.name)}<span class="dim">（接近中）</span></span><span class="cost">${Math.ceil((1 - fl.prog) * laneBetween(fl.from, fl.to).len / (fleetSpeed(fl) * laneFactor(laneBetween(fl.from, fl.to))))}日</span></button>`;
      html += '</div>';
    }
    if (this.selFleets().length === 0 && fleetsOf(G.player).length) html += '<div class="dim" style="font-size:11.5px">艦隊を選んでから、この星系を右クリック（タッチ操作では「移動先を指定」）すると移動を命じられる。</div>';
    html += '</div>';
    return html;
  },
  planetHTML(p, f, own) {
    const T = PTYPE[p.type];
    let html = `<div class="planet"><img src="${PLANET_ICONS[p.type]}" alt="">
      <div style="min-width:0"><div class="pn"><span class="mincho" style="font-size:14px">${esc(p.name)}</span><span class="chip">${T.name}</span>${p.main ? '<span class="chip gold">主惑星</span>' : ''}${p.owner && p.owner !== G.systems[p.sid].owner ? `<span class="chip">${FACTION_DEFS[p.owner].short}</span>` : ''}</div>`;
    if (T.uninhabited) {
      html += `<div class="pd"><span>無人</span><span>採掘基地 Lv${p.ind}</span>${p.ind && f ? `<span>物資 +${fmt1(planetOutput(p, f).sup)}</span>` : ''}</div>`;
    } else if (p.fortress) {
      const r = p.fortress.hp / p.fortress.max;
      html += `<div class="pd"><span>要塞耐久 <b class="num ${r < 0.4 ? 'bad' : ''}">${Math.round(r * 100)}%</b></span><span>要塞主砲</span><span>守備隊 ${p.garrison.length}個師団（${fmtMen(troopMen(p.garrison))}）</span></div>
        <div class="bar" style="color:${r < 0.4 ? 'var(--bad)' : 'var(--brass)'};margin-top:4px"><i style="width:${r * 100}%"></i></div>`;
    } else {
      const o = f ? planetOutput(p, f) : null;
      html += `<div class="pd"><span>人口 <span class="num">${fmtPop(p.pop)}</span></span>${o ? `<span>食料 <span class="num ${o.food - o.foodCons < 0 ? 'bad' : 'good'}">${fmtSigned(o.food - o.foodCons)}</span></span><span>物資 <span class="num">+${fmt1(o.sup)}</span></span><span>資金 <span class="num">+${fmt1(o.cr)}</span></span>` : ''}</div>`;
      if (p.main) html += `<div class="pd"><span>守備隊 ${p.garrison.length}個師団（${fmtMen(troopMen(p.garrison))}）</span><span>防衛網 Lv${p.def}</span>${own ? `<span class="${p.unrest > 60 ? 'warn' : ''}">不穏 ${Math.round(p.unrest)}</span>${p.origOwner !== p.owner ? `<span>忠誠 ${Math.round(p.loyalty)}</span>` : ''}` : ''}</div>`;
      const st = [];
      if (p.scorched > 0) st.push(`<span class="chip bad">焦土 ${p.scorched}日</span>`);
      if (p.martial > 0) st.push(`<span class="chip warn">戒厳令 ${p.martial}日</span>`);
      if (p.riot > 0) st.push(`<span class="chip bad">暴動</span>`);
      if (st.length) html += `<div class="row wrap" style="margin-top:4px">${st.join('')}</div>`;
    }
    if (own) {
      const kinds = T.uninhabited ? ['mine'] : p.fortress ? ['def'] : p.main ? ['agri', 'ind', 'yard', 'def'] : ['agri', 'ind'];
      if (p.build) {
        html += `<div class="pd" style="margin-top:6px"><span>${BUILD[p.build.kind].name}を建設中</span><span class="num">残り${p.build.days}日</span></div><div class="bar" style="color:var(--brass)"><i style="width:${100 - p.build.days / p.build.total * 100}%"></i></div>`;
      } else {
        html += '<div class="builds">';
        for (const k of kinds) {
          const lvl = buildLevel(p, k);
          if (lvl >= BUILD[k].max) { html += `<span class="chip">${BUILD[k].name} Lv${lvl}（最大）</span>`; continue; }
          const chk = canBuild(p, k, G.player), c = buildCost(p, k);
          html += `<button class="btn sm" type="button" data-act="build" data-pid="${p.id}" data-kind="${k}" ${chk.ok ? '' : 'disabled'} title="${esc(BUILD[k].name)} Lv${lvl + 1}：${esc(costText(c))}・${BUILD[k].days(lvl)}日${chk.ok ? '' : '（' + esc(chk.why) + '）'}">${BUILD[k].name.replace('プラント', '').replace('地帯', '').replace('網', '')} ${lvl}→${lvl + 1}</button>`;
        }
        html += '</div>';
      }
      if (p.main && !T.uninhabited) {
        html += '<div class="builds">';
        for (const t of RECRUIT_KEYS) {
          const chk = canRecruit(p, t, G.player);
          html += `<button class="btn sm" type="button" data-act="recruit" data-pid="${p.id}" data-type="${t}" ${chk.ok ? '' : 'disabled'} title="${esc(GDIV[t].name)}の編成：${esc(costText(recruitCost(t)))}・${GDIV[t].days}日${chk.ok ? '' : '（' + esc(chk.why) + '）'}">${GDIV[t].short}兵を徴募</button>`;
        }
        if (p.recruit.length) html += `<span class="chip">編成中 ${p.recruit.map(r => GDIV[r.type].short + r.days + '日').join(' ')}</span>`;
        html += '</div>';
        if (!p.fortress) html += `<div class="builds">${PLANET_ACTIONS.map(a => `<button class="btn sm" type="button" data-act="planet-act" data-pid="${p.id}" data-a="${a.id}" title="${esc(a.desc)}（${esc(costText(a.cost))}）" ${canAfford(FAC(G.player), a.cost) ? '' : 'disabled'}>${a.name}</button>`).join('')}</div>`;
      }
    }
    html += '</div></div>';
    return html;
  },

  /* ---------- 操作 ---------- */
  act(name, d) {
    if (!G && !['title-start', 'continue', 'open-help', 'close', 'diff'].includes(name)) return;
    const id = d.id != null ? +d.id : null;
    const fl = id != null ? fleetById(id) : null;
    switch (name) {
      case 'speed': { const v = +d.v; if (v === 0) Main.togglePause(true); else Main.setSpeed(v); break; }
      case 'sel-fleet': { const f2 = fleetById(id); if (f2) { this.select({ type: 'fleet', ids: [id] }); const p = MapView.fleetPos(f2); if (Main.isNarrow()) MapView.centerOn(p.x, p.y + 120 / MapView.cam.z); else MapView.centerOn(p.x, p.y); } break; }
      case 'sel-sys': { const s = G.systems[id]; this.select({ type: 'sys', id }); if (Main.isNarrow()) MapView.centerOn(s.x, s.y + 120 / MapView.cam.z); else MapView.centerOn(s.x, s.y); break; }
      case 'close-ctx': this.select(null); break;
      case 'toggle-left': { const l = document.getElementById('left'); l.hidden = !l.hidden; break; }
      case 'move-cancel': this.setMoveMode(false); break;
      case 'fleet-move': this.setMoveMode(!this.moveMode); this.renderCtx(true); break;
      case 'fleet-stop': if (fl) { stopFleet(fl); this.renderCtx(true); } break;
      case 'fleet-absorb': if (fl) { const n = absorbReserves(fl); this.toast(n ? `${fl.name}に予備艦${fmt(n)}隻を編入した。` : '編入できる予備艦がない（または指揮上限）。'); this.renderCtx(true); } break;
      case 'fleet-invade': if (fl) { const r = launchInvasion(fl); if (!r.ok) this.toast(r.why, 'alert'); this.renderCtx(true); } break;
      case 'fleet-assault': if (fl) { const r = assaultFortress(fl); if (!r.ok) this.toast(r.why, 'alert'); } break;
      case 'fleet-claim': if (fl) { const r = claimSystem(fl); if (!r.ok) this.toast(r.why, 'alert'); this.renderCtx(true); } break;
      case 'fleet-load': if (fl) { const r = loadTroops(fl, +d.pid, +d.div); if (!r.ok) this.toast(r.why, 'alert'); this.renderCtx(true); } break;
      case 'fleet-unload': if (fl) { const r = unloadTroops(fl, +d.pid, +d.div); if (!r.ok) this.toast(r.why, 'alert'); this.renderCtx(true); } break;
      case 'fleet-merge': if (fl) Modals.merge(fl); break;
      case 'fleet-split': if (fl) Modals.split(fl); break;
      case 'fleet-adm': if (fl) Modals.assignAdmiral(fl); break;
      case 'build': { const r = startBuild(plOf(+d.pid), d.kind, G.player); if (!r.ok) this.toast(r.why, 'alert'); else this.toast(`${plOf(+d.pid).name}で${BUILD[d.kind].name}の建設を始めた。`); this.renderCtx(true); break; }
      case 'recruit': { const r = recruitDiv(plOf(+d.pid), d.type, G.player); if (!r.ok) this.toast(r.why, 'alert'); else this.toast(`${plOf(+d.pid).name}で${GDIV[d.type].name}の編成を始めた。`); this.renderCtx(true); break; }
      case 'planet-act': { const r = doPlanetAction(G.player, +d.pid, d.a); if (!r.ok) this.toast(r.why, 'alert'); this.renderCtx(true); break; }
      case 'newfleet': Modals.newFleet(G.systems[+d.sid]); break;
      case 'open-pol': Modals.politics(); break;
      case 'open-eco': Modals.economy(); break;
      case 'open-prod': Modals.production(d.sid != null ? +d.sid : null); break;
      case 'open-adm': Modals.admirals(); break;
      case 'open-dip': Modals.diplomacy(); break;
      case 'open-menu': Modals.menu(); break;
      case 'open-help': Modals.help(); break;
      default: Modals.act(name, d);
    }
    this.updateTop();
  },

  /* ---------- 通知・ツールチップ ---------- */
  toast(text, kind) {
    const box = document.getElementById(Main.screen === 'strat' ? 'toasts' : 'toasts');
    if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'alert' ? ' alert' : '');
    el.textContent = text;
    box.appendChild(el);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 450); }, 4200);
  },
  showTip(h, x, y) {
    const tip = document.getElementById('tooltip');
    let html = '';
    if (h.type === 'sys') {
      const s = G.systems[h.id], mp = mainPlanet(s);
      html = `<b>${esc(s.name)}</b> <span class="dim">${s.owner ? esc(FAC(s.owner) ? FAC(s.owner).short : FACTION_DEFS[s.owner].short) : '無主'}</span><br>`;
      if (mp) html += `${esc(PTYPE[mp.type].name)}・人口${fmtPop(mp.pop)}・守備${mp.garrison.length}個師団<br>`;
      html += `<span class="dim">惑星${s.planets.length}</span>`;
      if (s.siege) html += ` <span class="bad">包囲中</span>`;
      if (this.selFleets().some(f => f.owner === G.player)) {
        const fl = this.selFleets().find(f => f.owner === G.player);
        const p = findPath(fl.owner, fl.to != null ? fl.to : fl.sid, s.id);
        MapView.moveTarget = p ? { sid: s.id, path: p } : null;
        if (p) html += `<br><span class="dim">右クリックで移動（約${Math.ceil(pathDays(fl, p) + (fl.to != null ? MapView.etaDays(Object.assign({}, fl, { route: [] })) : 0))}日）</span>`;
        else if (s.id !== fl.sid) html += '<br><span class="bad">到達できる航路がない</span>';
      }
    } else {
      const fl = fleetById(h.id);
      const a = adm(fl);
      html = `<b>${esc(fl.name)}</b><br>${esc(a ? admiralLabel(a) : '')}<br><span class="num">${fl.owner === G.player ? fmt(fleetShips(fl)) : '約' + fmt(Math.round(fleetShips(fl) / 500) * 500)}隻</span> <span class="dim">${esc(fleetStatus(fl))}</span>`;
    }
    tip.innerHTML = html; tip.hidden = false;
    const r = document.getElementById('strat').getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = clamp(x + 16, 8, r.width - tw - 8) + 'px';
    tip.style.top = clamp(y + 16, 8, r.height - th - 8) + 'px';
  },
  hideTip() { const t = document.getElementById('tooltip'); if (t) t.hidden = true; MapView.moveTarget = null; },

  /* ---------- モーダル ---------- */
  openModal(html, opts) {
    opts = opts || {};
    const root = document.getElementById('modalRoot');
    const bd = document.createElement('div');
    bd.className = 'backdrop';
    bd.innerHTML = `<div class="modal panel ticks ${opts.cls || ''}" role="dialog" aria-modal="true">${html}</div>`;
    if (opts.closable !== false) bd.addEventListener('click', e => { if (e.target === bd) this.closeModal(); });
    root.appendChild(bd);
    this.modalStack.push({ el: bd, closable: opts.closable !== false, onClose: opts.onClose, kind: opts.kind });
    bd.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      e.stopPropagation(); e.preventDefault();
      this.act(el.dataset.act, el.dataset, el);
    });
    const f = bd.querySelector('button:not([disabled])');
    if (f && opts.focus !== false) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* noop */ } }, 30);
    return bd;
  },
  closeModal() {
    const m = this.modalStack.pop();
    if (!m) return;
    m.el.remove();
    if (m.onClose) m.onClose();
  },
  closeAll() { while (this.modalStack.length) { const m = this.modalStack.pop(); m.el.remove(); } },
  modalOpen() { return this.modalStack.length > 0; }
};
function barCol(v) { return v < 25 ? 'var(--bad)' : v < 50 ? 'var(--warn)' : 'var(--good)'; }
function fleetStatus(fl) {
  if (fleetEngaged(fl)) return '交戦中';
  if (fl.to != null) return fl.ai && fl.ai.mission === 'retreat' ? '撤退中' : `移動中 → ${G.systems[fl.dest != null ? fl.dest : fl.to].name}`;
  const s = G.systems[fl.sid];
  if (s.owner && s.owner !== fl.owner && atWar(fl.owner, s.owner)) return '敵星系を包囲中';
  if (fl.supply < 30) return '補給欠乏';
  return `${s.name}で待機`;
}

  act(name, d) {

      case 'tax': setTax(G.player, f.taxRate + (+d.v)); this.refresh(); return;

      case 'loan': { const r = takeLoan(G.player); UI.toast(r.ok ? 'ヘルメスから資金3,000を借り入れた。' : r.why, r.ok ? '' : 'alert'); this.refresh(); return; }
      case 'intel': { if (f.res.cr < 600) { UI.toast('資金が足りない。', 'alert'); return; } if (!tradeAvailable(G.player)) { UI.toast('自治領と取引できない。', 'alert'); return; } f.res.cr -= 600; L(f, 'cr', 'politics', -600); G.intel[G.player] = (G.intel[G.player] || 0) + 90; UI.toast('90日間、すべての艦隊の位置が判明する。'); this.refresh(); return; }

          <td><button class="btn sm" type="button" data-act="trade" data-item="${it}" data-q="1000">1,000</button> <button class="btn sm" type="button" data-act="trade" data-item="${it}" data-q="5000">5,000</button></td>
          <td><button class="btn sm" type="button" data-act="trade" data-item="${it}" data-q="-1000">1,000</button> <button class="btn sm" type="button" data-act="trade" data-item="${it}" data-q="-5000">5,000</button></td></tr>`).join('')}
          </tbody></table></div>
          <div class="row wrap"><button class="btn sm" type="button" data-act="loan" ${f.loans.length < 2 ? '' : 'disabled'}>融資を受ける<span class="cost">+3,000／毎月−120×30</span></button><span class="dim" style="font-size:12px">返済中の融資 ${f.loans.length}件${f.bonds.length ? `・国債 ${f.bonds.length}件` : ''}</span></div>`;
      }
      html += '</div>';
      // 惑星一覧
      const ps = G.planets.filter(p => p.owner === G.player && !PTYPE[p.type].uninhabited && p.type !== 'fortress').sort((a, c) => c.pop - a.pop);
      html += `<div class="card"><div class="eyebrow">惑星別の生産（1日あたり）</div><div class="tbl-wrap"><table class="t"><thead><tr><th>惑星</th><th>型</th><th class="r">人口</th><th class="r">食料収支</th><th class="r">物資</th><th class="r">資金</th><th class="r">不穏</th></tr></thead><tbody>
        ${ps.map(p => { const o = planetOutput(p, f); const blk = isBlockaded(G.systems[p.sid], G.player); return `<tr><td>${esc(p.name)}${blk ? ' <span class="chip bad">封鎖</span>' : ''}</td><td>${PTYPE[p.type].name}</td><td class="r">${fmtPop(p.pop)}</td><td class="r ${o.food - o.foodCons < 0 ? 'bad' : 'good'}">${fmtSigned(o.food - o.foodCons)}</td><td class="r">${fmt1(o.sup)}</td><td class="r">${fmt1(o.cr)}</td><td class="r ${p.unrest > 60 ? 'warn' : ''}">${Math.round(p.unrest)}</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
      html += '</div></div>';
      return html;
    }, { cls: 'wide' });
  },

  /* ---------- 生産 ---------- */
  production(focusSid) {
    if (this._qty == null) this._qty = 1000;
    this.show(() => {
      const f = FAC(G.player);
      let html = this.head('Production · 生産', '造船と徴募');
      html += '<div class="body"><div class="stack" style="gap:16px">';
      html += `<div class="row wrap"><span class="dim">発注単位</span><div class="seg">${[500, 1000, 2000].map(q => `<button type="button" data-act="qty" data-v="${q}" class="${this._qty === q ? 'on' : ''}">${fmt(q)}隻</button>`).join('')}</div>
        <span class="dim" style="font-size:12px">資金 ${fmt(f.res.cr)}・物資 ${fmt(f.res.sup)}・人員 ${fmt(f.res.mp)}万</span></div>`;
      const yards = G.systems.filter(s => s.owner === G.player && mainPlanet(s) && mainPlanet(s).yard > 0).sort((a, b) => (b.id === focusSid) - (a.id === focusSid) || mainPlanet(b).yard - mainPlanet(a).yard);
      if (!yards.length) html += '<div class="card dim">造船所がない。人口3億以上の主惑星に造船所を建設しよう。</div>';
      for (const s of yards) {
        const mp = mainPlanet(s);
        const blk = isBlockaded(s, G.player);
        html += `<div class="card"><div class="row"><h3>${esc(s.name)}造船所</h3><span class="chip">Lv${mp.yard}・同時建造${mp.yard}</span>${blk ? '<span class="chip bad">封鎖中（停止）</span>' : ''}<span class="dim" style="margin-left:auto;font-size:12px">発注 ${s.yardQueue.length}/6</span></div>`;
        if (s.yardQueue.length) html += '<div class="stack" style="gap:4px">' + s.yardQueue.map((o, i) => `<div class="row" style="font-size:12.5px"><span class="grow">${SHIP[o.cls].name} ${fmt(o.n)}隻${i >= mp.yard ? ' <span class="dim">待機</span>' : ''}</span><span class="num dim">残り${o.days}日</span></div><div class="bar" style="color:var(--brass)"><i style="width:${100 - o.days / o.total * 100}%"></i></div>`).join('') + '</div>';
        html += '<div class="tbl-wrap"><table class="t"><thead><tr><th>艦種</th><th class="r">火力</th><th class="r">耐久</th><th class="r">射程</th><th class="r">速度</th><th>費用</th><th class="r">日数</th><th></th></tr></thead><tbody>';
        for (const k of SHIP_KEYS) {
          const S = SHIP[k], c = shipOrderCost(G.player, k, this._qty), chk = canOrderShips(s, G.player, k, this._qty);
          html += `<tr><td>${S.name}${k === 'CV' ? '<span class="dim">（艦載機）</span>' : k === 'DD' ? '<span class="dim">（対空）</span>' : k === 'LT' ? `<span class="dim">（兵員${S.troop}名/隻）</span>` : ''}</td><td class="r">${S.atk}</td><td class="r">${S.hp}</td><td class="r">${S.range}</td><td class="r">${S.speed}</td><td class="num" style="font-size:11.5px">${costText(c)}</td><td class="r">${shipOrderDays(k, mp.yard)}</td>
            <td><button class="btn sm" type="button" data-act="order" data-sid="${s.id}" data-cls="${k}" data-n="${this._qty}" ${chk.ok ? '' : 'disabled'} title="${esc(chk.ok ? '' : chk.why)}">発注</button></td></tr>`;
        }
        html += '</tbody></table></div></div>';
      }
      // 予備艦
      const rs = G.systems.filter(s => s.owner === G.player && reserveTotal(s, G.player) > 0);
      if (rs.length) {
        html += '<div class="card"><div class="eyebrow">予備艦（竣工済み・未配属）</div>';
        for (const s of rs) html += `<div class="row"><span class="grow">${esc(s.name)}：${SHIP_KEYS.filter(k => s.reserve[G.player][k]).map(k => SHIP[k].name + fmt(s.reserve[G.player][k])).join('・')}</span><button class="btn sm" type="button" data-act="newfleet" data-sid="${s.id}" ${freeAdmirals(G.player).length && reserveTotal(s, G.player) >= 500 ? '' : 'disabled'}>新艦隊を編成</button></div>`;
        html += '<div class="dim" style="font-size:12px">停泊中の艦隊は、星系パネルの「予備艦を編入」で補充できる。</div></div>';
      }
      // 徴募
      const ps = G.planets.filter(p => p.owner === G.player && p.main && !PTYPE[p.type].uninhabited && (p.pop >= 1 || p.fortress)).sort((a, b) => b.pop - a.pop);
      html += `<div class="card"><div class="eyebrow">地上部隊の徴募</div><div class="tbl-wrap"><table class="t"><thead><tr><th>惑星</th><th class="r">守備隊</th><th>編成中</th>${RECRUIT_KEYS.map(t => `<th>${GDIV[t].name}<div class="dim" style="font-family:var(--f-ui);letter-spacing:0;font-size:10.5px">${costText(recruitCost(t))}</div></th>`).join('')}</tr></thead><tbody>`;
      for (const p of ps) {
        html += `<tr><td>${esc(p.name)}</td><td class="r">${p.garrison.length}（${fmtMen(troopMen(p.garrison))}）</td><td>${p.recruit.map(r => GDIV[r.type].short + r.days + '日').join(' ') || '<span class="dim">—</span>'}</td>`;
        for (const t of RECRUIT_KEYS) { const chk = canRecruit(p, t, G.player); html += `<td><button class="btn sm" type="button" data-act="recruit2" data-pid="${p.id}" data-type="${t}" ${chk.ok ? '' : 'disabled'} title="${esc(chk.ok ? '' : chk.why)}">徴募</button></td>`; }
        html += '</tr>';
      }
      html += '</tbody></table></div><div class="dim" style="font-size:12px">歩兵は守りに強く安価。機甲は平原で強いが山岳と市街で鈍る。強襲降下兵団は降下時の損害が半分で精強。</div></div>';
      html += '</div></div>';
      return html;
    }, { cls: 'wide' });
  },

  /* ---------- 提督 ---------- */
  admirals() {
    this.show(() => {
      const f = FAC(G.player);
      const list = G.admirals.filter(a => a.fid === G.player).sort((a, b) => (a.status !== 'active') - (b.status !== 'active') || b.rank - a.rank || (b.lead + b.atk + b.def) - (a.lead + a.atk + a.def));
      let html = this.head('Admirals · 提督', '提督名簿');
      html += `<div class="body"><div class="row wrap" style="margin-bottom:10px"><span class="dim" style="font-size:12.5px">政治力 ${Math.round(f.pc)}。昇進（政治力10）で忠誠と統率が上がる。統率が高いほど多くの艦艇を指揮できる。</span><button class="btn sm" type="button" data-act="pol-act" data-id="recruitAdm" ${f.pc >= 20 ? '' : 'disabled'} style="margin-left:auto">提督を登用<span class="cost">政治力20</span></button></div>
        <div class="tbl-wrap"><table class="t"><thead><tr><th>提督</th><th>階級</th><th class="r">統率</th><th class="r">攻撃</th><th class="r">防御</th><th class="r">機動</th><th class="r">政治</th><th>特性</th><th>派閥</th><th class="r">忠誠</th><th>状態</th><th></th></tr></thead><tbody>`;
      for (const a of list) {
        const fl = a.fleet != null ? fleetById(a.fleet) : null;
        const st = a.status === 'dead' ? '<span class="bad">戦死</span>' : a.status === 'captured' ? '<span class="warn">捕虜</span>' : a.status === 'retired' ? '<span class="dim">退役</span>' : fl ? esc(fl.name) : '<span class="dim">待機</span>';
        html += `<tr><td class="mincho" style="font-size:13.5px">${esc(a.name)}</td><td>${RANKS[a.rank]}</td><td class="r">${a.lead}</td><td class="r">${a.atk}</td><td class="r">${a.def}</td><td class="r">${a.mob}</td><td class="r">${a.pol}</td>
          <td>${a.traits.map(t => `<span class="chip gold" title="${esc(TRAITS[t].desc)}">${TRAITS[t].name}</span>`).join(' ')}</td><td class="dim">${a.aff ? esc(PFAC_DEFS[a.aff].name) : '—'}</td>
          <td class="r ${a.loyalty < 35 ? 'bad' : ''}">${Math.round(a.loyalty)}</td><td>${st}</td>
          <td>${a.status === 'active' ? `<button class="btn sm" type="button" data-act="promote" data-id="${a.id}" ${f.pc >= 10 && a.rank < 5 ? '' : 'disabled'}>昇進</button>` : ''}</td></tr>`;
      }
      html += '</tbody></table></div></div>';
      return html;
    }, { cls: 'wide' });
  },
  assignAdmiral(fl) {
    this.show(() => {
      const free = freeAdmirals(G.player).sort((a, b) => (b.lead + b.atk + b.def + b.mob) - (a.lead + a.atk + a.def + a.mob));
      let html = this.head('Command · 任命', `${esc(fl.name)}の司令官`);
      html += '<div class="body"><div class="stack">';
      if (!free.length) html += '<div class="dim">待機中の提督がいない。政治画面か提督名簿から登用できる。</div>';
      for (const a of free) html += `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px"><div class="grow"><b class="mincho">${esc(admiralLabel(a))}</b><div class="dim" style="font-size:12px">統率${a.lead}・攻撃${a.atk}・防御${a.def}・機動${a.mob}　${a.traits.map(t => TRAITS[t].name).join('・')}</div></div><button class="btn sm primary" type="button" data-act="assign" data-fl="${fl.id}" data-id="${a.id}">任命</button></div>`;
      html += '</div></div>';
      return html;
    }, { cls: 'narrow' });
  },
  newFleet(s) {
    this.show(() => {
      const free = freeAdmirals(G.player).sort((a, b) => (b.lead + b.atk + b.def + b.mob) - (a.lead + a.atk + a.def + a.mob));
      let html = this.head('New Fleet · 艦隊編成', `${esc(s.name)}で新艦隊を編成`);
      html += `<div class="body"><div class="dim" style="font-size:12.5px;margin-bottom:10px">予備艦${fmt(reserveTotal(s, G.player))}隻を新しい艦隊にまとめる。司令官を選んでほしい。新造艦の練度は低い。</div><div class="stack">`;
      if (!free.length) html += '<div class="dim">待機中の提督がいない。</div>';
      for (const a of free) html += `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px"><div class="grow"><b class="mincho">${esc(admiralLabel(a))}</b><div class="dim" style="font-size:12px">統率${a.lead}・攻撃${a.atk}・防御${a.def}・機動${a.mob}　指揮上限${fmt(admiralMaxShips(a))}隻</div></div><button class="btn sm primary" type="button" data-act="mkfleet" data-sid="${s.id}" data-id="${a.id}">編成</button></div>`;
      html += '</div></div>';
      return html;
    }, { cls: 'narrow' });
  },
  merge(fl) {
    this.show(() => {
      const others = fleetsAt(fl.sid).filter(o => o !== fl && o.owner === fl.owner);
      let html = this.head('Merge · 合流', '艦隊の合流');
      html += '<div class="body"><div class="stack">';
      for (const o of others) html += `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px"><div class="grow"><b>${esc(o.name)}</b><div class="dim" style="font-size:12px">${fmt(fleetShips(o))}隻・${esc(adm(o) ? adm(o).name : '')}</div></div>
        <button class="btn sm" type="button" data-act="domerge" data-a="${fl.id}" data-b="${o.id}">${esc(fl.name)}へ吸収</button><button class="btn sm" type="button" data-act="domerge" data-a="${o.id}" data-b="${fl.id}">${esc(o.name)}へ合流</button></div>`;
      html += '<div class="dim" style="font-size:12px">指揮上限を超えた分は元の艦隊に残る。吸収された側の提督は待機となる。</div></div></div>';
      return html;
    }, { cls: 'narrow' });
  },
  split(fl) {
    if (!this._splitFrac) this._splitFrac = 0.5;
    this.show(() => {
      const free = freeAdmirals(G.player);
      let html = this.head('Detach · 分派', `${esc(fl.name)}から艦隊を分派`);
      html += `<div class="body"><div class="row wrap" style="margin-bottom:10px"><span class="dim">分派する割合</span><div class="seg">${[0.25, 0.5, 0.75].map(v => `<button type="button" data-act="splitfrac" data-v="${v}" class="${this._splitFrac === v ? 'on' : ''}">${v * 100}%（約${fmt(fleetShips(fl) * v)}隻）</button>`).join('')}</div></div><div class="stack">`;
      for (const a of free) html += `<div class="row" style="border-bottom:1px solid var(--line);padding-bottom:8px"><div class="grow"><b class="mincho">${esc(admiralLabel(a))}</b><div class="dim" style="font-size:12px">統率${a.lead}・攻撃${a.atk}・防御${a.def}・機動${a.mob}</div></div><button class="btn sm primary" type="button" data-act="dosplit" data-fl="${fl.id}" data-frac="${this._splitFrac}" data-id="${a.id}">この提督に任せる</button></div>`;
      html += '</div></div>';
      return html;
    }, { cls: 'narrow' });
  },

  /* ---------- 外交 ---------- */
  diplomacy() {
    this.show(() => {
      const f = FAC(G.player), e = mainEnemy(G.player), E = FAC(e);
      const r = rel(G.player, e);
      const intel = G.intel[G.player] > 0;
      let html = this.head('Diplomacy · 外交', '外交と諜報');
      html += '<div class="body"><div class="grid2">';
      const vis = MapView.vis || computeVisibility(G.player);
      const visF = G.fleets.filter(fl => fl.owner === e && fleetVisibleTo(fl, G.player, vis));
      const approx = v => intel ? Math.round(v) : `${Math.max(0, Math.round(v / 10) * 10 - 10)}〜${Math.min(100, Math.round(v / 10) * 10 + 10)}`;
      const tc = POL_ACTIONS.find(a => a.id === 'truce').cost(f);
      html += `<div class="card" style="border-top:2px solid ${FACTION_DEFS[e].color}"><div class="row"><h3 style="color:${FACTION_DEFS[e].color}">${esc(E.name)}</h3><span class="chip ${r.truce > 0 ? 'good' : 'bad'}" style="margin-left:auto">${r.truce > 0 ? `停戦中 残り${r.truce}日` : '交戦中'}</span></div>
        <div class="kv"><span>支配星系</span><span>${G.systems.filter(s => s.owner === e).length}</span><span>確認済みの艦隊</span><span>${visF.length}個・約${fmt(Math.round(sum(visF, fleetShips) / 1000) * 1000)}隻</span>
        <span>安定度（推定）</span><span>${approx(E.stability)}</span><span>厭戦感情（推定）</span><span>${approx(E.weariness)}</span></div>
        <div class="dim" style="font-size:12px">停戦の成否は相手の厭戦感情・戦況・国内事情で決まる。敵国の厭戦感情が極めて高まり領土の3割を失えば、講和を申し入れてくる。</div>
        <button class="btn" type="button" data-act="pol-act" data-id="truce" ${r.truce > 0 || !canAfford(f, tc) ? 'disabled' : ''}>停戦を提案する<span class="cost">${costText(tc)}</span></button></div>`;
      const N = G.factions.NEU;
      const nr = rel(G.player, 'NEU');
      html += `<div class="card" style="border-top:2px solid var(--neu)"><div class="row"><h3 class="c-NEU">ヘルメス自治領</h3><span class="chip ${N.alive ? (nr.war ? 'bad' : 'good') : ''}" style="margin-left:auto">${!N.alive ? '併合済み' : nr.war ? '交戦中' : '中立'}</span></div>
        <div class="dim" style="font-size:12px;line-height:1.7">二大国の間に立つ交易国家。食料と物資の売買、融資、情報の提供に応じる。中立を保つ限り、どちらの艦隊もヘルメス回廊を通れない。</div>
        <div class="row wrap"><button class="btn sm" type="button" data-act="intel" ${N.alive && !nr.war && f.res.cr >= 600 ? '' : 'disabled'}>敵情報を買う<span class="cost">資金600・90日</span></button>${intel ? `<span class="chip good">情報有効 残り${G.intel[G.player]}日</span>` : ''}
        <button class="btn sm danger" type="button" data-act="war-neu" ${N.alive && !nr.war ? '' : 'disabled'}>宣戦布告（中立侵犯）</button></div></div>`;
      const R = G.factions.REB;
      if (R && R.alive) html += `<div class="card" style="border-top:2px solid var(--reb)"><h3 class="c-REB">${esc(R.name)}</h3><div class="dim" style="font-size:12px">${esc(FACTION_DEFS[R.origin].name)}から離反した反乱勢力。${G.systems.filter(s => s.owner === 'REB').length}星系を支配。${R.origin === G.player ? 'あなたの政府と交戦中。' : '敵国の内戦はあなたの好機となる。'}</div></div>`;
      html += '</div></div>';
      return html;
    }, { cls: 'wide' });
  },

  /* ---------- メニュー・遊び方 ---------- */
  menu() {
    this.show(() => {
      const has = Main.hasSave(SAVE_KEY), auto = Main.hasSave(AUTO_KEY);
      return `${this.head('Menu · メニュー', 'メニュー')}<div class="body"><div class="stack">
        <button class="btn block" type="button" data-act="save">このブラウザに保存する<span class="cost">手動セーブ</span></button>
        <button class="btn block" type="button" data-act="load" ${has ? '' : 'disabled'}>手動セーブを読み込む<span class="cost">${has ? esc(Main.saveLabel(SAVE_KEY)) : 'なし'}</span></button>
        <button class="btn block" type="button" data-act="loadauto" ${auto ? '' : 'disabled'}>自動保存を読み込む<span class="cost">${auto ? esc(Main.saveLabel(AUTO_KEY)) : 'なし'}</span></button>
        <button class="btn block" type="button" data-act="open-help">遊び方</button>
        <button class="btn block danger" type="button" data-act="to-title">タイトルに戻る</button>
        <div class="dim" style="font-size:12px">毎月1日に自動保存する。保存はこのブラウザだけに残る。</div></div></div>`;
    }, { cls: 'narrow' });
  },
  help() {
    this.show(() => `${this.head('How to play · 遊び方', '遊び方')}<div class="body help">
      <p>あなたは国家の指導者として、艦隊・地上軍・経済・政治のすべてを預かる。時間は止めたり速めたりできる（<kbd>Space</kbd>で停止、<kbd>1</kbd>〜<kbd>4</kbd>で速度）。</p>
      <h3>勝利と敗北</h3>
      <ul><li>勝利：敵国の首都惑星を占領する／敵国の安定度が崩壊して降伏する／疲弊した敵国から講和の申し入れを受ける。</li>
      <li>敗北：自国の首都が陥落する／支持率22%未満が4か月続く（失脚）／共和国では議会選挙で得票率40%を割る／安定度が崩壊する。</li></ul>
      <h3>星図と艦隊</h3>
      <ul><li>艦隊をクリックで選択し、星系を右クリックすると航路に沿って移動する。タッチ操作では「移動先を指定」を押してから星系をタップする。Shift＋クリックで複数の艦隊を選べる。</li>
      <li>敵艦隊と同じ星系に入ると会戦になる。「戦術指揮」で自ら戦うか、「自動解決」で結果だけを見るかを選べる。</li>
      <li>暗黒星雲が両国を隔て、通れるのはケルベロス要塞の回廊、中立国ヘルメスの回廊、遅く危険な星雲航路だけだ。ヘルメスを通るには中立を破る必要がある。</li>
      <li>航路は敵の要塞を自動で避けて引かれる。要塞の前で足止めされると要塞砲を浴びるので、要塞を攻めるときは要塞の星系そのものを目的地に選ぶこと。</li>
      <li>自国の補給網（首都とつながった星系）から離れると艦内の補給が減り、尽きると士気が崩れ艦艇が脱落する。</li></ul>
      <h3>艦隊戦</h3>
      <ul><li>各艦隊は戦艦・巡航艦・駆逐艦・宇宙母艦・揚陸艦の分艦隊に分かれて戦う。左クリック（ドラッグで範囲）で選択し、右クリックで移動、敵を右クリックで攻撃。</li>
      <li>側面や背面から撃つと損害は1.4〜1.8倍になり、敵の士気が崩れる。陣形：横陣（標準）、紡錘陣（突破・高速だが側面に弱い）、凹形陣（正面の敵を包む）、円陣（側背攻撃を受けないが火力が落ちる）。</li>
      <li>主砲斉射（3秒間2.6倍の火力、その後冷却）と突撃（速度と火力が上がり被害も増える）を使いどころで。母艦は艦載機を自動で発進させ、駆逐艦はそれを迎え撃つ。</li>
      <li>要塞の主砲は射線上の艦隊をまとめて薙ぎ払う。充填の光が見えたら射線から逃げること。</li></ul>
      <h3>地上戦</h3>
      <ul><li>敵艦隊のいない星系で、陸戦隊を載せた艦隊が「降下作戦」を実行できる。陸戦隊は揚陸艦に搭載し、自国の惑星で守備隊から乗せる。</li>
      <li>降下地点を最大3か所選ぶ。対空陣地や軍事基地の近くでは降下時の損害が大きい。軌道爆撃で防御を削れるが、市街を撃てば民間人が死に、国内の反発を招く。</li>
      <li>首都区画を制圧すれば惑星は降伏する。主惑星が落ちると、星系内の植民地も従う。</li></ul>
      <h3>経済と兵站</h3>
      <ul><li>食料は人口と軍が毎日消費する。穀倉惑星を失う、封鎖されるなどで不足すると、暴動・士気低下・安定度の急落が起きる。</li>
      <li>物資は造船・建設・艦隊の補給に、人員は艦艇の乗員と兵員に使う。人員が尽きたら動員令を検討しよう。</li>
      <li>焦土作戦で惑星の食料を引き上げれば、占領した敵がその住民を養う羽目になる。</li></ul>
      <h3>政治</h3>
      <ul><li>帝国では門閥貴族派・軍部・改革派、共和国では主戦派・和平派・財界が勢力を争う。勝敗、税、政策、事件への対応で各派の支持が動く。</li>
      <li>不満が極まると、帝国では貴族連合の反乱、共和国では軍事クーデターが起き、星系と艦隊が離反する。</li></ul>

function battleNarrative(rep) {
  const a = FACTION_DEFS[rep.att].army, d = FACTION_DEFS[rep.def].army;
  if (rep.winner == null) return `${rep.sys}星系での戦闘は決着がつかなかった。${rep.fort ? '要塞は持ちこたえ、包囲は続いている。' : '両軍は睨み合ったまま陣を保っている。'}`;
  const w = FACTION_DEFS[rep.winner].army, l = rep.winner === rep.att ? d : a;
  const li = rep.winner === rep.att ? 1 : 0;
  const frac = rep.lost[li] / Math.max(1, rep.start[li]);
  const deg = frac > 0.55 ? '壊滅的な打撃を受け' : frac > 0.3 ? '大きな損害を出し' : '戦列を保ったまま';
  return `${w}が戦場を制した。${l}は${deg}、隣接星系へ退いた。`;
}
function playerRetreat(b) {
  const pi = b.sides[0].fid === G.player ? 0 : 1;
  for (const id of b.sides[pi].fleets) {
    const fl = fleetById(id);
    if (!fl) continue;
    for (const k of SHIP_KEYS) fl.ships[k] = Math.max(0, fl.ships[k] - Math.round(fl.ships[k] * 0.03));
    fl.morale = Math.max(10, fl.morale - 5);
    retreatFleet(fl, b.sid);
  }
  log(`【撤退】${G.systems[b.sid].name}星系から交戦を避けて撤退した。`, 'military', [G.player]);
}
function cancelInvasion(inv) {
  for (const d of inv.divs) {
    let fl = fleetById(d.fleetId);
    if (!fl || fl.owner !== inv.att) fl = fleetsAt(inv.sid).find(f => f.owner === inv.att);
    if (fl) fl.troops.push({ id: d.id, type: d.type, men: d.men, morale: d.morale });
  }
}
function drawSpark(c, key) {
  if (!G) return;
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const hist = G.history.slice(-36).map(h => h.f[G.player]).filter(Boolean);
  if (hist.length < 2) { g.fillStyle = 'rgba(142,154,176,0.7)'; g.font = '22px "Zen Kaku Gothic New", sans-serif'; g.fillText('1か月後から推移を表示', 12, H / 2 + 8); return; }
  const vals = hist.map(h => h[key]);
  const mn = Math.min(0, ...vals), mx = Math.max(...vals, 1);
  const pad = 8;
  const X = i => pad + i / (vals.length - 1) * (W - pad * 2), Y = v => H - pad - (v - mn) / (mx - mn || 1) * (H - pad * 2);
  g.strokeStyle = 'rgba(120,150,190,0.15)'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) { const y = pad + i * (H - pad * 2) / 3; g.beginPath(); g.moveTo(pad, y); g.lineTo(W - pad, y); g.stroke(); }
  const col = key === 'food' ? '#78c595' : key === 'sup' ? '#c4a873' : key === 'mp' ? '#9fb6d8' : '#5fb2e8';
  g.beginPath(); vals.forEach((v, i) => { if (i) g.lineTo(X(i), Y(v)); else g.moveTo(X(i), Y(v)); });
  g.lineTo(X(vals.length - 1), H - pad); g.lineTo(X(0), H - pad); g.closePath();
  g.fillStyle = hexA(col, 0.14); g.fill();
  g.beginPath(); vals.forEach((v, i) => { if (i) g.lineTo(X(i), Y(v)); else g.moveTo(X(i), Y(v)); });
  g.strokeStyle = col; g.lineWidth = 3; g.stroke();
  g.fillStyle = col; g.beginPath(); g.arc(X(vals.length - 1), Y(vals[vals.length - 1]), 5, 0, Math.PI * 2); g.fill();
}

  },
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr);
  },
  fit() {
    const mobile = this.w < 900;
    const z = Math.min((this.w - (mobile ? 10 : 300)) / (TAC_W * 0.95), (this.h - (mobile ? 200 : 150)) / (TAC_H * 0.95));
    this.cam.z = clamp(z, 0.08, 1.5);
    this.cam.x = TAC_W / 2 + (mobile ? 0 : -100 / this.cam.z); this.cam.y = TAC_H / 2;
  },
  w2s(x, y) { return [(x - this.cam.x) * this.cam.z + this.w / 2, (y - this.cam.y) * this.cam.z + this.h / 2]; },
  s2w(x, y) { return [(x - this.w / 2) / this.cam.z + this.cam.x, (y - this.h / 2) / this.cam.z + this.cam.y]; },
  makeDots(d) {
    const n = clamp(Math.ceil(d.ships0 / 14), 12, 300);
    const arr = [];
    const rng = mulberry32(d.id * 7919);
    for (let i = 0; i < n; i++) arr.push({ u: ((i * 0.6180339887) % 1), v: rng() * 2 - 1, ph: rng() * 6.28, lx: (rng() - 0.5) * d.r, ly: (rng() - 0.5) * d.r, alive: true });
    this.dots.set(d.id, { arr, shown: n, n });
  },
  formPos(form, u, v, R) {
    if (form === 'spindle') { const x = (u * 2 - 1) * 1.1 * R; const wv = 0.42 * R * Math.pow(Math.max(0, 1 - (x / (1.1 * R)) ** 2), 0.6); return [x, v * wv]; }
    if (form === 'crescent') { const th = (u * 2 - 1) * 1.1, rho = R * (1.05 + v * 0.16); return [0.9 * R - rho * Math.cos(th), -rho * Math.sin(th)]; }
    if (form === 'ring') { const th = u * Math.PI * 2, rho = R * (0.72 + v * 0.15); return [rho * Math.cos(th), rho * Math.sin(th)]; }
    return [v * 0.28 * R, (u * 2 - 1) * 1.15 * R];
  },

  /* ---------- ループ ---------- */
  frame(dt) {
    const T = this.T;
    if (!T) return;
    this.t += dt;
    // キー操作でのパン
    const pan = 900 / this.cam.z * dt;
    if (this.keys.KeyW || this.keys.ArrowUp) this.cam.y -= pan;
    if (this.keys.KeyS || this.keys.ArrowDown) this.cam.y += pan;
    if (this.keys.KeyA || this.keys.ArrowLeft) this.cam.x -= pan;
    if (this.keys.KeyD || this.keys.ArrowRight) this.cam.x += pan;
    if (!this.paused && !T.over) {
      this.acc += Math.min(0.25, dt) * this.speed;
      let steps = 0;
      while (this.acc >= TAC_DT && steps < 16) { tacStep(T); this.acc -= TAC_DT; steps++; this.spawnFx(); }
    }
    this.processEvents();
    this.updateFx(dt);
    this.render(dt);
    this.renderHud(false);
    if (T.over && !this.ended) { this.ended = true; setTimeout(() => this.showEnd(), 900); }
  },
  spawnFx() {
    const T = this.T;
    for (const d of T.divs) {
      if (!tAlive(d)) continue;
      const tg = d.firing != null ? T.byId.get(d.firing) : null;
      if (tg && this.beams.length < 520) {
        const n = d.cls === 'BAT' ? 0.6 : d.ships / 900 * (d.fx.volley > 0 ? 3 : 1);
        let k = Math.floor(n) + (rand() < n % 1 ? 1 : 0);
        k = Math.min(k, 6);
        for (let i = 0; i < k; i++) {
          const a = this.randDot(d), b = this.randDot(tg);
          const col = d.side === 0 ? T.sides[0].beam : T.sides[1].beam;
          this.beams.push({ x1: a[0], y1: a[1], x2: b[0] + (rand() - 0.5) * 30, y2: b[1] + (rand() - 0.5) * 30, life: 0.22 + rand() * 0.12, max: 0.34, col, w: d.cls === 'BB' ? 1.6 : 1.1 });
          if (rand() < 0.3 && this.parts.length < 900) this.parts.push({ x: b[0], y: b[1], vx: 0, vy: 0, life: 0.25, max: 0.25, r: 2.5, col: '#fff3d6', type: 'hit' });
        }
      }
      if (d.cls === 'FORT' && d.fortTargets && this.beams.length < 560) {
        for (const id of d.fortTargets) {
          const t = T.byId.get(id); if (!t || rand() > 0.5) continue;
          const b = this.randDot(t);
          const a0 = rand() * Math.PI * 2;
          this.beams.push({ x1: d.x + Math.cos(a0) * d.r * 0.9, y1: d.y + Math.sin(a0) * d.r * 0.9, x2: b[0], y2: b[1], life: 0.3, max: 0.3, col: T.sides[d.side].beam, w: 2 });
        }
      }
    }
  },
  randDot(d) {
    const dd = this.dots.get(d.id);
    if (!dd || d.static) { const a = rand() * Math.PI * 2, r = rand() * d.r * 0.8; return [d.x + Math.cos(a) * r, d.y + Math.sin(a) * r]; }
    const k = Math.floor(rand() * Math.max(1, dd.shown));
    const p = dd.arr[k];
    const c = Math.cos(d.hd), s = Math.sin(d.hd);
    return [d.x + p.lx * c - p.ly * s, d.y + p.lx * s + p.ly * c];
  },
  processEvents() {
    const T = this.T;
    while (this.evIdx < T.events.length) {
      const e = T.events[this.evIdx++];
      const d = e.id != null ? T.byId.get(e.id) : null;
      const mine = e.side === 0;
      const nm = d ? `${d.fleetName || d.label}・${TAC_CLS_NAME[d.cls]}` : '';
      if (e.type === 'rout') this.log(`${nm}が潰走した`, mine ? 'bad' : 'good');
      else if (e.type === 'destroyed') { this.log(d && d.static ? `${d.label}が沈黙した` : `${nm}が全滅した`, mine ? 'bad' : 'good'); if (d) this.boom(d.x, d.y, d.static ? 3 : 1.6); }
      else if (e.type === 'flag') this.log(`${e.name}の旗艦が撃沈された！`, mine ? 'bad' : 'good');
      else if (e.type === 'mainfire') { this.log(`要塞主砲が発射された（${fmt(e.n)}隻が消滅）`, mine ? 'good' : 'bad'); }
      else if (e.type === 'fortCharge') this.log('要塞主砲、エネルギー充填中', mine ? 'info' : 'warn');
      else if (e.type === 'sideRetreat') this.log(mine ? '全軍に撤退命令' : `${T.sides[1].name}が撤退を始めた`, mine ? 'warn' : 'good');
    }
  },
  boom(x, y, k) {
    for (let i = 0; i < 26 * k && this.parts.length < 1100; i++) {
      const a = rand() * Math.PI * 2, v = 20 + rand() * 120 * k;
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.8 + rand() * 0.8, max: 1.6, r: 2 + rand() * 4, col: rand() < 0.5 ? '#ffd29a' : '#ff9a5a', type: 'spark' });
    }
  },
  updateFx(dt) {
    const sdt = this.paused ? 0 : dt * this.speed;
    for (const b of this.beams) b.life -= sdt;
    this.beams = this.beams.filter(b => b.life > 0);
    for (const p of this.parts) { p.life -= sdt; p.x += p.vx * sdt; p.y += p.vy * sdt; p.vx *= 0.96; p.vy *= 0.96; }
    this.parts = this.parts.filter(p => p.life > 0);
    // 撃沈された艦の点を消す
    for (const d of this.T.divs) {
      const dd = this.dots.get(d.id);
      if (!dd) continue;
      const want = d.state === 'dead' ? 0 : Math.max(d.ships > 0 ? 1 : 0, Math.ceil(dd.n * d.ships / d.ships0));
      while (dd.shown > want) {
        dd.shown--;
        const p = dd.arr[dd.shown];
        const c = Math.cos(d.hd), s = Math.sin(d.hd);
        const x = d.x + p.lx * c - p.ly * s, y = d.y + p.lx * s + p.ly * c;
        if (this.parts.length < 1100) this.parts.push({ x, y, vx: (rand() - 0.5) * 30, vy: (rand() - 0.5) * 30, life: 0.7 + rand() * 0.5, max: 1.2, r: 4 + rand() * 6, col: '#ffb070', type: 'boom' });
      }
      const k = Math.min(1, dt * 2.2);
      for (let i = 0; i < dd.shown; i++) {
        const p = dd.arr[i];
        const [tx, ty] = this.formPos(d.form, p.u, p.v, d.r);
        p.lx += (tx - p.lx) * k; p.ly += (ty - p.ly) * k;
      }
    }
  },

  /* ---------- 描画 ---------- */
  render() {
    const T = this.T, ctx = this.ctx, z = this.cam.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, this.h);
    g.addColorStop(0, '#04070e'); g.addColorStop(1, '#070b16');
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.w, this.h);
    for (const s of this.stars) {
      const px = (s.x - this.cam.x) * z * 0.35 + this.w / 2, py = (s.y - this.cam.y) * z * 0.35 + this.h / 2;
      if (px < 0 || py < 0 || px > this.w || py > this.h) continue;
      ctx.fillStyle = `rgba(220,230,255,${s.b * 0.55})`; ctx.fillRect(px, py, s.s, s.s);
    }
    // 戦域
    const [x0, y0] = this.w2s(0, 0), [x1, y1] = this.w2s(TAC_W, TAC_H);
    ctx.strokeStyle = 'rgba(120,150,190,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= TAC_W; x += 300) { const [sx] = this.w2s(x, 0); ctx.moveTo(sx, y0); ctx.lineTo(sx, y1); }
    for (let y = 0; y <= TAC_H; y += 300) { const [, sy] = this.w2s(0, y); ctx.moveTo(x0, sy); ctx.lineTo(x1, sy); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(196,168,115,0.25)'; ctx.setLineDash([4, 6]); ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); ctx.setLineDash([]);
    // 要塞・砲台
    for (const d of T.divs) if (d.static) this.drawStatic(ctx, d);
    // 命令線
    for (const id of this.sel) {
      const d = T.byId.get(id);
      if (!d || !tAlive(d)) continue;
      const [sx, sy] = this.w2s(d.x, d.y);
      let tx = null, ty = null, col = 'rgba(242,232,208,0.5)';
      if (d.order.type === 'move') { tx = d.order.x; ty = d.order.y; }
      else if (d.order.type === 'attack') { const t = T.byId.get(d.order.target); if (t) { tx = t.x; ty = t.y; col = 'rgba(224,103,93,0.6)'; } }
      if (tx != null) { const [ex, ey] = this.w2s(tx, ty); ctx.strokeStyle = col; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]); }
    }
    // 艦艇
    for (const d of T.divs) if (!d.static && d.state !== 'dead') this.drawDiv(ctx, d);
    // 艦載機
    for (const w of T.wings) {
      const n = clamp(Math.round(w.str / 70), 3, 28);
      const [sx, sy] = this.w2s(w.x, w.y);
      ctx.fillStyle = w.side === 0 ? T.sides[0].beam : T.sides[1].beam;
      for (let i = 0; i < n; i++) {
        const a = i * 2.399 + this.t * (w.phase === 'atk' ? 3 : 1.2), rr = (6 + (i % 5) * 4) * clamp(z * 3, 0.6, 2);
        ctx.fillRect(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, 1.6, 1.6);
      }
    }
    // ビーム
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.beams) {
      const a = b.life / b.max;
      const [ax, ay] = this.w2s(b.x1, b.y1), [bx, by] = this.w2s(b.x2, b.y2);
      ctx.strokeStyle = hexA(b.col, a * 0.85); ctx.lineWidth = b.w;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    for (const p of this.parts) {
      const a = p.life / p.max;
      const [sx, sy] = this.w2s(p.x, p.y);
      const r = (p.type === 'boom' ? p.r * (1.6 - a) : p.r) * clamp(z * 2.5, 0.5, 2.2);
      ctx.fillStyle = hexA(p.col, a * (p.type === 'spark' ? 0.9 : 0.7));
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.6, r), 0, Math.PI * 2); ctx.fill();
    }
    // 要塞主砲
    for (const m of T.mainShots) {
      const age = T.t - m.t;
      if (age > 1.8) continue;
      const a = 1 - age / 1.8;
      const [sx, sy] = this.w2s(m.x, m.y);
      const ex = sx + Math.cos(m.a) * 3600 * z, ey = sy + Math.sin(m.a) * 3600 * z;
      ctx.strokeStyle = `rgba(255,236,200,${a * 0.35})`; ctx.lineWidth = 230 * z; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.9})`; ctx.lineWidth = 60 * z; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    // 範囲選択
    if (this.box) {
      ctx.strokeStyle = 'rgba(242,232,208,0.8)'; ctx.fillStyle = 'rgba(242,232,208,0.06)';
      const bx = Math.min(this.box.x0, this.box.x1), by = Math.min(this.box.y0, this.box.y1), bw = Math.abs(this.box.x1 - this.box.x0), bh = Math.abs(this.box.y1 - this.box.y0);
      ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh);
    }
    if (this.fortAim) {
      ctx.fillStyle = 'rgba(224,103,93,0.9)'; ctx.font = '600 13px "Zen Kaku Gothic New", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('要塞主砲の照準：射線の方向をクリック／タップ', this.w / 2, this.h - 110);
    }
  },
  drawStatic(ctx, d) {
    const z = this.cam.z, T = this.T;
    const [sx, sy] = this.w2s(d.x, d.y);
    const col = T.sides[d.side].color;
    if (d.cls === 'FORT') {
      const r = d.r * z;
      const dead = d.state === 'dead';
      const g = ctx.createRadialGradient(sx - r * 0.35, sy - r * 0.35, r * 0.1, sx, sy, r);
      g.addColorStop(0, dead ? '#5a5f68' : '#d9e0ea'); g.addColorStop(0.6, dead ? '#30343a' : '#6f7a8a'); g.addColorStop(1, '#1b2028');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
      for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.ellipse(sx, sy, r, r * i / 5, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.strokeStyle = hexA(col, 0.7); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, r + 4, 0, Math.PI * 2); ctx.stroke();
      if (!dead && d.main.charge > 0) {
        const k = 1 - d.main.charge / 3;
        const gg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * (0.4 + k * 0.6));
        gg.addColorStop(0, `rgba(255,250,230,${0.4 + k * 0.6})`); gg.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
        const ex = sx + Math.cos(d.main.aim) * 3600 * z, ey = sy + Math.sin(d.main.aim) * 3600 * z;
        ctx.strokeStyle = `rgba(255,90,70,${0.35 + 0.4 * Math.sin(this.t * 20) ** 2})`; ctx.lineWidth = Math.max(2, 230 * z); ctx.setLineDash([12, 10]);
        ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
      }
      ctx.font = '700 13px "Shippori Mincho B1", serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = '#f2e8d0'; ctx.fillText(d.label, sx, sy + r + 8);
      const hp = d.ships / d.ships0;
      ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(sx - 50, sy + r + 26, 100, 4);
      ctx.fillStyle = hp < 0.4 ? '#e0675d' : '#c4a873'; ctx.fillRect(sx - 50, sy + r + 26, 100 * hp, 4);
      if (!dead) { ctx.font = '500 10px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(220,226,236,0.8)'; ctx.fillText(d.main.charge > 0 ? '主砲 充填中' : `主砲 ${Math.max(0, Math.ceil(d.main.cd))}秒`, sx, sy + r + 34); }
    } else {
      const r = Math.max(5, d.r * z);
      ctx.fillStyle = d.state === 'dead' ? '#333' : hexA(col, 0.85);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const px = sx + Math.cos(a) * r, py = sy + Math.sin(a) * r; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.stroke();
    }
  },
  drawDiv(ctx, d) {
    const T = this.T, z = this.cam.z;
    const dd = this.dots.get(d.id);
    if (!dd) return;
    const c = Math.cos(d.hd), s = Math.sin(d.hd);
    const base = T.sides[d.side].color;
    const tint = { BB: 1, CR: 0.92, DD: 0.8, CV: 1, LT: 0.6 }[d.cls];
    let col = d.cls === 'LT' ? '#9aa4b2' : base;
    if (d.state === 'rout') col = '#8b8f96';
    const sz = Math.max(1, SHIP[d.cls].dot * z * 2.6);
    ctx.fillStyle = col;
    ctx.globalAlpha = (d.state === 'rout' ? 0.55 : 0.95) * tint;
    for (let i = 0; i < dd.shown; i++) {
      const p = dd.arr[i];
      const bob = Math.sin(this.t * 1.1 + p.ph) * 2;
      const wx = d.x + (p.lx + bob) * c - p.ly * s, wy = d.y + (p.lx + bob) * s + p.ly * c;
      const sx = (wx - this.cam.x) * z + this.w / 2, sy = (wy - this.cam.y) * z + this.h / 2;
      ctx.fillRect(sx - sz / 2, sy - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    const [sx, sy] = this.w2s(d.x, d.y);
    const R = d.r * z;
    // 斉射・突撃のハイライト
    if (d.fx.volley > 0) { ctx.strokeStyle = hexA(T.sides[d.side].beam, 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx, sy, R * 1.25, 0, Math.PI * 2); ctx.stroke(); }
    // 選択
    if (this.sel.has(d.id)) {
      const k = R * 1.3 + 6;
      ctx.strokeStyle = '#f2e8d0'; ctx.lineWidth = 1.4;
      for (const [ax, ay] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        ctx.beginPath(); ctx.moveTo(sx + ax * k, sy + ay * k - ay * 8); ctx.lineTo(sx + ax * k, sy + ay * k); ctx.lineTo(sx + ax * k - ax * 8, sy + ay * k); ctx.stroke();
      }
      // 向き
      ctx.strokeStyle = 'rgba(242,232,208,0.6)'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + c * (R + 18), sy + s * (R + 18)); ctx.stroke();
    }
    // ラベル
    if (z > 0.12 || this.sel.has(d.id)) {
      const label = `${SHIP[d.cls].short} ${fmt(d.ships)}`;
      ctx.font = `500 ${z > 0.3 ? 11 : 10}px "IBM Plex Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const ly = sy + R * 1.15 + 6;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(3,5,10,0.85)'; ctx.strokeText(label, sx, ly);
      ctx.fillStyle = d.side === 0 ? '#f2e8d0' : hexA(base, 1); ctx.fillText(label, sx, ly);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(sx - 18, ly + 14, 36, 3);
      ctx.fillStyle = d.morale < 25 ? '#e0675d' : d.morale < 50 ? '#e6b34c' : '#78c595'; ctx.fillRect(sx - 18, ly + 14, 36 * clamp(d.morale / 100, 0, 1), 3);
      if (d.state === 'rout') { ctx.fillStyle = '#e0675d'; ctx.font = '600 11px "Zen Kaku Gothic New", sans-serif'; ctx.fillText('潰走', sx, ly + 20); }
      else if (d.fx.charge > 0) { ctx.fillStyle = '#e6b34c'; ctx.font = '600 11px "Zen Kaku Gothic New", sans-serif'; ctx.fillText('突撃', sx, ly + 20); }
      else if (d.flag && z > 0.18) { ctx.fillStyle = 'rgba(196,168,115,0.9)'; ctx.font = '500 10px "Zen Kaku Gothic New", sans-serif'; ctx.fillText('旗艦', sx, ly + 20); }
    }
  },

  /* ---------- HUD ---------- */
  buildHud() {
    const T = this.T;
    document.getElementById('tacTop').innerHTML = `
      <div class="hud-title mincho">${esc(T.sysName)}星系会戦</div>
      <div class="hud-sides">${[0, 1].map(s => `<div class="side-str"><div class="row"><span style="color:${T.sides[s].color}">${esc(T.sides[s].name)}</span><span class="num" id="tacS${s}"></span></div><div class="bar" style="color:${T.sides[s].color}"><i id="tacB${s}"></i></div></div>`).join('')}</div>
      <span class="num dim" id="tacTime" style="white-space:nowrap"></span>
      <div class="tb-speed">

  },
  renderHud(force) {

    for (let s = 0; s < 2; s++) {
      const cur = sum(T.divs.filter(d => d.side === s && !d.static && d.state !== 'dead'), d => d.ships), tot = sum(T.divs.filter(d => d.side === s && !d.static), d => d.ships0);

    // 一覧

    const mine = T.divs.filter(d => d.side === 0 && !d.static);
