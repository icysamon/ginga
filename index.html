<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>銀河興亡記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  /* Layout: 司令部の星図台。全面キャンバスの星図を土台に、計器盤のようなパネルを四辺へ据える */
  --void: #05080f;
  --deep: #0a1120;
  --panel: rgba(8, 13, 23, 0.9);
  --panel-2: rgba(13, 21, 36, 0.94);
  --line: #1d2a40;
  --line-2: #31445e;
  --ink: #e2e7ef;
  --dim: #8e9ab0;
  --faint: #5a6780;
  --brass: #c4a873;
  --brass-dim: #6f6046;
  --signal: #f2e8d0;
  --good: #78c595;
  --warn: #e6b34c;
  --bad: #e0675d;
  --emp: #e3ad55;
  --rep: #5fb2e8;
  --neu: #62c9a0;
  --reb: #e2645c;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font: 14px/1.55 var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; overflow: hidden; padding-left: var(--gx); padding-right: var(--gr); padding-block: 0; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button { font-family: inherit; }
.screen { position: absolute; inset: 0; overflow: hidden; }
canvas.full { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.eyebrow { font: 500 10px/1.2 var(--f-data); letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.c-EMP { color: var(--emp); } .c-REP { color: var(--rep); } .c-NEU { color: var(--neu); } .c-REB { color: var(--reb); }
.mincho { font-family: var(--f-display); }
h1, h2, h3 { text-wrap: balance; }

/* ---------- パネル ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45); position: relative; }
.ticks::after {
  content: ""; position: absolute; inset: -1px; pointer-events: none;
  background:
    linear-gradient(var(--brass), var(--brass)) left top / 9px 1px no-repeat,
    linear-gradient(var(--brass), var(--brass)) left top / 1px 9px no-repeat,
    linear-gradient(var(--brass), var(--brass)) right top / 9px 1px no-repeat,
    linear-gradient(var(--brass), var(--brass)) right top / 1px 9px no-repeat,
    linear-gradient(var(--brass), var(--brass)) left bottom / 9px 1px no-repeat,
    linear-gradient(var(--brass), var(--brass)) left bottom / 1px 9px no-repeat,
    linear-gradient(var(--brass), var(--brass)) right bottom / 9px 1px no-repeat,
    linear-gradient(var(--brass), var(--brass)) right bottom / 1px 9px no-repeat;
  opacity: 0.75;
}
.btn {
  font: 500 12.5px/1.2 var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line-2); padding: 7px 10px; border-radius: 2px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, border-color 0.15s, color 0.15s; min-height: 32px; text-align: left;
}
.btn:hover:not([disabled]) { background: rgba(196, 168, 115, 0.1); border-color: var(--brass-dim); }
.btn:focus-visible { outline: 1px solid var(--signal); outline-offset: 2px; }
.btn[disabled] { opacity: 0.38; cursor: not-allowed; }
.btn.primary { border-color: var(--brass); color: var(--signal); background: rgba(196, 168, 115, 0.13); }
.btn.primary:hover:not([disabled]) { background: rgba(196, 168, 115, 0.22); }
.btn.danger { border-color: rgba(224, 103, 93, 0.55); color: #f3b8b1; }
.btn.on { border-color: var(--brass); background: rgba(196, 168, 115, 0.2); color: var(--signal); }
.btn.sm { padding: 4px 8px; min-height: 26px; font-size: 12px; }
.btn.icon { padding: 0; width: 32px; height: 32px; }
.btn.block { width: 100%; justify-content: space-between; }
.btn .cost { font: 11px/1.2 var(--f-data); color: var(--dim); white-space: nowrap; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.bar { height: 4px; background: rgba(255, 255, 255, 0.07); position: relative; overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: currentColor; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--f-ui); padding: 3px 6px; border: 1px solid var(--line-2); color: var(--dim); border-radius: 2px; white-space: nowrap; }
.chip.warn { color: var(--warn); border-color: rgba(230, 179, 76, 0.5); }
.chip.bad { color: var(--bad); border-color: rgba(224, 103, 93, 0.5); }
.chip.good { color: var(--good); border-color: rgba(120, 197, 149, 0.45); }
.chip.gold { color: var(--brass); border-color: var(--brass-dim); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
.kv > :nth-child(odd) { color: var(--dim); }
.kv > :nth-child(even) { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.sep { height: 1px; background: var(--line); margin: 4px 0; }
.scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* ---------- タイトル ---------- */
#title { display: grid; place-items: center; }
#title canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.title-wrap { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 860px); gap: 56px; align-items: center; padding-block: 32px; padding-left: var(--gx); padding-right: var(--gr); box-sizing: border-box; width: 100%; max-width: 1180px; max-height: 100%; overflow: auto; }
.title-mark { justify-self: end; display: flex; flex-direction: column; align-items: center; gap: 0.16em; font: 800 clamp(52px, 8.4vh, 96px)/1 var(--f-display); color: var(--signal); text-shadow: 0 0 40px rgba(242, 232, 208, 0.18); margin: 0; padding-left: 22px; border-left: 1px solid var(--brass-dim); }
.title-mark span { display: block; line-height: 1; }
.title-body { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.title-body .eyebrow { font-size: 11px; }
.title-lede { font: 500 17px/1.8 var(--f-display); color: var(--ink); max-width: 38em; margin: 0; }
.fac-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.fac-card { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; border-top: 2px solid var(--fc); }
.fac-card h2 { margin: 0; font: 700 23px/1.25 var(--f-display); color: var(--fc); display: flex; align-items: center; gap: 10px; }
.fac-card h2 svg { width: 30px; height: 30px; flex: none; }
.fac-card p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.7; }
.fac-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.fac-stats div { display: flex; flex-direction: column; gap: 2px; }
.fac-stats b { font: 500 16px/1.1 var(--f-data); color: var(--ink); }
.fac-stats span { font-size: 11px; color: var(--faint); }
.title-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--dim); padding: 7px 12px; font: 500 12.5px var(--f-ui); cursor: pointer; border-right: 1px solid var(--line-2); min-height: 32px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: rgba(196, 168, 115, 0.18); color: var(--signal); }
.seg button:focus-visible { outline: 1px solid var(--signal); outline-offset: -2px; }

/* ---------- 戦略画面 ---------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 8px var(--gr) 8px var(--gx); background: linear-gradient(to bottom, rgba(5, 8, 15, 0.96), rgba(5, 8, 15, 0.78)); border-bottom: 1px solid var(--line); min-height: 56px; }
.tb-fac { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-fac svg { width: 28px; height: 28px; flex: none; }
.tb-fac b { font: 700 15px/1.2 var(--f-display); display: block; white-space: nowrap; }
.tb-fac span { font-size: 11px; color: var(--dim); white-space: nowrap; }
.tb-time { display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 1px solid var(--line); }
.tb-date { font: 500 12.5px/1.2 var(--f-data); color: var(--signal); white-space: nowrap; min-width: 9.5em; }
.tb-speed { display: inline-flex; border: 1px solid var(--line-2); }
.tb-speed button { width: 30px; height: 28px; background: transparent; border: 0; border-right: 1px solid var(--line-2); color: var(--dim); cursor: pointer; display: grid; place-items: center; font: 500 11px var(--f-data); }
.tb-speed button:last-child { border-right: 0; }
.tb-speed button.on { background: rgba(196, 168, 115, 0.2); color: var(--signal); }
.tb-speed svg { width: 12px; height: 12px; fill: currentColor; }
.tb-res { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding-left: 14px; border-left: 1px solid var(--line); }
.tb-res::-webkit-scrollbar { display: none; }
.res { display: flex; flex-direction: column; padding: 0 10px; min-width: 76px; border-right: 1px solid rgba(255, 255, 255, 0.04); cursor: help; }
.res label { font-size: 10.5px; color: var(--dim); letter-spacing: 0.04em; white-space: nowrap; }
.res b { font: 500 14px/1.25 var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.res small { font: 10.5px/1.1 var(--f-data); white-space: nowrap; }
.res.alert b { color: var(--bad); }
.gauge { min-width: 70px; }
.gauge .bar { margin-top: 4px; width: 64px; }
.tb-menu { margin-left: auto; display: flex; gap: 6px; }
#left { position: absolute; z-index: 4; left: var(--gx); top: calc(var(--tbh, 56px) + 12px); bottom: 66px; width: 264px; display: flex; flex-direction: column; }
#right { position: absolute; z-index: 4; right: var(--gr); top: calc(var(--tbh, 56px) + 12px); bottom: 66px; width: 368px; display: flex; flex-direction: column; }
#right[hidden], #left[hidden] { display: none !important; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 9px 4px 8px; font: 500 12.5px var(--f-ui); cursor: pointer; }
.tabs button.on { color: var(--signal); border-bottom-color: var(--brass); }
.tabs button:focus-visible { outline: 1px solid var(--signal); outline-offset: -2px; }
.list { flex: 1; min-height: 0; }
.li { padding: 9px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.li:hover { background: rgba(255, 255, 255, 0.03); }
.li.sel { background: rgba(196, 168, 115, 0.09); box-shadow: inset 2px 0 0 var(--brass); }
.li .t { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
.li .t b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { font-size: 11.5px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mini .bar { height: 3px; }
.log-e { padding: 7px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); font-size: 12px; line-height: 1.55; }
.log-e time { font: 10.5px var(--f-data); color: var(--faint); display: block; }
.log-e.alert { color: #f1c1bb; } .log-e.battle { color: #e9dcc0; } .log-e.politics { color: #cfd8f0; }
.ctx { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ctx-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.ctx-head h2 { margin: 0; font: 700 21px/1.25 var(--f-display); display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctx-head h2 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec > .eyebrow { display: flex; justify-content: space-between; gap: 8px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.actions .btn { justify-content: flex-start; }
.planet { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); }
.planet img { width: 34px; height: 34px; }
.planet .pn { font-weight: 500; font-size: 13px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.planet .pd { font-size: 11.5px; color: var(--dim); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.planet .builds { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.comp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.comp div { border: 1px solid var(--line); padding: 5px 4px; text-align: center; }
.comp b { display: block; font: 500 13px/1.2 var(--f-data); }
.comp span { font-size: 10.5px; color: var(--dim); }
.stat-bars { display: grid; grid-template-columns: 4.2em 1fr 2.6em; gap: 5px 8px; align-items: center; font-size: 12px; }
.stat-bars .num { text-align: right; font-size: 12px; }
.adm-line { display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
.adm-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; font-size: 10.5px; color: var(--dim); text-align: center; }
.adm-stats b { display: block; font: 500 13px var(--f-data); color: var(--ink); }
#bottombar { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; align-items: center; padding: 8px var(--gr) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gx); background: linear-gradient(to top, rgba(5, 8, 15, 0.95), rgba(5, 8, 15, 0.7)); border-top: 1px solid var(--line); }
#bottombar .btn { min-width: 74px; }
#bottombar .hint { margin-left: auto; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#toasts { position: absolute; z-index: 70; top: calc(var(--tbh, 56px) + 14px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--panel-2); border: 1px solid var(--line-2); border-left: 2px solid var(--brass); padding: 8px 12px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); animation: tin 0.25s ease-out; max-width: 100%; }
.toast.alert { border-left-color: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
#tooltip { position: absolute; z-index: 40; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line-2); padding: 7px 10px; font-size: 12px; max-width: 260px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
#tooltip b { font: 700 14px var(--f-display); }
.modebanner { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(var(--tbh, 56px) + 14px); background: rgba(196, 168, 115, 0.16); border: 1px solid var(--brass); color: var(--signal); padding: 7px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; }

/* ---------- モーダル ---------- */
#modalRoot { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.backdrop { position: absolute; inset: 0; background: rgba(2, 4, 9, 0.62); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gr) max(16px, env(safe-area-inset-bottom, 0px)) var(--gx); pointer-events: auto; }
.modal { width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel-2); }
.modal.wide { width: min(1040px, 100%); }
.modal.narrow { width: min(520px, 100%); }
.modal > header { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.modal > header h2 { margin: 0; font: 700 21px/1.3 var(--f-display); flex: 1; min-width: 0; }
.modal > .body { padding: 16px 18px; overflow: auto; min-height: 0; overscroll-behavior: contain; }
.modal > footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.ev-text { font: 500 15px/1.95 var(--f-display); color: var(--ink); margin: 0 0 16px; max-width: 40em; }
.ev-opts { display: flex; flex-direction: column; gap: 8px; }
.ev-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 12px; text-align: left; }
.ev-opt b { font-weight: 500; font-size: 14px; }
.ev-opt span { font-size: 12px; color: var(--dim); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: rgba(255, 255, 255, 0.015); }
.card h3 { margin: 0; font: 700 16px/1.3 var(--f-display); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; }
.vs .mid { font: 800 22px var(--f-display); color: var(--brass); padding-top: 18px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font: 500 10.5px var(--f-data); letter-spacing: 0.08em; color: var(--brass); padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.t td { padding: 6px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
table.t td.r, table.t th.r { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
table.t tr:hover td { background: rgba(255, 255, 255, 0.02); }
.tbl-wrap { overflow-x: auto; }
.pfac { display: flex; flex-direction: column; gap: 8px; }
.pfac .bars { display: grid; grid-template-columns: 3.2em 1fr 2.4em; gap: 4px 8px; align-items: center; font-size: 12px; }
.pfac .bar { height: 6px; }
.spark { width: 100%; height: 56px; display: block; }
.help h3 { font: 700 16px var(--f-display); margin: 14px 0 6px; color: var(--signal); }
.help p, .help li { font-size: 13.5px; line-height: 1.8; color: var(--ink); max-width: 46em; }
.help ul { padding-left: 1.2em; margin: 4px 0; }
.help kbd { font: 11px var(--f-data); border: 1px solid var(--line-2); padding: 1px 5px; border-radius: 2px; color: var(--signal); }

/* ---------- 戦術・地上 ---------- */
.hud-top { position: absolute; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 14px; padding: 8px var(--gr) 8px var(--gx); background: linear-gradient(to bottom, rgba(4, 6, 12, 0.94), rgba(4, 6, 12, 0.6)); border-bottom: 1px solid var(--line); min-height: 54px; }
.hud-title { font: 700 17px/1.2 var(--f-display); white-space: nowrap; }
.hud-sides { display: flex; gap: 16px; flex: 1; min-width: 0; align-items: center; }
.side-str { display: flex; flex-direction: column; gap: 3px; min-width: 120px; flex: 1; max-width: 260px; }
.side-str .row { justify-content: space-between; font-size: 12px; }
.side-str .bar { height: 5px; }

function dateParts(day, startYear) {
  const y = startYear + Math.floor(day / 360);
  const m = Math.floor((day % 360) / 30) + 1;
  const d = Math.floor(day % 30) + 1;
  return { y, m, d };
}
function fmtDate(day, startYear) { const p = dateParts(day, startYear); return `銀河標準暦 ${p.y}年${p.m}月${p.d}日`; }
function fmtDateShort(day, startYear) { const p = dateParts(day, startYear); return `${p.y}.${String(p.m).padStart(2, '0')}.${String(p.d).padStart(2, '0')}`; }

/* ==========================================================
   galaxy.js — 銀河の生成（星系・航路・惑星）
   ========================================================== */
const GAL_W = 2600, GAL_H = 1600;
const NEB_HALF = 150;
function nebX(y) { return 1300 + 60 * Math.sin(y / 240 + 0.6) + 25 * Math.sin(y / 90 + 2.0); }

function generateGalaxy(seed) {
  const rng = mulberry32(seed);
  const R = () => rng();
  const RR = (a, b) => a + (b - a) * R();
  const RI = (a, b) => Math.floor(a + (b - a + 1) * R());
  const RP = arr => arr[Math.floor(R() * arr.length)];
  const RW = (obj) => { let t = 0; for (const k in obj) t += obj[k]; let r = R() * t; for (const k in obj) { r -= obj[k]; if (r <= 0) return k; } return Object.keys(obj)[0]; };
  const RSH = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };

  const systems = [], lanes = [], planets = [];

  function poisson(inside, box, count, minD, fixed) {
    const pts = fixed.slice();
    let tries = 0;
    while (pts.length < count && tries < 40000) {
      tries++;
      const x = RR(box[0], box[2]), y = RR(box[1], box[3]);
      if (!inside(x, y)) continue;
      let ok = true;
      for (const p of pts) { const dx = p.x - x, dy = p.y - y; if (dx * dx + dy * dy < minD * minD) { ok = false; break; } }
      if (ok) pts.push({ x, y });
    }
    return pts;
  }
  const insideEmp = (x, y) => { const ex = (x - 620) / 560, ey = (y - 800) / 735; return ex * ex + ey * ey < 1 && x < nebX(y) - NEB_HALF - 55; };
  const insideRep = (x, y) => { const ex = (x - 1980) / 560, ey = (y - 800) / 735; return ex * ex + ey * ey < 1 && x > nebX(y) + NEB_HALF + 55; };
  const empPts = poisson(insideEmp, [70, 70, 1150, 1530], 24, 168, [{ x: 205, y: 800, cap: true }]);
  const repPts = poisson(insideRep, [1450, 70, 2530, 1530], 21, 172, [{ x: 2395, y: 800, cap: true }]);

  function regionEdges(pts) {
    const n = pts.length, d = (i, j) => Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
    const out = [];
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dij = d(i, j);
      let rng_ok = true, gab_ok = true;
      const mx = (pts[i].x + pts[j].x) / 2, my = (pts[i].y + pts[j].y) / 2, r2 = dij * dij / 4;
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        if (Math.max(d(i, k), d(j, k)) < dij) rng_ok = false;
        const dx = pts[k].x - mx, dy = pts[k].y - my;
        if (dx * dx + dy * dy < r2) gab_ok = false;
      }
      if (rng_ok && dij < 420) out.push([i, j, dij]);
      else if (gab_ok && dij < 300 && R() < 0.5) out.push([i, j, dij]);
    }
    // 連結性の保証
    const par = pts.map((_, i) => i);
    const find = a => (par[a] === a ? a : (par[a] = find(par[a])));
    for (const e of out) par[find(e[0])] = find(e[1]);
    let guard = 0;
    while (guard++ < 50) {
      const roots = new Set(pts.map((_, i) => find(i)));
      if (roots.size <= 1) break;
      let best = null;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (find(i) === find(j)) continue;
        const dij = d(i, j);
        if (!best || dij < best[2]) best = [i, j, dij];
      }
      out.push(best); par[find(best[0])] = find(best[1]);
    }
    return out;
  }

  function addSys(o) {
    const sc = (() => { let t = 0; for (const s of STAR_CLASSES) t += s.w; let r = R() * t; for (const s of STAR_CLASSES) { r -= s.w; if (r <= 0) return s; } return STAR_CLASSES[4]; })();
    const s = Object.assign({
      id: systems.length, name: '', x: 0, y: 0, region: 'EMP', owner: null, kind: 'normal',
      star: { cls: sc.cls, color: sc.color, size: sc.size * RR(0.85, 1.15) },
      planets: [], tags: {}, adj: [], reserve: {}, yardQueue: [], depth: 99
    }, o);
    systems.push(s); return s;
  }
  function addLane(a, b, type) {
    if (a === b) return;
    if (lanes.some(l => (l.a === a && l.b === b) || (l.a === b && l.b === a))) return;
    const A = systems[a], B = systems[b];
    lanes.push({ id: lanes.length, a, b, len: Math.hypot(A.x - B.x, A.y - B.y), type: type || 'normal' });
  }

  // 帝国領
  const empIds = empPts.map(p => addSys({ x: p.x, y: p.y, region: 'EMP', owner: 'EMP', kind: p.cap ? 'capital' : 'normal' }).id);
  for (const e of regionEdges(empPts)) addLane(empIds[e[0]], empIds[e[1]]);
  // 共和国領
  const repIds = repPts.map(p => addSys({ x: p.x, y: p.y, region: 'REP', owner: 'REP', kind: p.cap ? 'capital' : 'normal' }).id);
  for (const e of regionEdges(repPts)) addLane(repIds[e[0]], repIds[e[1]]);

  // 回廊
  const fortY = 340;
  const fort = addSys({ x: nebX(fortY), y: fortY, region: 'FORT', owner: 'EMP', kind: 'fortress', name: 'ケルベロス' });
  fort.star = { cls: 'W', color: '#e8eeff', size: 0.9 };
  const herY = 1235;
  const merc = addSys({ x: nebX(1180) - 92, y: 1175, region: 'NEU', owner: 'NEU', kind: 'neutral', name: 'メルクリウス' });
  const herm = addSys({ x: nebX(herY), y: herY, region: 'NEU', owner: 'NEU', kind: 'neutral', name: 'ヘルメス' });
  const cadu = addSys({ x: nebX(1180) + 92, y: 1180, region: 'NEU', owner: 'NEU', kind: 'neutral', name: 'カドゥケウス' });
  herm.tags.neuCapital = true;
  const ereb = addSys({ x: nebX(760) - 70, y: 748, region: 'NEB', owner: null, kind: 'nebula', name: 'エレボス' });
  const tart = addSys({ x: nebX(845) + 70, y: 852, region: 'NEB', owner: null, kind: 'nebula', name: 'タルタロス' });
  ereb.star = { cls: 'M', color: '#d08060', size: 0.7 };
  tart.star = { cls: 'M', color: '#c87058', size: 0.75 };

  const usedEntr = new Set();
  function nearest(ids, sx, sy) {
    let best = null, bd = 1e9;
    for (const id of ids) {
      if (usedEntr.has(id)) continue;
      const s = systems[id]; if (s.kind === 'capital') continue;
      const d = Math.hypot(s.x - sx, s.y - sy);
      if (d < bd) { bd = d; best = id; }
    }
    usedEntr.add(best); return best;
  }
  const eF = nearest(empIds, fort.x, fort.y), rF = nearest(repIds, fort.x, fort.y);
  addLane(eF, fort.id, 'corridor'); addLane(fort.id, rF, 'corridor');
  const eM = nearest(empIds, merc.x, merc.y), rC = nearest(repIds, cadu.x, cadu.y);
  addLane(eM, merc.id, 'corridor'); addLane(merc.id, herm.id, 'corridor'); addLane(herm.id, cadu.id, 'corridor'); addLane(cadu.id, rC, 'corridor');
  const eE = nearest(empIds, ereb.x, ereb.y), rT = nearest(repIds, tart.x, tart.y);
  addLane(eE, ereb.id, 'nebula'); addLane(ereb.id, tart.id, 'nebula'); addLane(tart.id, rT, 'nebula');
  systems[eF].tags.gate = 'fort'; systems[rF].tags.gate = 'fort';
  systems[eM].tags.gate = 'neu'; systems[rC].tags.gate = 'neu';
  systems[eE].tags.gate = 'neb'; systems[rT].tags.gate = 'neb';

  for (const l of lanes) { systems[l.a].adj.push({ to: l.b, lane: l.id }); systems[l.b].adj.push({ to: l.a, lane: l.id }); }

  // 深度（首都からの距離）
  function bfsDepth(capId, region) {
    const q = [capId]; systems[capId].depth = 0;
    while (q.length) {
      const c = q.shift();
      for (const a of systems[c].adj) {
        const n = systems[a.to];
        if (n.region !== region) continue;
        if (n.depth > systems[c].depth + 1) { n.depth = systems[c].depth + 1; q.push(n.id); }
      }
    }
  }
  bfsDepth(empIds[0], 'EMP'); bfsDepth(repIds[0], 'REP');

  // 名前
  const en = RSH(EMP_SYS_NAMES.slice()), rn = RSH(REP_SYS_NAMES.slice());
  systems[empIds[0]].name = 'アウレウム';
  systems[repIds[0]].name = 'エリュシオン';
  let ei = 0, ri = 0;
  for (const id of empIds) if (!systems[id].name) systems[id].name = en[ei++ % en.length];
  for (const id of repIds) if (!systems[id].name) systems[id].name = rn[ri++ % rn.length];

  // ---------- 惑星 ----------
  function addPlanet(sys, type, o) {
    const p = Object.assign({
      id: planets.length, sid: sys.id, name: '', type, main: false, pop: 0, maxPop: 0,
      agri: 0, ind: 0, yard: 0, def: 0, unrest: 8, loyalty: 85, owner: sys.owner,
      build: null, recruit: [], garrison: [], scorched: 0, isCapital: false, fortress: null, orbit: 0
    }, o);
    p.maxPop = Math.max(p.pop * 1.3, p.pop + 0.5);
    if (PTYPE[type].uninhabited) { p.pop = 0; p.maxPop = 0; }
    planets.push(p); sys.planets.push(p.id); return p;
  }
  function finishNames(sys) {
    // 軌道順に並べてローマ数字
    const ps = sys.planets.map(id => planets[id]);
    ps.sort((a, b) => a.orbit - b.orbit);
    ps.forEach((p, i) => { if (!p.name) p.name = sys.name + ' ' + ROMAN[i + 1]; });
    sys.planets = ps.map(p => p.id);
  }
  function secondaries(sys, n) {
    for (let i = 0; i < n; i++) {
      const r = R();
      if (r < 0.42) addPlanet(sys, 'gas', { orbit: RR(3, 9), ind: R() < 0.4 ? 1 : 0 });
      else if (r < 0.72) addPlanet(sys, 'barren', { orbit: RR(0.5, 8), ind: R() < 0.35 ? 1 : 0 });
      else {
        const t = RP(['desert', 'ice', 'volcanic', 'terran', 'desert', 'ice']);
        addPlanet(sys, t, { orbit: RR(0.6, 7), pop: RR(0.2, 1.4), agri: RI(0, 1), ind: RI(0, 2), def: 0, loyalty: 80 });
      }
    }
  }
  const mainTypeW = { terran: 30, desert: 18, ice: 13, volcanic: 12, ocean: 15, garden: 4 };
  function mainPlanet(sys, type, o) {
    return addPlanet(sys, type, Object.assign({ main: true, orbit: RR(1.5, 3.5) }, o));
  }

  function setupRealm(ids, fid) {
    const cap = systems[ids[0]];
    const others = ids.slice(1);
    const gates = others.filter(id => systems[id].tags.gate);
    const interior = others.filter(id => !systems[id].tags.gate);
    // 造船所
    const yardCands = interior.filter(id => systems[id].depth >= 2 && systems[id].depth <= 4);
    RSH(yardCands);
    const yards = yardCands.slice(0, 2);
    // 穀倉
    const agriCands = interior.filter(id => !yards.includes(id) && systems[id].depth >= 2);
    RSH(agriCands);
    const agris = agriCands.slice(0, fid === 'EMP' ? 5 : 4);
    // 首都
    if (fid === 'EMP') {
      mainPlanet(cap, 'garden', { pop: 56, agri: 1, ind: 4, yard: 3, def: 5, isCapital: true, unrest: 5, loyalty: 95 });
      addPlanet(cap, 'volcanic', { orbit: 0.8, pop: 2.2, ind: 3, loyalty: 90 });
      addPlanet(cap, 'gas', { orbit: 6, ind: 2 });
      addPlanet(cap, 'barren', { orbit: 4.5, ind: 1 });
    } else {
      mainPlanet(cap, 'terran', { pop: 40, agri: 2, ind: 4, yard: 3, def: 5, isCapital: true, unrest: 5, loyalty: 95 });
      addPlanet(cap, 'ice', { orbit: 5.2, pop: 1.6, ind: 2, loyalty: 92 });
      addPlanet(cap, 'gas', { orbit: 7, ind: 2 });
    }
    cap.tags.capital = true;
    yards.forEach((id, i) => {
      const s = systems[id];
      mainPlanet(s, RP(['terran', 'desert', 'terran']), { pop: RR(9, 15), agri: 1, ind: 3, yard: i === 0 ? 2 : (fid === 'REP' ? 2 : 1), def: 3 });
      secondaries(s, RI(1, 3)); s.tags.yard = true;
    });
    agris.forEach(id => {
      const s = systems[id];
      mainPlanet(s, R() < 0.7 ? 'ocean' : 'garden', { pop: RR(7, 12.5), agri: 4, ind: 1, def: 2 });
      secondaries(s, RI(0, 2)); s.tags.agri = true;
    });
    gates.forEach(id => {
      const s = systems[id];
      mainPlanet(s, RW({ terran: 3, desert: 3, ice: 2, volcanic: 2 }), { pop: RR(2.5, 6), agri: 1, ind: 2, def: 3 });
      secondaries(s, RI(1, 2)); s.tags.base = true;
    });
    for (const id of others) {
      const s = systems[id];
      if (s.planets.length) continue;
      const d = s.depth;
      const pop = d <= 2 ? RR(4, 10) : d <= 4 ? RR(2, 7) : RR(1, 4.5);
      mainPlanet(s, RW(mainTypeW), { pop, agri: RI(1, 2), ind: RI(1, 2), def: RI(1, 2) });
      secondaries(s, RI(0, 3));
    }
    // 政治的なタグ
    if (fid === 'EMP') {
      const nobleC = others.filter(id => !systems[id].tags.yard && !systems[id].tags.gate && systems[id].depth >= 2);
      // 穀倉2つを含める
      const agriN = nobleC.filter(id => systems[id].tags.agri).slice(0, 2);
      const restN = RSH(nobleC.filter(id => !systems[id].tags.agri)).slice(0, 4);
      for (const id of agriN.concat(restN)) systems[id].tags.noble = true;
    } else {
      for (const id of gates) systems[id].tags.hawk = true;
      if (yards[0] != null) systems[yards[0]].tags.hawk = true;
    }
    for (const id of ids) finishNames(systems[id]);
  }
  setupRealm(empIds, 'EMP');
  setupRealm(repIds, 'REP');

  // 要塞
  const fp = addPlanet(fort, 'fortress', { main: true, pop: 0.05, def: 5, name: 'ケルベロス要塞', orbit: 1, unrest: 0, loyalty: 90, ind: 1 });
  fp.fortress = { hp: 60000, max: 60000 };
  fp.maxPop = 0.05;
  addPlanet(fort, 'barren', { orbit: 3, ind: 1, name: 'ケルベロス II' });
  fort.tags.fortress = true;
  // 自治領
  mainPlanet(herm, 'terran', { pop: 21, agri: 3, ind: 3, yard: 1, def: 4, isCapital: true, loyalty: 92, name: 'ヘルメス' });
  addPlanet(herm, 'gas', { orbit: 6, ind: 2 });
  mainPlanet(merc, 'ocean', { pop: 6.5, agri: 4, ind: 1, def: 2 });
  addPlanet(merc, 'barren', { orbit: 4, ind: 1 });
  mainPlanet(cadu, 'desert', { pop: 5, agri: 1, ind: 3, def: 2 });
  addPlanet(cadu, 'gas', { orbit: 5, ind: 1 });
  finishNames(herm); finishNames(merc); finishNames(cadu);
  // 暗黒星雲
  addPlanet(ereb, 'barren', { orbit: 2 }); addPlanet(ereb, 'gas', { orbit: 6 });
  addPlanet(tart, 'barren', { orbit: 2.5 }); addPlanet(tart, 'barren', { orbit: 5 });
  finishNames(ereb); finishNames(tart);
  for (const s of systems) for (const pid of s.planets) planets[pid].owner = s.owner;

  return { systems, lanes, planets };
}

/* ==========================================================
   state.js — ゲーム状態、初期配置、共通ヘルパー
   ========================================================== */
let G = null;
const HOOKS = {};
function on(evt, fn) { (HOOKS[evt] = HOOKS[evt] || []).push(fn); }
function emit(evt, data) { const hs = HOOKS[evt]; if (hs) for (const h of hs) { try { h(data); } catch (e) { console.error(e); } } }

const sysOf = id => G.systems[id];
const plOf = id => G.planets[id];
function fleetById(id) { for (const f of G.fleets) if (f.id === id) return f; return null; }
function admById(id) { for (const a of G.admirals) if (a.id === id) return a; return null; }
function FAC(fid) { return G.factions[fid]; }
function nid() { return G.nextId++; }

function relKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
function rel(a, b) { return G.rel[relKey(a, b)] || (G.rel[relKey(a, b)] = { war: false, truce: 0 }); }
function setRel(a, b, o) { G.rel[relKey(a, b)] = Object.assign({ war: false, truce: 0 }, o); }
function atWar(a, b) { if (!a || !b || a === b) return false; const r = G.rel[relKey(a, b)]; return !!(r && r.war && !(r.truce > 0)); }
function isEnemyNation(a, b) { if (!a || !b || a === b) return false; const r = G.rel[relKey(a, b)]; return !!(r && r.war); }
function mainEnemy(fid) { return fid === 'EMP' ? 'REP' : fid === 'REP' ? 'EMP' : null; }

function mainPlanet(s) { for (const pid of s.planets) { const p = G.planets[pid]; if (p.main) return p; } return null; }
function sysPlanets(s) { return s.planets.map(pid => G.planets[pid]); }
function fortressOf(s) { const p = mainPlanet(s); return p && p.fortress ? p : null; }

function fleetShips(fl) { const s = fl.ships; return s.BB + s.CR + s.DD + s.CV + s.LT; }
function fleetCombat(fl) { const s = fl.ships; return s.BB + s.CR + s.DD + s.CV; }
function troopMen(divs) { let m = 0; for (const d of divs) m += d.men; return m; }
function troopCap(fl) { return fl.ships.LT * SHIP.LT.troop; }
function fleetsAt(sid) { return G.fleets.filter(f => f.sid === sid && f.to == null); }

  for (let i = 0; i < 40; i++) {

function genAdmiral(fid, tier) {
  const base = tier === 'good' ? 70 : tier === 'poor' ? 48 : 60;
  const st = () => clamp(Math.round(base + gauss() * 9), 30, 92);
  const f = FAC(fid);
  const affs = f && f.pfac ? Object.keys(f.pfac) : [];
  const a = makeAdmiral(fid, {
    name: genAdmiralName(fid), rank: tier === 'good' ? 2 : 1, lead: st(), atk: st(), def: st(), mob: st(), pol: clamp(Math.round(40 + gauss() * 15), 10, 90),
    loyalty: randInt(55, 85), aff: affs.length ? pick(affs) : null, age: randInt(32, 58)
  });

  if (r < 0.12) a.traits.push('fierce'); else if (r < 0.22) a.traits.push('iron'); else if (r < 0.3) a.traits.push('swift');
  else if (r < 0.36) a.traits.push('logi'); else if (r < 0.42) a.traits.push('veteran'); else if (r < 0.46) a.traits.push('ground');
  if (chance(0.1)) a.traits.push('ambitious');

/* ---------- 艦隊 ---------- */
function compFor(total, doc) {
  const d = doc === 'EMP' ? { BB: 0.30, CR: 0.33, DD: 0.20, CV: 0.10, LT: 0.07 }
    : doc === 'REP' ? { BB: 0.22, CR: 0.36, DD: 0.18, CV: 0.16, LT: 0.08 }
      : { BB: 0.25, CR: 0.35, DD: 0.25, CV: 0.10, LT: 0.05 };
  const out = {}; let acc = 0;
  for (const k of SHIP_KEYS) { out[k] = Math.round(total * d[k] / 10) * 10; acc += out[k]; }
  out.CR += Math.round((total - acc) / 10) * 10;
  return out;
}
function makeFleet(fid, name, sid, ships, admId, o) {
  const fl = Object.assign({
    id: nid(), owner: fid, name, sid, from: null, to: null, prog: 0, route: [], dest: null,
    ships: Object.assign({ BB: 0, CR: 0, DD: 0, CV: 0, LT: 0 }, ships), size0: 0,
    morale: 75, supply: 100, training: 60, troops: [], admiral: admId, stance: 'normal',
    ai: { mission: 'idle' }, arrivedDay: -9, lastBattle: -99, moveStart: 0
  }, o);
  fl.size0 = fleetShips(fl);
  if (admId != null) { const a = admById(admId); if (a) a.fleet = fl.id; }
  G.fleets.push(fl); return fl;
}
function newDiv(type, men, morale) { return { id: nid(), type, men: men != null ? men : GDIV[type].men, morale: morale != null ? morale : 75 }; }
function removeFleet(fl) {
  const a = adm(fl); if (a) a.fleet = null;

}

/* ---------- 新規ゲーム ---------- */
function newGame(opts) {
  const seed = opts.seed != null ? opts.seed : ((Math.random() * 2147483647) | 0);
  setSeed(seed ^ 0x2545F491);
  const gal = generateGalaxy(seed);
  G = {
    version: 1, seed, day: 0, startYear: 796, player: opts.player || 'REP', difficulty: opts.difficulty || 'normal',
    speed: 1, paused: true, systems: gal.systems, lanes: gal.lanes, planets: gal.planets,

  for (const fid of ['EMP', 'REP', 'NEU']) G.factions[fid] = makeFactionState(fid);

  Rr.mods.mp = 1.1; // 志願兵制度：人口は少ないが、市民の志願で人員をやや多く確保できる
  N.res = { cr: 30000, food: 26000, sup: 16000, mp: 150 }; N.stability = 75; N.weariness = 5;
  setRel('EMP', 'REP', { war: true }); setRel('EMP', 'NEU', { war: false }); setRel('NEU', 'REP', { war: false });
  for (const fid of ['EMP', 'REP', 'NEU']) {
    const f = G.factions[fid];
    const cap = G.planets.find(p => p.isCapital && p.owner === fid);
    f.capitalPid = cap.id; f.capitalSid = cap.sid;
    f.startSystems = G.systems.filter(s => s.owner === fid).length;
    for (const p of G.planets) if (p.owner === fid) p.origOwner = fid;
  }
  for (const p of G.planets) if (p.origOwner == null) p.origOwner = p.owner;
  // 難易度
  const diff = G.difficulty;
  const ai = G.player === 'EMP' ? Rr : E, pl = G.factions[G.player];
  if (diff === 'easy') { pl.mods.income = 1.2; ai.mods.income = 0.85; for (const k in pl.res) pl.res[k] *= 1.25; }
  if (diff === 'hard') { ai.mods.income = 1.25; for (const k in ai.res) ai.res[k] *= 1.25; pl.mods.income = 0.95; }
  createAdmirals();
  createFleets();
  createGarrisons();
  balanceEconomy();

  log(`あなたは${FACTION_DEFS[G.player].name}の${FACTION_DEFS[G.player].leader}に就任した。`, 'politics', [G.player]);
  return G;
}

function createGarrisons() {
  for (const p of G.planets) {
    if (!p.main) continue;
    if (!p.owner) continue;
    let n;
    if (p.fortress) n = 6;
    else if (p.isCapital) n = 6;
    else n = clamp(1 + Math.floor(p.pop / 9) + Math.floor(p.def / 2), 1, 5);
    for (let i = 0; i < n; i++) {
      const t = p.fortress ? (i < 4 ? 'gar' : 'inf') : (i === 0 ? 'gar' : (i % 3 === 2 ? 'arm' : (i % 2 ? 'inf' : 'gar')));
      p.garrison.push(newDiv(t));
    }
  }
}

function balanceEconomy() {
  // 各大国の食料・物資収支がわずかに黒字になるよう農業/工業レベルを調整する
  for (const fid of ['EMP', 'REP', 'NEU']) {
    const f = G.factions[fid];
    for (let guard = 0; guard < 60; guard++) {
      const b = estimateBalance(fid);
      if (b.food - b.foodCons > b.foodCons * 0.07) break;
      const cands = G.planets.filter(p => p.owner === fid && !PTYPE[p.type].uninhabited && p.type !== 'fortress' && p.agri < 5)
        .sort((a, c) => c.pop * PTYPE[c.type].food - a.pop * PTYPE[a.type].food);
      if (!cands.length) break;
      cands[0].agri++;
    }
    for (let guard = 0; guard < 40; guard++) {
      const b = estimateBalance(fid);
      if (b.sup > b.supCons * 1.8 + 30) break;
      const cands = G.planets.filter(p => p.owner === fid && p.type !== 'fortress' && p.ind < 4).sort((a, c) => (c.pop + 2) * (PTYPE[c.type].ind || 1) - (a.pop + 2) * (PTYPE[a.type].ind || 1));
      if (!cands.length) break;
      cands[0].ind++;
    }
    void f;
  }
}

/* ---------- 補給網 ---------- */
function isBlockaded(s, fid) {
  let hostile = false, own = false;
  for (const fl of G.fleets) {
    if (fl.sid !== s.id || fl.to != null) continue;
    if (fl.owner === fid) own = true; else if (atWar(fl.owner, fid)) hostile = true;
  }
  return hostile && !own;
}
function computeSupply() {
  const n = G.systems.length;
  for (const fid in G.factions) {
    const f = G.factions[fid];
    const m = new Uint8Array(n);
    G.supplyMap[fid] = m;
    if (!f.alive) continue;
    let cap = f.capitalSid != null && G.systems[f.capitalSid].owner === fid ? f.capitalSid : null;
    if (cap == null) {
      let best = -1;
      for (const p of G.planets) if (p.owner === fid && p.main && p.pop > best && !isBlockaded(G.systems[p.sid], fid)) { best = p.pop; cap = p.sid; }
    }
    f.mapSid = cap;
    if (cap == null) continue;
    const q = [cap]; m[cap] = 2;
    while (q.length) {
      const c = q.pop();
      for (const a of G.systems[c].adj) {
        const s = G.systems[a.to];
        if (m[s.id] === 2) continue;
        if (s.owner === fid && !isBlockaded(s, fid)) { m[s.id] = 2; q.push(s.id); }
      }
    }
    for (let i = 0; i < n; i++) if (m[i] === 2) for (const a of G.systems[i].adj) if (m[a.to] === 0) m[a.to] = 1;
  }
}
function supplyState(fid, sid) { const m = G.supplyMap[fid]; return m ? m[sid] : 0; }

/* ---------- 経路探索 ---------- */
function canEnter(fid, s) {
  if (!s.owner || s.owner === fid) return true;
  return atWar(fid, s.owner);
}
function laneFactor(l) { return l.type === 'nebula' ? 0.42 : l.type === 'corridor' ? 0.9 : 1; }
// 稼働中の敵要塞がある星系か（通過しようとすると足止めされ、要塞砲を浴びる）
function hostileFortAt(sid, fid) { const fp = fortressOf(G.systems[sid]); return !!(fp && fp.fortress.hp > 0 && fp.owner && atWar(fid, fp.owner)); }
function findPath(fid, fromSid, toSid, opts) {
  if (fromSid === toSid) return [];
  const n = G.systems.length;
  const distA = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), done = new Uint8Array(n);
  distA[fromSid] = 0;
  const avoid = opts && opts.avoidHostile;
  for (let it = 0; it < n; it++) {
    let u = -1, bd = Infinity;

/* ---------- 視界 ---------- */

/* ---------- 戦力評価 ---------- */

/* ---------- 政治ヘルパー ---------- */

/* ---- economy.js ---- */

/* ==========================================================
   economy.js — 生産・消費・補給・建設・造船・交易
   ========================================================== */
const K_TAX = 2.6;

function planetOutput(p, f) {
  const T = PTYPE[p.type];
  const o = { food: 0, sup: 0, cr: 0, mp: 0, foodCons: 0 };
  if (!f) return o;
  if (T.uninhabited) { if (p.ind > 0) o.sup = T.mine * (0.55 + 0.45 * p.ind) * f.mods.income; return o; }
  if (p.type === 'fortress') { o.sup = 2.5 * p.ind; o.foodCons = 3; return o; }
  const eff = 0.55 + f.stability / 220;
  const um = (1 - p.unrest / 220) * (p.riot > 0 ? 0.5 : 1);
  const inc = f.mods.income;
  o.food = p.pop * T.food * (0.55 + 0.3 * p.agri) * modOf(f, 'harvest') * (p.scorched > 0 ? 0.04 : 1) * (p.isCapital ? 0.55 : 1) * (0.75 + 0.25 * um);
  o.sup = p.pop * T.ind * (0.3 + 0.28 * p.ind) * eff * um * (f.policies.wareco ? 1.3 : 1) * 0.55 * inc;
  o.cr = p.pop * T.tax * f.taxRate * K_TAX * eff * um * (p.isCapital ? 1.8 : 1) * (f.policies.wareco ? 0.88 : 1) * modOf(f, 'taxEff') * inc;
  o.mp = p.pop * 0.006 * (f.policies.mobilize ? 1.6 : 1) * (0.6 + 0.4 * um) * (f.mods.mp || 1);
  o.foodCons = p.pop * (f.policies.ration ? 0.82 : 1);
  return o;
}
function militaryNeeds(fid) {
  let ships = 0, men = 0;
  for (const fl of G.fleets) if (fl.owner === fid) { ships += fleetShips(fl); men += troopMen(fl.troops); }
  for (const p of G.planets) if (p.owner === fid) men += troopMen(p.garrison);
  return { ships, men, food: ships / 1000 * 0.6 + men / 1000 * 0.05, sup: ships / 1000 * 0.35, cr: ships / 1000 * 0.45 + men / 1000 * 0.02 };
}
function estimateBalance(fid) {
  const f = G.factions[fid];
  const b = { food: 0, foodCons: 0, sup: 0, supCons: 0, cr: 0, crCons: 0, mp: 0 };
  for (const p of G.planets) {
    if (p.owner !== fid) continue;
    const o = planetOutput(p, f);
    b.food += o.food; b.foodCons += o.foodCons; b.sup += o.sup; b.cr += o.cr; b.mp += o.mp;
  }
  const mil = militaryNeeds(fid);
  b.foodCons += mil.food; b.supCons += mil.sup; b.crCons += mil.cr;
  return b;
}

function dailyEconomy() {
  const blkCache = new Map();
  const blk = (s, fid) => { const k = s.id + fid; if (!blkCache.has(k)) blkCache.set(k, isBlockaded(s, fid)); return blkCache.get(k); };
  for (const fid in G.factions) {
    const f = G.factions[fid];
    if (!f.alive) continue;
    const m = G.supplyMap[fid] || new Uint8Array(G.systems.length);
    let food = 0, cons = 0, sup = 0, cr = 0, mp = 0;
    for (const p of G.planets) {
      if (p.owner !== fid) continue;
      if (p.scorched > 0) p.scorched--;
      if (p.riot > 0) p.riot--;
      if (p.martial > 0) p.martial--;
      const s = G.systems[p.sid];
      const o = planetOutput(p, f);
      if (blk(s, fid)) { p.unrest = Math.min(100, p.unrest + 0.25); continue; }
      const k = m[s.id] === 2 ? 1 : 0.35;
      food += o.food * k; cons += o.foodCons * k; sup += o.sup * k; cr += o.cr * k; mp += o.mp * k;
    }
    let shipsIn = 0, shipsAll = 0, menAll = 0;
    for (const fl of G.fleets) {
      if (fl.owner !== fid) continue;
      const n = fleetShips(fl);
      shipsAll += n; menAll += troopMen(fl.troops);
      if (fl.sid != null && fl.to == null && m[fl.sid] === 2) shipsIn += n;
    }
    for (const p of G.planets) if (p.owner === fid) menAll += troopMen(p.garrison);
    const milFood = shipsIn / 1000 * 0.6 + menAll / 1000 * 0.05;
    const upkeep = (shipsAll / 1000 * 0.45 + menAll / 1000 * 0.02) * (fid === 'NEU' ? 0.6 : 1);
    const maint = shipsAll / 1000 * 0.35;
    // 食料
    const need = cons + milFood;
    const avail = f.res.food + food;
    if (avail >= need) { f.res.food = avail - need; f.shortage.food = f.shortage.food * 0.9; }
    else { const sev = need > 0 ? 1 - Math.max(0, avail) / need : 0; f.res.food = 0; f.shortage.food = f.shortage.food * 0.9 + sev * 0.1 + 0.02; }
    if (f.shortage.food < 0.005) f.shortage.food = 0;
    L(f, 'food', 'prod', food); L(f, 'food', 'civ', -cons); L(f, 'food', 'mil', -milFood);
    // 物資
    f.res.sup += sup - maint; L(f, 'sup', 'prod', sup); L(f, 'sup', 'maint', -maint);
    if (f.res.sup < 0) { f.res.sup = 0; f.shortage.sup = Math.min(1, f.shortage.sup + 0.05); } else f.shortage.sup *= 0.9;
    // 資金
    f.res.cr += cr - upkeep; L(f, 'cr', 'tax', cr); L(f, 'cr', 'upkeep', -upkeep);
    f.shortage.cr = f.res.cr < 0 ? 1 : 0;
    // 人員
    f.res.mp += mp; L(f, 'mp', 'gen', mp);
    // 欠乏の影響
    if (f.shortage.food > 0.03 && f.pfac) {
      addStab(f, -0.22 * Math.min(1, f.shortage.food * 3));
      for (const p of G.planets) if (p.owner === fid && p.pop > 0) p.unrest = Math.min(100, p.unrest + 0.35 * Math.min(1, f.shortage.food * 3));
    }
    if (f.res.cr < 0 && f.pfac) addStab(f, -0.05);
    // 時限修正
    for (const t of f.timed) t.days--;
    f.timed = f.timed.filter(t => t.days > 0);
  }
}

function dailyFleetLogistics() {
  for (const fl of G.fleets) {
    const f = G.factions[fl.owner];
    if (!f) continue;
    const a = adm(fl);
    const logi = hasTrait(a, 'logi') ? 0.6 : 1;
    const n = fleetShips(fl);
    let st;
    if (fl.to == null) st = supplyState(fl.owner, fl.sid);
    else {
      const s1 = supplyState(fl.owner, fl.from), s2 = supplyState(fl.owner, fl.to);
      st = (s1 === 2 && s2 === 2) ? 3 : Math.max(s1, s2) >= 1 ? 1 : 0;
    }
    if (st === 2) {
      if (fl.supply < 100) {
        const need = Math.min(100 - fl.supply, 14);
        const cF = n / 1000 * 50 * need / 100, cS = n / 1000 * 120 * need / 100;
        let k = 1;
        if (cF > 0 && f.res.food < cF) k = Math.min(k, Math.max(0, f.res.food) / cF);
        if (cS > 0 && f.res.sup < cS) k = Math.min(k, Math.max(0, f.res.sup) / cS);
        f.res.food -= cF * k; f.res.sup -= cS * k; fl.supply += need * k;
        L(f, 'food', 'resupply', -cF * k); L(f, 'sup', 'resupply', -cS * k);
      }
    } else if (st === 3) { /* 補給圏内を移動中 */ }
    else if (st === 1) fl.supply -= 0.55 * logi;
    else fl.supply -= 1.5 * logi;
    fl.supply = clamp(fl.supply, 0, 100);
    if (fl.supply < 25) fl.morale -= fl.supply <= 0 ? 2.2 : 0.7;
    if (fl.supply <= 0) {
      for (const k of SHIP_KEYS) fl.ships[k] = Math.max(0, fl.ships[k] - Math.ceil(fl.ships[k] * 0.004));
    } else if (st === 2 && fl.to == null) {
      const cap = 70 + (a ? a.lead / 5 : 0);
      if (fl.morale < cap) fl.morale += 1.2 * (hasTrait(a, 'genius') ? 1.5 : 1);
      if (fl.training < 88) fl.training += 0.1 * (hasTrait(a, 'veteran') ? 1.5 : 1);
      for (const d of fl.troops) d.morale = Math.min(85, d.morale + 1);
    }
    if (f.shortage.food > 0.03 && st >= 2) fl.morale -= 0.9 * Math.min(1, f.shortage.food * 3);
    if (f.res.cr < 0) fl.morale -= 0.3;
    fl.morale = clamp(fl.morale, 5, 100);
  }
  // 守備隊の士気
  for (const p of G.planets) {
    if (!p.garrison.length) continue;
    const s = G.systems[p.sid];
    const sieged = s.siege && s.siege.by;
    for (const d of p.garrison) d.morale = clamp(d.morale + (sieged ? -0.3 : 0.8), 10, 85);
  }
}

/* ---------- 支払い ---------- */
function canAfford(f, c) {
  return f.res.cr >= (c.cr || 0) && f.res.sup >= (c.sup || 0) && f.res.food >= (c.food || 0) && f.res.mp >= (c.mp || 0) && f.pc >= (c.pc || 0);
}
function pay(f, c, cat) {

  if (c.cr) L(f, 'cr', cat, -c.cr);
  if (c.sup) L(f, 'sup', cat, -c.sup);
  if (c.food) L(f, 'food', 'other', -c.food);
  if (c.mp) L(f, 'mp', cat === 'ships' ? 'ships' : cat === 'troops' ? 'troops' : 'other', -c.mp);
}
function costText(c) {
  const parts = [];
  if (c.cr) parts.push(`資金${fmt(c.cr)}`);
  if (c.sup) parts.push(`物資${fmt(c.sup)}`);
  if (c.food) parts.push(`食料${fmt(c.food)}`);
  if (c.mp) parts.push(`人員${fmt1(c.mp)}万`);

}

/* ---------- 建設 ---------- */
function buildLevel(p, kind) { return kind === 'mine' ? p.ind : p[kind]; }
function buildCost(p, kind) { return BUILD[kind].cost(buildLevel(p, kind)); }
function canBuild(p, kind, fid) {
  const T = PTYPE[p.type];
  if (p.owner !== fid) return { ok: false, why: '自国の惑星ではない' };
  if (p.build) return { ok: false, why: '建設中' };
  const lvl = buildLevel(p, kind);
  if (lvl >= BUILD[kind].max) return { ok: false, why: '最大レベル' };
  if (kind === 'mine' && !T.uninhabited) return { ok: false, why: '無人惑星のみ' };
  if (kind !== 'mine' && T.uninhabited) return { ok: false, why: '無人惑星' };
  if (p.type === 'fortress' && kind !== 'def') return { ok: false, why: '要塞では不可' };
  if (kind === 'yard' && (!p.main || p.pop < 3)) return { ok: false, why: '人口3億以上の主惑星が必要' };
  if (isBlockaded(G.systems[p.sid], fid)) return { ok: false, why: '封鎖中' };
  const c = buildCost(p, kind);

/* ---------- 造船 ---------- */
function shipOrderCost(fid, cls, n) {

}
function shipOrderDays(cls, yardLvl) { return Math.round(SHIP[cls].days * (1.1 - 0.15 * yardLvl)); }
function canOrderShips(s, fid, cls, n) {

/* ---------- 徴募 ---------- */

function dailyConstruction() {
  for (const p of G.planets) {
    if (p.build) {
      if (p.build.fid !== p.owner) p.build = null;
      else if (!isBlockaded(G.systems[p.sid], p.owner)) {
        p.build.days--;
        if (p.build.days <= 0) {
          const k = p.build.kind === 'mine' ? 'ind' : p.build.kind;
          p[k]++;
          if (p.owner === G.player) log(`${p.name}の${BUILD[p.build.kind].name}がLv${p[k]}になった。`, 'economy', [p.owner]);
          p.build = null;
        }
      }
    }
    if (p.recruit.length) {
      const r = p.recruit[0];
      if (r.fid !== p.owner) p.recruit = [];
      else {
        r.days--;
        if (r.days <= 0) {
          p.garrison.push(newDiv(r.type, null, 70));
          p.recruit.shift();
          if (p.owner === G.player) log(`${p.name}で${GDIV[r.type].name}の編成が完了した。`, 'economy', [p.owner]);
        }
      }
    }
  }
  for (const s of G.systems) {
    if (!s.yardQueue.length) continue;
    const mp = mainPlanet(s);
    if (!mp || !s.owner || mp.yard <= 0) { s.yardQueue = []; continue; }
    s.yardQueue = s.yardQueue.filter(o => o.fid === s.owner);
    if (isBlockaded(s, s.owner)) continue;
    const act = Math.min(mp.yard, s.yardQueue.length);
    for (let i = 0; i < act; i++) s.yardQueue[i].days--;
    const done = s.yardQueue.filter(o => o.days <= 0);
    for (const o of done) {
      reserveOf(s, o.fid)[o.cls] += o.n;
      if (o.fid === G.player) log(`${s.name}造船所で${SHIP[o.cls].name}${fmt(o.n)}隻が竣工した（予備艦として待機中）。`, 'economy', [o.fid]);
    }
    s.yardQueue = s.yardQueue.filter(o => o.days > 0);
  }
}

/* ---------- 予備艦の編入 ---------- */
function absorbReserves(fl, maxN) {
  if (fl.sid == null || fl.to != null) return 0;
  const s = G.systems[fl.sid];
  const r = s.reserve[fl.owner];
  if (!r) return 0;
  let room = Math.min(admiralMaxShips(adm(fl)) - fleetShips(fl), maxN != null ? maxN : Infinity);
  if (room <= 0) return 0;
  const before = fleetShips(fl);
  let moved = 0;
  for (const k of SHIP_KEYS) {
    const t = Math.min(r[k], room - moved);
    if (t <= 0) continue;
    r[k] -= t; fl.ships[k] += t; moved += t;
  }
  if (moved > 0) {
    fl.training = (fl.training * before + 35 * moved) / (before + moved);
    fl.size0 = Math.max(fl.size0, fleetShips(fl));
  }
  return moved;
}
function createFleetFromReserve(s, fid, admId, name) {
  const r = s.reserve[fid];
  if (!r || reserveTotal(s, fid) < 500) return null;
  const a = admById(admId);
  const fl = makeFleet(fid, name, s.id, { BB: 0, CR: 0, DD: 0, CV: 0, LT: 0 }, admId, { training: 35, morale: 70 });
  absorbReserves(fl);
  fl.training = 35;
  void a;
  return fl;
}
function nextFleetName(fid) {
  const used = new Set(G.fleets.filter(f => f.owner === fid).map(f => f.name));
  const KN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
  for (let i = 1; i <= 20; i++) {
    const n = fid === 'EMP' ? `第${KN[i - 1]}艦隊` : `第${i}艦隊`;
    if (!used.has(n)) return n;
  }
  return `独立艦隊${randInt(10, 99)}`;
}

/* ---------- 交易（ヘルメス自治領） ---------- */
function tradeAvailable(fid) {
  const N = G.factions.NEU;
  if (!N || !N.alive || fid === 'NEU') return false;
  const r = G.rel[relKey(fid, 'NEU')];
  return !(r && r.war);
}
function tradePrice(item, buy) {
  const base = item === 'food' ? 1.0 : 1.5;
  const m = G.market[item];
  return buy ? base * m * 1.2 : base * m * 0.72;
}
function doTrade(fid, item, qty) {
  if (!tradeAvailable(fid)) return { ok: false, why: '自治領との交易ができない' };
  const f = FAC(fid), N = G.factions.NEU;
  const buy = qty > 0, q = Math.abs(qty);
  const price = tradePrice(item, buy);
  const total = Math.round(price * q);
  if (buy) {
    if (f.res.cr < total) return { ok: false, why: '資金不足' };
    if (N.res[item] < q) return { ok: false, why: '自治領の在庫不足' };
    f.res.cr -= total; f.res[item] += q; N.res.cr += total; N.res[item] -= q;
    L(f, 'cr', 'trade', -total); L(f, item, 'trade', q);
    G.market[item] = clamp(G.market[item] * (1 + 0.006 * q / 1000), 0.5, 2.8);
  } else {
    if (f.res[item] < q) return { ok: false, why: '在庫不足' };
    if (N.res.cr < total) return { ok: false, why: '自治領の資金不足' };
    f.res.cr += total; f.res[item] -= q; N.res.cr -= total; N.res[item] += q;
    L(f, 'cr', 'trade', total); L(f, item, 'trade', -q);
    G.market[item] = clamp(G.market[item] * (1 - 0.004 * q / 1000), 0.5, 2.8);
  }
  f.trade += q;
  return { ok: true, total };
}
function takeLoan(fid) {
  if (!tradeAvailable(fid)) return { ok: false, why: '自治領との取引ができない' };
  const f = FAC(fid);
  if (f.loans.length >= 2) return { ok: false, why: '融資枠の上限' };
  const N = G.factions.NEU;
  if (N.res.cr < 3000) return { ok: false, why: '自治領の資金不足' };
  N.res.cr -= 3000; f.res.cr += 3000; L(f, 'cr', 'debt', 3000);
  f.loans.push({ months: 30, pay: 120 });
  return { ok: true };
}

/* ---------- 月次 ---------- */
function monthlyEconomy() {
  for (const fid in G.factions) {
    const f = G.factions[fid];
    if (!f.alive) continue;
    f.lastMonth = f.ledger; f.ledger = newLedger();
    for (const ln of f.loans) {
      f.res.cr -= ln.pay; L(f, 'cr', 'debt', -ln.pay); ln.months--;
      if (G.factions.NEU) G.factions.NEU.res.cr += ln.pay;
    }
    f.loans = f.loans.filter(l => l.months > 0);
    for (const b of f.bonds) { f.res.cr -= b.pay; L(f, 'cr', 'debt', -b.pay); b.months--; }
    f.bonds = f.bonds.filter(b => b.months > 0);
    // 備蓄食料の劣化（消費120日分を超える分）
    const fb = estimateBalance(fid);
    const over = f.res.food - fb.foodCons * 120;
    if (over > 0) { const sp = over * 0.12; f.res.food -= sp; L(f, 'food', 'other', -sp); }
    // 惑星
    for (const p of G.planets) {
      if (p.owner !== fid || PTYPE[p.type].uninhabited || p.type === 'fortress') continue;
      if (f.shortage.food > 0.05) p.pop = Math.max(0.05, p.pop * (1 - 0.006 * Math.min(1, f.shortage.food * 2)));
      else if (p.pop < p.maxPop) p.pop += p.pop * 0.0018 * (1 - p.pop / p.maxPop) * 4;
      const occ = p.origOwner !== p.owner;
      const s = G.systems[p.sid];
      let target = 8 + (occ ? Math.max(0, 55 - p.loyalty * 0.6) : 0) + Math.max(0, f.taxRate - 0.3) * 90
        + f.shortage.food * 45 + (100 - f.stability) * 0.18 + (s.siege ? 18 : 0) + (p.scorched > 0 ? 20 : 0)
        + (f.policies.ration ? 6 : 0) + (f.policies.mobilize ? 5 : 0) - (p.martial > 0 ? 28 : 0);
      if (fid === 'NEU') target -= 10;
      p.unrest = clamp(p.unrest + (target - p.unrest) * 0.3, 0, 100);
      if (occ && f.shortage.food < 0.05) p.loyalty = Math.min(80, p.loyalty + 1.5);
      if (p.unrest > 78 && chance(0.12)) planetRevolt(p);
    }
  }
  for (const k of ['food', 'sup']) G.market[k] += (1 - G.market[k]) * 0.15;
  const N = G.factions.NEU;
  if (N && N.alive) { N.res.food = Math.min(60000, N.res.food + 2500); N.res.sup = Math.min(60000, N.res.sup + 1500); }
}

function planetRevolt(p) {
  const f = FAC(p.owner);
  const occ = p.origOwner !== p.owner;
  const orig = p.origOwner && G.factions[p.origOwner];
  const gs = troopStrength(p.garrison) * 1.3;
  if (occ && orig && orig.alive && isEnemyNation(p.origOwner, p.owner) && gs < p.pop * 2500) {
    const old = p.owner;
    log(`【蜂起】${p.name}で住民が蜂起し、${FACTION_DEFS[p.origOwner].short}側に寝返った！`, 'alert', [old, p.origOwner]);
    capturePlanet(p, p.origOwner, [newDiv('mil', Math.round(2000 + p.pop * 800), 60)], { revolt: true });
    return;
  }
  p.riot = 60; p.unrest = Math.max(0, p.unrest - 20);
  for (const d of p.garrison) d.morale = Math.max(10, d.morale - 20);
  if (f && f.pfac) addStab(f, -1);
  log(`【暴動】${p.name}で大規模な暴動が発生。生産が半減している。`, 'alert', [p.owner]);
}

function recordHistory() {
  const h = { day: G.day, f: {} };
  for (const fid in G.factions) {
    const f = G.factions[fid];
    if (!f.alive) continue;
    let ships = 0; for (const fl of G.fleets) if (fl.owner === fid) ships += fleetShips(fl);
    h.f[fid] = { cr: Math.round(f.res.cr), food: Math.round(f.res.food), sup: Math.round(f.res.sup), mp: Math.round(f.res.mp), st: Math.round(f.stability), su: Math.round(support(f)), we: Math.round(f.weariness), ships, sys: G.systems.filter(s => s.owner === fid).length };
  }
  G.history.push(h);
  if (G.history.length > 120) G.history.shift();
}

/* ==========================================================
   politics.js — 派閥・政策・事件・選挙・内乱・停戦・講和
   ========================================================== */
function govKeys(f) {
  return f.gov === 'empire' ? { hawk: 'military', dove: 'reform', third: 'nobles' }
    : f.gov === 'republic' ? { hawk: 'hawks', dove: 'doves', third: 'biz' } : null;
}
function inTruce(fid) { const e = mainEnemy(fid); return !!(e && G.rel[relKey(fid, e)] && G.rel[relKey(fid, e)].truce > 0); }
// 本来の領土（開戦時の自国領域）のうち失った割合、および敵本土を占領している割合
function territoryLoss(fid) {
  let tot = 0, held = 0;
  for (const s of G.systems) if (s.region === fid) { tot++; if (s.owner === fid) held++; }
  return tot ? clamp(1 - held / tot, 0, 1) : 0;
}
function territoryGain(fid) {
  const e = mainEnemy(fid);
  if (!e) return 0;
  let tot = 0, held = 0;
  for (const s of G.systems) if (s.region === e) { tot++; if (s.owner === fid) held++; }
  return tot ? held / tot : 0;
}

/* ---------- 戦況への反応 ---------- */
function polReact(fid, kind, scale) {
  const f = FAC(fid);
  if (!f || !f.alive) return;
  scale = scale == null ? 1 : scale;
  const k = govKeys(f);
  const has = !!k;
  switch (kind) {
    case 'victory':
      if (has) { pf(f, k.hawk, 3 * scale); pf(f, k.third, 1 * scale); pf(f, k.dove, 0.5 * scale); }
      addWear(f, -1.5 * scale); addStab(f, 0.8 * scale); f.recent.wins += scale; break;
    case 'defeat':
      if (has) { pf(f, k.hawk, -3 * scale); pf(f, k.third, -1 * scale); pf(f, k.dove, -0.5 * scale); }
      addWear(f, 2 * scale); addStab(f, -0.8 * scale); f.recent.losses += scale; break;
    case 'captured':
      if (has) { pf(f, k.hawk, 3 * scale); pf(f, k.third, 1.5 * scale); }
      addWear(f, -1.5 * scale); addStab(f, 1 * scale); break;
    case 'lost':
      if (has) { pf(f, k.hawk, -3 * scale); pf(f, k.third, -2 * scale); pf(f, k.dove, -1 * scale); }
      addWear(f, 3 * scale); addStab(f, -2 * scale); break;
  }
}
function lossWeariness(fid, ships, men) {
  const f = FAC(fid);
  if (!f) return;
  addWear(f, ships / 4000 + men / 30000);
}

/* ---------- 月次 ---------- */
function monthlyPolitics() {
  for (const fid in G.factions) {
    const f = G.factions[fid];
    if (!f.alive) continue;
    if (fid === 'NEU' || fid === 'REB') { f.stability = clamp(f.stability + (60 - f.stability) * 0.1, 0, 100); f.pc = Math.min(150, f.pc + 5); continue; }
    monthlyApprovals(f);
    monthlyPower(f);
    // 安定度
    const truce = inTruce(fid);
    const capLost = f.capitalPid != null && G.planets[f.capitalPid].owner !== fid;
    const lostFrac = territoryLoss(fid), gainFrac = territoryGain(fid);
    let target = 56 + (support(f) - 50) * 0.5 - f.weariness * 0.3 - Math.max(0, f.taxRate - 0.3) * 120 + Math.max(0, 0.3 - f.taxRate) * 40
      + (f.shortage.food > 0.05 ? -14 * Math.min(1, f.shortage.food * 3) : 4)
      + (f.policies.mobilize ? -6 : 0) + (f.policies.wareco ? -4 : 0) + (f.policies.ration ? -5 : 0)
      + (truce ? 4 : 0) + f.reforms * 2 + (capLost ? -20 : 0) + (G.factions.REB && G.factions.REB.alive && G.factions.REB.origin === fid ? -8 : 0)
      - Math.max(0, lostFrac - 0.08) * 40 + Math.min(8, gainFrac * 16);
    f.stability = clamp(f.stability + (target - f.stability) * 0.15, 0, 100);
    // 厭戦
    const enemy = mainEnemy(fid);
    if (enemy && isEnemyNation(fid, enemy) && !truce) addWear(f, 0.6); else addWear(f, -2.5);
    addWear(f, (10 - f.weariness) * 0.02);
    // 政治力
    f.pc = Math.min(150, f.pc + 3 + support(f) / 9);
    // 提督の忠誠
    for (const a of G.admirals) {
      if (a.fid !== fid || a.status !== 'active') continue;
      if (hasTrait(a, 'ambitious') && support(f) < 45) a.loyalty -= 1;
      const pa = a.aff && f.pfac[a.aff];
      if (pa) { if (pa.appr < 30) a.loyalty -= 1; else if (pa.appr > 60) a.loyalty += 0.5; }
      a.loyalty = clamp(a.loyalty, 0, 100);
    }
    // 皇帝
    if (f.emperor && !f.emperor.dead) {
      f.emperor.age += 1 / 12;
      f.emperor.health -= randRange(0, 1.4) + (f.emperor.age > 74 ? 0.7 : 0);
    }
    // 喪失条件・警告
    checkPoliticalCollapse(f);
    // 事件
    rollEvent(f);
    f.campaignBonus = Math.max(0, f.campaignBonus - 0.2);
  }
  // 反乱軍の終息
  const R = G.factions.REB;
  if (R && R.alive && !G.planets.some(p => p.owner === 'REB')) endRebellion();
  // 講和・停戦の申し入れ（AIから）
  aiDiplomacyMonthly();
}

function monthlyApprovals(f) {
  for (const k in f.pfac) f.pfac[k].appr += (50 - f.pfac[k].appr) * 0.03;
  const truce = inTruce(f.id);
  const sf = f.shortage.food > 0.05;
  // 国土を大きく失った政府は、どの派閥からも見放されていく
  const lostFrac = territoryLoss(f.id);
  if (lostFrac > 0.2) allAppr(f, -(lostFrac - 0.2) * 2);
  if (f.gov === 'empire') {
    if (f.taxRate > 0.35) { pf(f, 'nobles', -2); pf(f, 'reform', -1.5); }
    if (f.taxRate < 0.25) pf(f, 'nobles', 1);
    if (sf) { pf(f, 'reform', -3); pf(f, 'military', -1); }
    if (f.policies.mobilize) pf(f, 'reform', -1);
    if (f.policies.ration) pf(f, 'reform', -1.5);
    if (truce) { pf(f, 'military', -2.5); pf(f, 'reform', 1); }
  } else if (f.gov === 'republic') {
    if (truce) { pf(f, 'hawks', -3); pf(f, 'doves', 2); pf(f, 'biz', 1); }
    if (f.weariness > 50) pf(f, 'doves', -(f.weariness - 50) * 0.08);
    if (f.taxRate > 0.35) pf(f, 'biz', -2.5);
    if (sf || f.shortage.sup > 0.1) { pf(f, 'biz', -2.5); pf(f, 'doves', -1.5); }
    if (f.policies.wareco) pf(f, 'biz', -1.5);
    if (f.policies.mobilize) pf(f, 'doves', -1);
    if (f.res.cr < 0) pf(f, 'biz', -2);
  }
}
function monthlyPower(f) {
  const r = f.recent;
  if (f.gov === 'empire') {
    f.pfac.military.power += (r.wins - r.losses) * 0.6;
    f.pfac.reform.power += (f.weariness - 40) * 0.02 + f.shortage.food * 2;
    f.pfac.nobles.power -= f.reforms * 0.12;
  } else if (f.gov === 'republic') {
    f.pfac.doves.power += (f.weariness - 45) * 0.05;
    f.pfac.hawks.power += (r.wins - r.losses) * 0.7 - (f.weariness - 45) * 0.02;
    f.pfac.biz.power += f.res.cr > 5000 ? 0.3 : -0.3;
  }
  for (const k in f.pfac) f.pfac[k].power = clamp(f.pfac[k].power, 5, 75);
  normalizePower(f);
  r.wins *= 0.6; r.losses *= 0.6;
}

function checkPoliticalCollapse(f) {
  const sup = support(f);
  if (sup < 22) f.lowSupportMonths++; else f.lowSupportMonths = 0;
  if (f.stability <= 5) f.collapseMonths++; else f.collapseMonths = 0;
  if (f.id === G.player) {
    if (sup < 30 && f.lowSupportMonths < 4) log(`【警告】支持率が${Math.round(sup)}%まで低下している。22%を下回る状態が4か月続けば失脚する。`, 'alert', [f.id]);
    if (f.stability < 15) log(`【警告】国内の安定度が${Math.round(f.stability)}まで低下している。国家崩壊の危機だ。`, 'alert', [f.id]);
    if (f.lowSupportMonths >= 4) {
      gameOver(false, f.gov === 'empire' ? '宰相罷免' : '議長解任',
        f.gov === 'empire' ? '宮廷の支持を失ったあなたは、皇帝の名において宰相の職を解かれた。門閥貴族たちの祝宴は三日三晩続いたという。'
          : '議会は議長不信任案を可決した。あなたは職を追われ、後任の政権は前任者の失政を糾弾する声明を発表した。');
    } else if (f.collapseMonths >= 3) {
      gameOver(false, '国家崩壊', '国内の秩序は崩壊し、各地で星系政府が中央からの離脱を宣言した。あなたの国はもはや戦争を続けることができない。');
    }
  } else {
    if (f.collapseMonths >= 3 && f.id === mainEnemy(G.player)) {
      gameOver(true, '敵国崩壊', `${f.name}は国内の混乱に耐えきれず、無条件降伏を申し入れてきた。銀河の覇権はあなたの手に帰した。`);
    } else if (f.lowSupportMonths >= 4) {
      f.lowSupportMonths = 0;
      addStab(f, -8);
      for (const k in f.pfac) f.pfac[k].appr = 50;
      f.ai.peaceBias = (f.ai.peaceBias || 0) + 15;
      log(`【政変】${f.name}で政変が起き、指導部が交代した。`, 'politics');
    }
  }
}

function aiDiplomacyMonthly() {

function startRebellion(origin, kind) {

  const R = makeFactionState('REB', { name, short: kind === 'noble' ? '貴族連合' : '再建委', origin, kind });
  R.res = { cr: 5000, food: 18000, sup: 6000, mp: 120 }; R.stability = 55; R.weariness = 10;
  G.factions.REB = R;

  const tag = kind === 'noble' ? 'noble' : 'hawk';
  const affKey = kind === 'noble' ? 'nobles' : 'hawks';
  let ns = 0;
  for (const s of G.systems) {
    if (s.owner !== origin || !s.tags[tag] || s.tags.capital) continue;
    for (const pid of s.planets) { const p = G.planets[pid]; if (p.owner === origin) { p.owner = 'REB'; p.build = null; p.recruit = []; } }
    s.owner = 'REB'; s.yardQueue = []; ns++;

  }
  let nf = 0;
  for (const fl of G.fleets) {
    if (fl.owner !== origin) continue;
    const a = adm(fl);
    if (a && a.aff === affKey && a.loyalty < 65) { fl.owner = 'REB'; a.fid = 'REB'; fl.ai = { mission: 'idle' }; fl.route = []; fl.dest = null; nf++; }
  }
  let best = null;
  for (const p of G.planets) if (p.owner === 'REB' && p.main && (!best || p.pop > best.pop)) best = p;
  if (best) { R.capitalPid = best.id; R.capitalSid = best.sid; }
  R.startSystems = ns;
  addStab(o, -12);
  if (o.pfac[affKey]) { pfPower(o, affKey, -o.pfac[affKey].power * 0.4); }
  G.terrVer++;
  const title = kind === 'noble' ? '貴族連合の反乱' : '軍事クーデター';
  const text = kind === 'noble'
    ? `宰相府の専横に憤った門閥貴族たちが「${name}」を結成し、反旗を翻した。${ns}星系と${nf}個艦隊が中央政府から離脱した。帝国は内乱に突入した。`
    : `主戦派の将校団が「${name}」を名乗って決起し、軍事政権の樹立を宣言した。${ns}星系と${nf}個艦隊が政府の統制を離れた。`;
  log(`【内乱】${title}：${ns}星系・${nf}個艦隊が${FACTION_DEFS[origin].short}から離反した。`, 'alert');
  if (origin === G.player) queueNotice(title, text + ' 反乱軍を鎮圧せよ。反乱勢力が首都を落とせば政府は崩壊する。');
  else queueNotice(`${FACTION_DEFS[origin].name}で内乱`, text + ' 敵国の混乱は好機である。');
  return true;
}
function endRebellion() {

function assignStandIn(fl) {

}
function evText(v, f, c) { return typeof v === 'function' ? v(f, c) : v; }
function rollEvent(f) {

}

}

function gameOver(win, title, text) {
