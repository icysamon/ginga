      const stt = d.state === 'dead' ? '<span class="bad">全滅</span>' : d.state === 'gone' ? '<span class="dim">離脱</span>' : d.state === 'rout' ? '<span class="bad">潰走</span>' : esc(FORMS[d.form].name);
      html += `<div class="li${this.sel.has(d.id) ? ' sel' : ''}" data-div="${d.id}"><div class="t"><span class="chip">${SHIP[d.cls].short}</span><b>${TAC_CLS_NAME[d.cls]}</b><span class="num" style="margin-left:auto">${fmt(d.ships)}</span></div>
        <div class="s"><span>${stt}</span>${d.flag ? '<span class="c-gold" style="color:var(--brass)">旗艦</span>' : ''}${d.cd.volley > 0 && d.state === 'ok' ? `<span>斉射${Math.ceil(d.cd.volley)}s</span>` : ''}</div>
        <div class="bar" style="color:${barCol(d.morale)}"><i style="width:${clamp(d.morale, 0, 100)}%"></i></div></div>`;
    }
    list.innerHTML = html; list.scrollTop = st;
    // 選択情報
    const selEl = document.getElementById('tacSel');
    const sel = [...this.sel].map(id => T.byId.get(id)).filter(d => d && d.state === 'ok');
    if (!sel.length) selEl.hidden = true;
    else {
      selEl.hidden = false;
      const forms = [...new Set(sel.map(d => FORMS[d.form].name))].join('・');
      selEl.innerHTML = `<div class="eyebrow">選択中 ${sel.length}分艦隊</div><div class="kv" style="margin-top:6px"><span>艦艇</span><span>${fmt(sum(sel, d => d.ships))}隻</span><span>陣形</span><span style="font-family:var(--f-ui)">${forms}</span><span>平均士気</span><span>${Math.round(sum(sel, d => d.morale) / sel.length)}</span></div><div class="dim" style="margin-top:6px;font-size:11.5px">右クリック：移動／敵を右クリック：攻撃</div>`;
    }
  },
  log(text, kind) {
    const el = document.getElementById('tacLog');
    const d = document.createElement('div');
    d.textContent = text;
    d.style.borderLeftColor = kind === 'good' ? 'var(--good)' : kind === 'bad' ? 'var(--bad)' : kind === 'warn' ? 'var(--warn)' : 'var(--line-2)';
    el.appendChild(d);
    while (el.children.length > 7) el.removeChild(el.firstChild);
    setTimeout(() => { if (d.parentNode) { d.style.transition = 'opacity .5s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 500); } }, 7000);
  },

  /* ---------- 命令 ---------- */
  selIds() { return [...this.sel]; },
  cmd(c, d) {
    const T = this.T;
    if (!T) return;
    const ids = this.selIds();
    switch (c) {
      case 'speed': { const v = +d.v; if (v === 0) this.paused = !this.paused; else { this.speed = v; this.paused = false; } break; }
      case 'ai': T.ai[0] = !T.ai[0]; this.log(T.ai[0] ? '自軍の指揮をAIに委任した' : '直接指揮に戻した', 'info'); break;
      case 'list': document.getElementById('tacList').classList.toggle('open'); break;
      case 'form': if (!ids.length) { this.log('分艦隊を選択してください', 'warn'); break; } tacCmdForm(T, ids, d.v); break;
      case 'volley': { if (!ids.length) { this.log('分艦隊を選択してください', 'warn'); break; } const n = tacCmdVolley(T, ids); if (!n) this.log('斉射の準備ができていない', 'warn'); break; }
      case 'charge': { if (!ids.length) { this.log('分艦隊を選択してください', 'warn'); break; } const n = tacCmdCharge(T, ids); if (!n) this.log('突撃の準備ができていない', 'warn'); break; }
      case 'hold': tacCmdHold(T, ids); break;
      case 'back': tacCmdBack(T, ids); break;
      case 'all': this.sel.clear(); for (const x of T.divs) if (x.side === 0 && x.state === 'ok' && !x.static) this.sel.add(x.id); break;
      case 'fort': this.fortAim = !this.fortAim; break;
      case 'retreat': tacRetreatAll(T, 0); this.paused = false; break;
      case 'help': this.paused = true; Modals.show(() => `${Modals.head('Tactics · 操作', '艦隊戦の操作')}<div class="body help">
        <ul><li>左クリックで分艦隊を選択、ドラッグで範囲選択、Shiftで追加。左の一覧からも選べる（ダブルクリックで視点を移動）。</li>
        <li>右クリックで移動、敵の上で右クリックすると攻撃目標に指定する。タッチ操作では、選択した状態で地点や敵をタップする。</li>
        <li>側面（1.4倍）・背面（1.8倍）からの攻撃は大きな損害と士気の低下を与える。巡航艦で回り込み、戦艦で正面を支えるのが基本だ。</li>
        <li>士気が15を切った分艦隊は潰走し、命令を受け付けなくなる。旗艦を失うと艦隊全体の士気が下がる。</li>
        <li>キー：<kbd>Space</kbd> 一時停止、<kbd>1</kbd>〜<kbd>4</kbd> 陣形、<kbd>V</kbd> 斉射、<kbd>C</kbd> 突撃、<kbd>H</kbd> 停止、<kbd>B</kbd> 後退、<kbd>W A S D</kbd> 視点移動、ホイールで拡大縮小。</li></ul></div>`, { cls: 'narrow' }); break;
    }
    this.renderHud(true);
  },
  onKey(e) {
    if (Main.screen !== 'tac' || !this.T) return;
    if (UI.modalOpen()) return;
    this.keys[e.code] = true;
    const T = this.T, ids = this.selIds();
    if (e.code === 'Space') { e.preventDefault(); this.paused = !this.paused; }
    else if (e.key >= '1' && e.key <= '4') tacCmdForm(T, ids, FORM_KEYS[+e.key - 1]);
    else if (e.key === 'v' || e.key === 'V') tacCmdVolley(T, ids);
    else if (e.key === 'c' || e.key === 'C') tacCmdCharge(T, ids);
    else if (e.key === 'h' || e.key === 'H') tacCmdHold(T, ids);
    else if (e.key === 'b' || e.key === 'B') tacCmdBack(T, ids);
    else if ((e.key === 'a' || e.key === 'A') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.cmd('all', {}); }
    else if (e.key === 'Escape') { this.sel.clear(); this.fortAim = false; }
    this.renderHud(true);
  },
  divAt(wx, wy, sideFilter) {
    let best = null, bd = 1e9;
    for (const d of this.T.divs) {
      if (!tAlive(d)) continue;
      if (sideFilter != null && d.side !== sideFilter) continue;
      const dd = Math.hypot(d.x - wx, d.y - wy);
      const r = d.r * (d.static ? 1 : 1.05) + 14 / this.cam.z;
      if (dd < r && dd < bd) { bd = dd; best = d; }
    }
    return best;
  },
  onDown(e) {
    this.cv.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button, type: e.pointerType });
    const rect = this.cv.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.cam.z, cx: this.cam.x, cy: this.cam.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      this.drag = null; this.box = null; return;
    }
    this.drag = { sx, sy, cx: this.cam.x, cy: this.cam.y, moved: false, btn: e.button, type: e.pointerType };
  },
  onMove(e) {
    const p = this.pointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    const rect = this.cv.getBoundingClientRect();
    if (this.pinch && this.pointers.size >= 2) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      this.cam.z = clamp(this.pinch.z * d / Math.max(10, this.pinch.d), 0.06, 2);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      this.cam.x = this.pinch.cx - (mx - this.pinch.mx) / this.cam.z; this.cam.y = this.pinch.cy - (my - this.pinch.my) / this.cam.z;
      return;
    }
    if (!this.drag) return;
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const dx = sx - this.drag.sx, dy = sy - this.drag.sy;
    if (!this.drag.moved && Math.hypot(dx, dy) > 6) this.drag.moved = true;
    if (!this.drag.moved) return;
    if (this.drag.btn === 1 || this.drag.type === 'touch' || this.drag.btn === 2) {
      this.cam.x = this.drag.cx - dx / this.cam.z; this.cam.y = this.drag.cy - dy / this.cam.z;
    } else if (this.drag.btn === 0) {
      this.box = { x0: this.drag.sx, y0: this.drag.sy, x1: sx, y1: sy };
    }
  },
  onUp(e) {
    const p = this.pointers.get(e.pointerId);
    this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinch = null;
    const drag = this.drag; this.drag = null;
    const rect = this.cv.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const [wx, wy] = this.s2w(sx, sy);
    const T = this.T;
    if (!T || !p) return;
    if (this.box) {
      const b = this.box; this.box = null;
      const x0 = Math.min(b.x0, b.x1), x1 = Math.max(b.x0, b.x1), y0 = Math.min(b.y0, b.y1), y1 = Math.max(b.y0, b.y1);
      if (!e.shiftKey) this.sel.clear();
      for (const d of T.divs) {
        if (d.side !== 0 || d.state !== 'ok' || d.static) continue;
        const [dx, dy] = this.w2s(d.x, d.y);
        if (dx >= x0 && dx <= x1 && dy >= y0 && dy <= y1) this.sel.add(d.id);
      }
      this.renderHud(true);
      return;
    }
    if (drag && drag.moved) return;
    if (this.fortAim) {
      const f = T.divs.find(d => d.cls === 'FORT' && d.side === 0 && d.state === 'ok');
      if (f) { f.main.manualAim = Math.atan2(wy - f.y, wx - f.x); this.log(f.main.cd > 0 ? `照準を設定した。発射まで${Math.ceil(f.main.cd)}秒` : '主砲、発射準備', 'info'); }
      this.fortAim = false; this.renderHud(true); return;
    }
    const isRight = p.btn === 2;
    const touch = p.type === 'touch' || p.type === 'pen';
    const own = this.divAt(wx, wy, 0);
    const enemy = this.divAt(wx, wy, 1);
    if (isRight || (touch && this.sel.size && !own)) {
      const ids = this.selIds();
      if (!ids.length) return;
      if (enemy) { tacCmdAttack(T, ids, enemy.id); this.ping(enemy.x, enemy.y, '#e0675d'); }
      else { tacCmdMove(T, ids, wx, wy); this.ping(wx, wy, '#f2e8d0'); }
      return;
    }
    if (own && own.state === 'ok') {
      const now = performance.now();
      if (now - this.lastClick.t < 350 && this.lastClick.id === own.id) {
        for (const d of T.divs) if (d.fleetId === own.fleetId && d.side === 0 && d.state === 'ok') this.sel.add(d.id);
      } else if (e.shiftKey || touch) { if (this.sel.has(own.id)) this.sel.delete(own.id); else this.sel.add(own.id); }
      else { this.sel.clear(); this.sel.add(own.id); }
      this.lastClick = { t: now, id: own.id };
    } else if (!touch) this.sel.clear();
    this.renderHud(true);
  },
  ping(x, y, col) { for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; this.parts.push({ x: x + Math.cos(a) * 30, y: y + Math.sin(a) * 30, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, life: 0.5, max: 0.5, r: 2, col, type: 'hit' }); } },
  onWheel(e) {
    e.preventDefault();
    const rect = this.cv.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const [wx, wy] = this.s2w(mx, my);
    this.cam.z = clamp(this.cam.z * Math.exp(-e.deltaY * 0.0015), 0.06, 2);
    const [wx2, wy2] = this.s2w(mx, my);
    this.cam.x += wx - wx2; this.cam.y += wy - wy2;
  },

  /* ---------- 終了 ---------- */
  showEnd() {
    const T = this.T;
    const loser = T.over.loser;
    const youWin = loser === 1, youLose = loser === 0;
    const title = youWin ? '勝利' : youLose ? (T.retreating[0] ? '撤退' : '敗北') : '決着つかず';
    const lines = [0, 1].map(s => {
      const all = T.divs.filter(d => d.side === s && !d.static);
      const s0 = sum(all, d => d.ships0), s1 = sum(all.filter(d => d.state !== 'dead'), d => d.ships);
      return `<tr><td style="color:${T.sides[s].color}">${esc(T.sides[s].name)}</td><td class="r">${fmt(s0)}</td><td class="r bad">${fmt(s0 - s1)}</td><td class="r">${fmt(s1)}</td></tr>`;
    }).join('');
    Modals.show(() => `${Modals.head('Battle over · 戦闘終了', `${esc(T.sysName)}星系会戦　${title}`, false)}<div class="body">
      <div class="tbl-wrap"><table class="t"><thead><tr><th>陣営</th><th class="r">参加</th><th class="r">喪失</th><th class="r">残存</th></tr></thead><tbody>${lines}</tbody></table></div>
      <p class="dim" style="font-size:12.5px;margin-top:10px">戦闘時間 ${Math.floor(T.t / 60)}分${Math.floor(T.t % 60)}秒。${T.timeout ? '時間切れのため、損害の大きい側が退いた。' : ''}</p></div>
      <footer><button class="btn primary" type="button" data-act="tac-end">戦略画面へ戻る</button></footer>`, { closable: false, cls: 'narrow' });
  },
  finish() {
    const T = this.T;
    const res = tacResult(T);
    const rep = finishBattle(this.pend.battle, res);
    G.pending.shift();
    this.T = null; this.pend = null;
    return rep;
  }
};

/* ==========================================================
   ground_view.js — 地上戦の描画と操作
   ========================================================== */
const GndView = {
  S: null, pend: null, cv: null, ctx: null, dpr: 1, w: 0, h: 0, cam: { x: 600, y: 380, z: 1 },
  sel: new Set(), mode: null, speed: 1, paused: false, acc: 0, t: 0, evIdx: 0, ended: false,
  terr: null, over: null, overVer: '', hoverD: null, parts: [], pointers: new Map(), drag: null, pinch: null, lastClick: { t: 0, id: null },

  init() {
    this.cv = document.getElementById('gndCanvas');
    this.ctx = this.cv.getContext('2d');
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => this.onDown(e));
    cv.addEventListener('pointermove', e => this.onMove(e));
    cv.addEventListener('pointerup', e => this.onUp(e));
    cv.addEventListener('pointercancel', e => { this.pointers.delete(e.pointerId); this.drag = null; this.pinch = null; });
    cv.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => this.onKey(e));
    for (const id of ['gndCmd', 'gndTop', 'gndLz']) document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b && !b.disabled) this.cmd(b.dataset.g, b.dataset); });
    document.getElementById('gndListBody').addEventListener('click', e => {
      const r = e.target.closest('[data-u]'); if (!r) return;
      const id = +r.dataset.u;
      if (e.shiftKey) { if (this.sel.has(id)) this.sel.delete(id); else this.sel.add(id); } else { this.sel.clear(); this.sel.add(id); }
      this.renderHud(true);
    });
  },
  start(pend) {
    this.pend = pend;
    this.S = createGround(pend.inv, { playerFid: G.player });
    this.sel.clear(); this.mode = null; this.speed = 1; this.paused = false; this.acc = 0; this.t = 0; this.evIdx = 0; this.ended = false; this.parts = []; this.overVer = '';
    this.resize(); this.fit();
    this.buildTerrain();
    this.buildHud(); this.renderHud(true);
    const att = this.S.attSide === 0;
    this.log(att ? '降下地点を最大3か所選び、「降下開始」を押す。' : `敵軍が${this.S.p.name}に降下した。首都区画を守り抜け。`, 'info');
    if (!att) this.paused = true;
  },
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr);
  },
  fit() {
    const mobile = this.w < 900;
    const aw = this.w - (mobile ? 16 : 600), ah = this.h - (mobile ? 230 : 150);
    this.cam.z = clamp(Math.min(aw / GND_W, ah / GND_H), 0.25, 2.2);
    this.cam.x = GND_W / 2 + (mobile ? 0 : 0); this.cam.y = GND_H / 2 + (mobile ? 40 / this.cam.z : 0);
  },
  w2s(x, y) { return [(x - this.cam.x) * this.cam.z + this.w / 2, (y - this.cam.y) * this.cam.z + this.h / 2]; },
  s2w(x, y) { return [(x - this.w / 2) / this.cam.z + this.cam.x, (y - this.h / 2) / this.cam.z + this.cam.y]; },
  buildTerrain() {
    const S = this.S, sf = S.surf, C = GND_COLS, R = GND_ROWS, CELL = GND_CELL;
    const c = document.createElement('canvas'); c.width = GND_W; c.height = GND_H;
    const g = c.getContext('2d');

  buildOverlay() {

  frame(dt) {
    const S = this.S;
    if (!S) return;
    this.t += dt;
    if (!this.paused && !S.over) {
      this.acc += Math.min(0.25, dt) * this.speed;
      let n = 0;
      while (this.acc >= GND_DT && n < 16) { gndStep(S); this.acc -= GND_DT; n++; }
    } else if (S.phase === 'landing' && S.bomb.queue.length) { this.acc += dt; while (this.acc >= GND_DT) { gndStep(S); this.acc -= GND_DT; } }
    this.processEvents();
    for (const p of this.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    this.parts = this.parts.filter(p => p.life > 0);
    // 戦闘中の区画の火花
    if (!this.paused) for (const D of S.districts) if (D.fightT != null && S.t - D.fightT < 0.3 && rand() < 0.5 && this.parts.length < 400) {
      this.parts.push({ x: D.x + (rand() - 0.5) * 60, y: D.y + (rand() - 0.5) * 50, vx: 0, vy: -8, life: 0.5, max: 0.5, r: 2 + rand() * 3, col: rand() < 0.5 ? '#ffd29a' : '#ff8a5a' });
    }
    this.render();
    this.renderHud(false);
    if (S.over && !this.ended) { this.ended = true; setTimeout(() => this.showEnd(), 800); }
  },
  processEvents() {
    const S = this.S;
    while (this.evIdx < S.events.length) {
      const e = S.events[this.evIdx++];
      const mine = e.side === 0;
      if (e.type === 'capture') { const D = S.districts[e.d]; this.log(`${D.name}を${mine ? '制圧した' : '奪われた'}`, mine ? 'good' : 'bad'); }
      else if (e.type === 'unitLost') { const u = S.units.find(x => x.id === e.id); this.log(`${GDIV[u.type].name}が${mine ? '壊滅した' : '撃破された'}`, mine ? 'bad' : 'good'); }
      else if (e.type === 'surrender') this.log(mine ? '包囲された部隊が降伏した' : '敵部隊が降伏した', mine ? 'bad' : 'good');
      else if (e.type === 'retreat') this.log(mine ? '士気の崩れた部隊が後退した' : '敵部隊が後退した', mine ? 'warn' : 'good');
      else if (e.type === 'militia') this.log('民兵が蜂起して防衛に加わった', S.defSide === 0 ? 'good' : 'warn');
      else if (e.type === 'bomb') { const D = S.districts[e.d]; this.log(`${D.name}に軌道爆撃`, 'warn'); for (let i = 0; i < 40; i++) { const a = rand() * Math.PI * 2, v = 30 + rand() * 120; this.parts.push({ x: D.x, y: D.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 + rand(), max: 2, r: 3 + rand() * 6, col: rand() < 0.5 ? '#fff0c8' : '#ff9a5a' }); } }
      else if (e.type === 'landed') this.log('降下部隊が地表に到達した', 'good');
    }
  },
  render() {
    const S = this.S, ctx = this.ctx, z = this.cam.z;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#04060b'; ctx.fillRect(0, 0, this.w, this.h);
    const [x0, y0] = this.w2s(0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.terr, x0, y0, GND_W * z, GND_H * z);
    this.buildOverlay();
    ctx.drawImage(this.over, x0, y0, GND_W * z, GND_H * z);
    ctx.strokeStyle = 'rgba(196,168,115,0.35)'; ctx.strokeRect(x0, y0, GND_W * z, GND_H * z);
    // 区画
    for (const D of S.districts) {
      const [sx, sy] = this.w2s(D.x, D.y);
      const lz = S.lzs.includes(D.id) || (S.phase === 'landing' && this.pendLz && this.pendLz.includes(D.id));
      if (lz) { ctx.strokeStyle = 'rgba(242,232,208,0.9)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx, sy, 34 * clamp(z, 0.7, 1.4), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      if (this.hoverD === D.id) { ctx.strokeStyle = 'rgba(242,232,208,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, 40 * clamp(z, 0.7, 1.4), 0, Math.PI * 2); ctx.stroke(); }
      if (D.cap) { ctx.strokeStyle = hexA(S.sides[D.cap.side].color, 0.95); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, 28, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * D.cap.t / 2.5); ctx.stroke(); }
      ctx.font = `700 ${D.terrain === 'capital' ? 14 : 12}px "Shippori Mincho B1", serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(3,5,10,0.85)';
      const ny = sy - 26 * clamp(z, 0.7, 1.3);
      ctx.strokeText(D.name, sx, ny); ctx.fillStyle = D.terrain === 'capital' ? '#f2e8d0' : 'rgba(235,235,225,0.92)'; ctx.fillText(D.name, sx, ny);
      if (z > 0.55) {
        ctx.font = '500 9.5px "IBM Plex Mono", monospace'; ctx.fillStyle = 'rgba(220,226,236,0.75)';
        const info = `${TERRAIN[D.terrain].name} 防×${TERRAIN[D.terrain].def}${D.fort ? ' 塹壕' + D.fort : ''}${D.aa ? ' 対空' + Math.round(D.aa) : ''}`;
        ctx.strokeText(info, sx, ny + 12); ctx.fillText(info, sx, ny + 12);

    }

      ctx.strokeStyle = `rgba(224,103,93,${0.5 + 0.5 * Math.sin(this.t * 12)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI * 2); ctx.moveTo(sx - 40, sy); ctx.lineTo(sx + 40, sy); ctx.moveTo(sx, sy - 40); ctx.lineTo(sx, sy + 40); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,230,190,${0.3 * (1 - b.t / 2.5)})`; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, sy); ctx.stroke();

      const D = S.districts[did];

      const per = 3, n = us.length;
      us.forEach((u, i) => {
        const col = i % per, row = Math.floor(i / per);

    }
    for (const u of S.units) {
      if (u.state !== 'ok' || !u.mv) continue;

      const k = u.mv.t / u.mv.T;
      const x = lerp(A.x, B.x, k), y = lerp(A.y, B.y, k);
      const [ax, ay] = this.w2s(A.x, A.y), [bx, by] = this.w2s(B.x, B.y);
      ctx.strokeStyle = hexA(S.sides[u.side].color, 0.6); ctx.lineWidth = 2; ctx.setLineDash([6, 4]);

      this.drawUnit(ctx, u, x, y);
    }
    // 選択中の経路
    for (const id of this.sel) {
      const u = S.units.find(x => x.id === id);
      if (!u || u.state !== 'ok' || !u.path.length) continue;
      let from = u.mv ? S.districts[u.mv.to] : S.districts[u.d];
      ctx.strokeStyle = 'rgba(242,232,208,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 4]);
      ctx.beginPath(); let [px, py] = this.w2s(from.x, from.y); ctx.moveTo(px, py);
      for (const d of u.path) { const D = S.districts[d]; [px, py] = this.w2s(D.x, D.y); ctx.lineTo(px, py); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    for (const p of this.parts) {
      const [sx, sy] = this.w2s(p.x, p.y);
      ctx.fillStyle = hexA(p.col, p.life / p.max);
      ctx.beginPath(); ctx.arc(sx, sy, p.r * clamp(z, 0.6, 1.6), 0, Math.PI * 2); ctx.fill();
    }
    if (this.mode === 'bomb') { ctx.fillStyle = 'rgba(224,103,93,0.95)'; ctx.font = '600 13px "Zen Kaku Gothic New", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText('軌道爆撃の目標区画を選ぶ', this.w / 2, this.h - 100); }
  },
  drawUnit(ctx, u, wx, wy) {
    const S = this.S, z = this.cam.z;
    const [sx, sy] = this.w2s(wx, wy);
    const k = clamp(z, 0.75, 1.5);
    const W = 34 * k, H = 22 * k;
    const col = S.sides[u.side].color;
    ctx.fillStyle = 'rgba(8,12,20,0.88)'; ctx.fillRect(sx - W / 2, sy - H / 2, W, H);
    ctx.strokeStyle = col; ctx.lineWidth = this.sel.has(u.id) ? 2.4 : 1.4;
    ctx.strokeRect(sx - W / 2, sy - H / 2, W, H);
    if (this.sel.has(u.id)) { ctx.strokeStyle = '#f2e8d0'; ctx.lineWidth = 1; ctx.strokeRect(sx - W / 2 - 3, sy - H / 2 - 3, W + 6, H + 6); }

    if (u.type === 'arm') { ctx.ellipse(sx, sy, (x1 - x0) / 2, (y1 - y0) / 2.4, 0, 0, Math.PI * 2); }
    if (u.type === 'asl') { ctx.moveTo(x0, y1); ctx.lineTo(sx, y0); ctx.lineTo(x1, y1); ctx.moveTo(sx - 5 * k, sy); ctx.lineTo(sx + 5 * k, sy); }
    if (u.type === 'gar') { ctx.moveTo(x0, sy); ctx.lineTo(x1, sy); }
    if (u.type === 'mil') { ctx.arc(sx, sy, 4 * k, 0, Math.PI * 2); }
    ctx.stroke();
    ctx.font = `500 ${Math.round(9.5 * k)}px "IBM Plex Mono", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(3,5,10,0.9)';

  renderHud(force) {

    for (const u of mine) {
      const stt = u.state !== 'ok' ? '<span class="bad">壊滅</span>' : u.mv ? `→ ${esc(S.districts[u.mv.to].name)}` : gndEngaged(S, u) ? '<span class="warn">交戦中</span>' : esc(S.districts[u.d].name);
      html += `<div class="li${this.sel.has(u.id) ? ' sel' : ''}" data-u="${u.id}"><div class="t"><span class="chip">${GDIV[u.type].short}</span><b>${GDIV[u.type].name}</b><span class="num" style="margin-left:auto">${fmtCompact(u.men)}</span></div><div class="s"><span>${stt}</span>${!u.sup && u.side === S.attSide && u.state === 'ok' ? '<span class="bad">補給切れ</span>' : ''}</div><div class="bar" style="color:${barCol(u.morale)}"><i style="width:${clamp(u.morale, 0, 100)}%"></i></div></div>`;
    }
    list.innerHTML = html; list.scrollTop = st;
  },
  log(text, kind) { this.logTo(text, kind); },
  logTo(text, kind) {
    const el = document.getElementById('gndLog');
    const d = document.createElement('div');
    d.textContent = text;
    d.style.borderLeftColor = kind === 'good' ? 'var(--good)' : kind === 'bad' ? 'var(--bad)' : kind === 'warn' ? 'var(--warn)' : 'var(--line-2)';
    el.appendChild(d);
    while (el.children.length > 7) el.removeChild(el.firstChild);
    setTimeout(() => { if (d.parentNode) { d.style.transition = 'opacity .5s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 500); } }, 7000);
  },
  cmd(c, d) {
    const S = this.S;
    if (!S) return;
    switch (c) {
      case 'speed': { const v = +d.v; if (v === 0) this.paused = !this.paused; else { this.speed = v; this.paused = false; } break; }
      case 'list': document.getElementById('gndList').classList.toggle('open'); break;
      case 'all': this.sel.clear(); for (const u of S.units) if (u.side === 0 && u.state === 'ok') this.sel.add(u.id); break;
      case 'none': this.sel.clear(); this.mode = null; break;
      case 'bomb': this.mode = this.mode === 'bomb' ? null : 'bomb'; break;
      case 'withdraw': gndWithdraw(S); break;
      case 'autolz': {
        const sc = S.districts.map(D => ({ id: D.id, s: -gndLandingLoss(S, D) * 30 + (D.adj.includes(S.capId) ? 4 : 0) + (D.terrain === 'spaceport' ? 3 : 0) - (D.terrain === 'capital' ? 6 : 0) - gndUnitsIn(S, D.id, S.defSide).length * 5 })).sort((a, b) => b.s - a.s);
        this.pendLz = sc.slice(0, clamp(Math.ceil(S.inv.divs.length / 2), 1, 3)).map(x => x.id); break;
      }
      case 'clearlz': this.pendLz = []; break;
      case 'land': if (this.pendLz && this.pendLz.length) { gndLand(S, this.pendLz); this.pendLz = []; this.paused = false; } break;
      case 'help': this.paused = true; Modals.show(() => `${Modals.head('Ground · 操作', '地上戦の操作')}<div class="body help"><ul>
        <li>部隊の駒をクリックして選び、移動先の区画をクリック（または右クリック）すると進軍する。敵のいる区画に入ると戦闘になる。</li>
        <li>防御側は地形・塹壕・陣地の効果を受ける。市街・山岳・首都は守りに強く、機甲師団は平原で強い。</li>
        <li>敵のいない区画に入ると2.5秒で制圧できる。攻撃側の補給は、降下地点か宇宙港から自軍の区画をたどって届き、その隣の区画（前線）までが補給圏になる。そこより奥へ突出した部隊は補給が切れ、火力が落ちて消耗する。</li>
        <li>軌道爆撃は区画内の敵に大打撃を与え塹壕と対空砲を壊すが、市街に撃てば民間人が死に、国内で非難される。</li>
        <li>首都区画を制圧すれば勝利。勝ち目がなければ「撤収する」で生き残りを艦隊に戻せる。</li></ul></div>`, { cls: 'narrow' }); break;
    }
    this.renderHud(true);
  },
  onKey(e) {
    if (Main.screen !== 'gnd' || !this.S || UI.modalOpen()) return;
    if (e.code === 'Space') { e.preventDefault(); this.paused = !this.paused; }
    else if (e.key === 'Escape') { this.sel.clear(); this.mode = null; }
    else if ((e.key === 'a' || e.key === 'A') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); this.cmd('all', {}); }
    this.renderHud(true);
  },
  districtAt(wx, wy) {
    const q = Math.floor(wx / GND_CELL), r = Math.floor(wy / GND_CELL);
    if (q < 0 || r < 0 || q >= GND_COLS || r >= GND_ROWS) return null;
    const d = this.S.surf.own[r * GND_COLS + q];
    return d >= 0 ? d : null;
  },
  unitAt(sx, sy) {
    for (let i = (this.hits || []).length - 1; i >= 0; i--) { const h = this.hits[i]; if (Math.abs(sx - h.x) < h.w / 2 + 3 && Math.abs(sy - h.y) < h.h / 2 + 3) return h; }
    return null;
  },
  onDown(e) {
    this.cv.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button, type: e.pointerType });
    if (this.pointers.size === 2) { const [a, b] = [...this.pointers.values()]; this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.cam.z, cx: this.cam.x, cy: this.cam.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; this.drag = null; return; }
    this.drag = { x: e.clientX, y: e.clientY, cx: this.cam.x, cy: this.cam.y, moved: false };
  },
  onMove(e) {
    const p = this.pointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    if (this.pinch && this.pointers.size >= 2) {
      const [a, b] = [...this.pointers.values()];
      this.cam.z = clamp(this.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(10, this.pinch.d), 0.25, 3);
      this.cam.x = this.pinch.cx - ((a.x + b.x) / 2 - this.pinch.mx) / this.cam.z; this.cam.y = this.pinch.cy - ((a.y + b.y) / 2 - this.pinch.my) / this.cam.z;
      return;
    }
    const rect = this.cv.getBoundingClientRect();
    if (this.drag) {
      const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
      if (!this.drag.moved && Math.hypot(dx, dy) > 6) this.drag.moved = true;
      if (this.drag.moved) { this.cam.x = this.drag.cx - dx / this.cam.z; this.cam.y = this.drag.cy - dy / this.cam.z; }
      return;
    }
    if (e.pointerType === 'mouse') { const [wx, wy] = this.s2w(e.clientX - rect.left, e.clientY - rect.top); this.hoverD = this.districtAt(wx, wy); }
  },
  onUp(e) {
    const p = this.pointers.get(e.pointerId);
    this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinch = null;
    const drag = this.drag; this.drag = null;
    if (!p || (drag && drag.moved)) return;
    const S = this.S;
    const rect = this.cv.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const [wx, wy] = this.s2w(sx, sy);
    const did = this.districtAt(wx, wy);
    if (this.mode === 'bomb') {
      if (did != null) { if (gndBombard(S, did, S.attSide)) this.log(`${S.districts[did].name}への軌道爆撃を要請した`, 'info'); }
      this.mode = null; this.renderHud(true); return;
    }
    if (S.phase === 'landing' && S.attSide === 0) {
      if (did == null) return;
      const lz = this.pendLz || (this.pendLz = []);
      const i = lz.indexOf(did);
      if (i >= 0) lz.splice(i, 1); else if (lz.length < 3) lz.push(did); else { lz.shift(); lz.push(did); }
      this.renderHud(true); return;
    }
    const hit = this.unitAt(sx, sy);
    if (p.btn !== 2 && hit && hit.side === 0) {
      const now = performance.now();
      const u = S.units.find(x => x.id === hit.id);
      if (now - this.lastClick.t < 350 && this.lastClick.id === hit.id && u && !u.mv) { for (const x of gndUnitsIn(S, u.d, 0)) this.sel.add(x.id); }
      else if (e.shiftKey || p.type !== 'mouse') { if (this.sel.has(hit.id)) this.sel.delete(hit.id); else this.sel.add(hit.id); }
      else { this.sel.clear(); this.sel.add(hit.id); }
      this.lastClick = { t: now, id: hit.id };
      this.renderHud(true); return;
    }
    if (did != null && this.sel.size) {
      gndOrderMove(S, [...this.sel], did, 0);
      const D = S.districts[did];
      for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; this.parts.push({ x: D.x + Math.cos(a) * 14, y: D.y + Math.sin(a) * 14, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, life: 0.45, max: 0.45, r: 2, col: '#f2e8d0' }); }
      this.renderHud(true); return;
    }
    if (p.type === 'mouse' && p.btn === 0) { this.sel.clear(); this.renderHud(true); }
  },
  onWheel(e) {
    e.preventDefault();
    const rect = this.cv.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const [wx, wy] = this.s2w(mx, my);
    this.cam.z = clamp(this.cam.z * Math.exp(-e.deltaY * 0.0015), 0.25, 3);
    const [wx2, wy2] = this.s2w(mx, my);
    this.cam.x += wx - wx2; this.cam.y += wy - wy2;
  },
  showEnd() {
    const S = this.S;
    const youAtt = S.attSide === 0;
    const win = (S.over.winner === 0);
    const reason = S.over.reason === 'capital' ? '首都区画が陥落した。' : S.over.reason === 'wiped' ? (S.over.winner === S.attSide ? '守備隊は壊滅した。' : '降下部隊は壊滅した。') : S.over.withdrawn ? '攻撃側は撤収した。' : '';
    Modals.show(() => `${Modals.head('Ground battle over · 地上戦終了', `${esc(S.p.name)}　${win ? '勝利' : '敗北'}`, false)}<div class="body">
      <p class="ev-text">${esc(reason)}${youAtt ? (win ? '惑星は我が軍の支配下に入る。' : '惑星の攻略はならなかった。') : (win ? '惑星を守り抜いた。' : '惑星は敵の手に落ちる。')}</p>
      <div class="kv" style="max-width:360px">${[0, 1].map(s => `<span>${esc(S.sides[s].name)}の残存兵力</span><span>${fmtMen(sum(S.units.filter(u => u.side === s && u.state === 'ok'), u => u.men))}</span>`).join('')}${S.civ ? `<span>市街への爆撃</span><span class="bad">${S.civ}回</span>` : ''}</div></div>
      <footer><button class="btn primary" type="button" data-act="gnd-end">戦略画面へ戻る</button></footer>`, { closable: false, cls: 'narrow' });
  },
  finish() {
    const S = this.S;
    const res = gndResult(S);
    const rep = finishGround(this.pend.inv, res);
    G.pending.shift();
    this.S = null; this.pend = null;
    return rep;
  }
};

const Title = {
  cv: null, ctx: null, stars: [], w: 0, h: 0, dpr: 1, seed: 0, diff: 'normal', stats: null,
  init() {
    this.cv = document.getElementById('titleCanvas');
    this.ctx = this.cv.getContext('2d');
    for (let i = 0; i < 520; i++) this.stars.push({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random(), b: Math.random() });
    document.getElementById('diffSeg').addEventListener('click', e => {
      const b = e.target.closest('[data-diff]'); if (!b) return;
      this.diff = b.dataset.diff;
      document.querySelectorAll('#diffSeg button').forEach(x => x.classList.toggle('on', x === b));
    });
    document.getElementById('btnHelpTitle').addEventListener('click', () => Modals.help());
    document.getElementById('btnContinue').addEventListener('click', () => {
      const k = Main.latestSave();
      if (k && !Main.load(k)) UI.toast('保存データを読み込めなかった。', 'alert');
    });
    document.getElementById('facCards').addEventListener('click', e => {
      const b = e.target.closest('[data-start]'); if (!b) return;
      Main.newGame(b.dataset.start, this.diff, this.seed);
    });
  },
  refresh() {
    this.seed = (Math.random() * 2147483647) | 0;
    const gal = generateGalaxy(this.seed);
    const st = {};
    for (const fid of ['EMP', 'REP']) {
      const sys = gal.systems.filter(s => s.owner === fid).length;
      const pop = gal.planets.filter(p => p.owner === fid).reduce((a, p) => a + p.pop, 0);
      st[fid] = { sys, pop };
    }
    const ships = { EMP: 126000, REP: 103000 };
    document.getElementById('facCards').innerHTML = ['REP', 'EMP'].map(fid => {
      const d = FACTION_DEFS[fid];
      return `<div class="fac-card panel ticks" style="--fc:${d.color}">
        <h2>${emblemSVG(fid)}${esc(d.name)}</h2>
        <p>${esc(d.blurb)}</p>
        <div class="fac-stats"><div><b>${st[fid].sys}</b><span>星系</span></div><div><b>${Math.round(st[fid].pop)}億</b><span>人口</span></div><div><b>${(ships[fid] / 10000).toFixed(1)}万</b><span>艦艇</span></div></div>
        <div class="dim" style="font-size:12px">${fid === 'EMP' ? '強み：国力・艦艇数・ケルベロス要塞　弱み：門閥貴族、老いた皇帝' : '強み：名将、安定した民意　弱み：国力、人員不足、議会選挙'}</div>
        <button class="btn primary" type="button" data-start="${fid}">${fid === 'EMP' ? '帝国宰相として始める' : '評議会議長として始める'}</button></div>`;
    }).join('');
    document.getElementById('btnContinue').hidden = !Main.latestSave();
    const k = Main.latestSave();
    if (k) document.getElementById('btnContinue').textContent = `続きから再開（${Main.saveLabel(k)}）`;
  },
  resize() {
    const r = this.cv.getBoundingClientRect();
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = r.width; this.h = r.height;
    this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr);
  },
  frame(dt) {
    const g = this.ctx;
    if (!this.w) this.resize();
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const grd = g.createRadialGradient(this.w * 0.72, this.h * 0.4, 20, this.w * 0.6, this.h * 0.5, Math.max(this.w, this.h));
    grd.addColorStop(0, '#0e1a30'); grd.addColorStop(0.5, '#070c18'); grd.addColorStop(1, '#030509');
    g.fillStyle = grd; g.fillRect(0, 0, this.w, this.h);
    const cx = this.w * 0.6, cy = this.h * 0.5, f = Math.max(this.w, this.h) * 0.6;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    for (const s of this.stars) {
      if (!reduce) s.z -= dt * 0.035;
      if (s.z <= 0.02) { s.z = 1; s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; }
      const px = cx + s.x / s.z * f * 0.5, py = cy + s.y / s.z * f * 0.5;
      if (px < 0 || py < 0 || px > this.w || py > this.h) continue;
      const a = Math.min(1, (1 - s.z) * 1.3) * (0.4 + s.b * 0.6);
      const sz = (1 - s.z) * 2.2 + 0.4;
      g.fillStyle = `rgba(225,232,255,${a})`;
      g.fillRect(px, py, sz, sz);
    }
  }
};

const Main = {
  screen: 'title', last: 0, lastTop: 0,
  boot(data) {
    UI.init(); MapView.init(); TacView.init(); GndView.init(); Title.init();
    window.addEventListener('resize', () => this.onResize());
    // 戦術・地上画面の上部表示の高さ（狭い画面では折り返して伸びる）を、ログや一覧の位置決めに渡す
    for (const [scr, top] of [['tac', 'tacTop'], ['gnd', 'gndTop']]) {
      const el = document.getElementById(top), sc = document.getElementById(scr);
      const setH = () => { if (el.offsetHeight) sc.style.setProperty('--hudh', el.offsetHeight + 'px'); };
      if (window.ResizeObserver) new ResizeObserver(setH).observe(el);
    }
    on('gameover', o => { setTimeout(() => { if (Main.screen === 'strat') Modals.gameOver(o); else Main.pendingGameOver = o; }, 400); });
    on('month', () => this.autosave());
    let resumed = false;
    if (data && data.save) resumed = this.loadFromString(data.save, data.view);
    if (!resumed) this.toTitle();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: G && !G.over ? this.serialize() : null, view: Main.screen === 'strat' ? { cam: Object.assign({}, MapView.cam) } : null })); } catch (e) { /* noop */ }
    requestAnimationFrame(t => this.loop(t));
  },
  isNarrow() { return window.innerWidth < 900; },
  show(screen) {
    for (const s of ['title', 'strat', 'tac', 'gnd']) document.getElementById(s).hidden = s !== screen;
    // 戦略画面の通知を、艦隊戦・地上戦の画面へ持ち込まない
    if (screen !== this.screen && (screen === 'tac' || screen === 'gnd' || screen === 'title')) { const tb = document.getElementById('toasts'); if (tb) tb.innerHTML = ''; }
    this.screen = screen;
    this.onResize();
  },
  onResize() {
    if (this.screen === 'title') Title.resize();
    if (this.screen === 'strat') MapView.resize();
    if (this.screen === 'tac') TacView.resize();
    if (this.screen === 'gnd') GndView.resize();
  },
  toTitle() {
    UI.closeAll();
    G = null;
    this.show('title');
    Title.refresh();
  },
  newGame(fid, diff, seed) {
    newGame({ player: fid, difficulty: diff, seed });
    this.enterStrat(true);
    const f = FAC(fid);
    const intro = fid === 'EMP'
      ? '老帝の信任を得て、あなたは帝国宰相に任じられた。門閥貴族は宮廷にはびこり、共和国の艦隊は東の回廊に集結している。ケルベロス要塞を拠点に共和国を屈服させよ。ただし、貴族たちの不満が爆発すれば帝国は内乱に陥る。'
      : '議会の指名を受け、あなたは国防最高評議会議長に就任した。帝国はケルベロス要塞で回廊を塞ぎ、国力差は歴然としている。名将たちを率いて要塞を奪い、帝国領へ進め。最初の議会選挙は二年半後に来る。';
    G.pending.push({ type: 'notice', title: `${f.name}　就任`, text: intro + '　時間は一時停止している。星系や艦隊を選んで状況を確かめ、準備ができたら時間を進めよう。' });
  },
  enterStrat(fresh) {
    UI.closeAll();
    this.show('strat');
    UI.sel = null; UI.moveMode = false;
    UI.buildTop();
    document.getElementById('left').hidden = this.isNarrow();
    document.getElementById('right').hidden = true;
    MapView.terrVer = -1; MapView.vis = null;
    MapView.resize();
    if (fresh) MapView.fit();
    UI.renderLeft(true);
    G.paused = true;
  },
  loop(t) {
    const dt = Math.min(0.1, Math.max(0, (t - this.last) / 1000));
    this.last = t;
    try {
      if (this.screen === 'title') Title.frame(dt);
      else if (this.screen === 'strat' && G) {
        if (!G.paused && !UI.modalOpen() && !G.over) simAdvance(dt * G.speed);
        MapView.render(dt);
        if (t - this.lastTop > 200) { this.lastTop = t; UI.updateTop(); }
        UI.renderLeft(false);
        UI.renderCtx(false);
        if (!G.over) Modals.processPending();
        if (this.pendingGameOver && !UI.modalOpen()) { const o = this.pendingGameOver; this.pendingGameOver = null; Modals.gameOver(o); }
      } else if (this.screen === 'tac') TacView.frame(dt);
      else if (this.screen === 'gnd') GndView.frame(dt);
    } catch (e) { console.error(e); }
    requestAnimationFrame(tt => this.loop(tt));
  },
  togglePause(force) { if (!G) return; G.paused = force ? true : !G.paused; if (G.paused === false && G.over && !G.watching) G.paused = true; UI.updateTop(); },
  setSpeed(v) { if (!G) return; G.speed = v; G.paused = false; UI.updateTop(); },
  afterDecision() { UI.renderCtx(true); UI.renderLeft(true); UI.updateTop(); },
  startTactical(pend) { this.show('tac'); TacView.start(pend); },
  endTactical() { const rep = TacView.finish(); this.show('strat'); MapView.resize(); Modals.battleResult(rep); },
  startGround(pend) { this.show('gnd'); GndView.start(pend); },
  endGround() { const rep = GndView.finish(); this.show('strat'); MapView.resize(); Modals.groundResult(rep); },

  /* ---------- 保存 ---------- */
  serialize() {
    const sm = G.supplyMap;
    G.supplyMap = {};
    const s = JSON.stringify(G);
    G.supplyMap = sm;
    return s;
  },
  save(key) {
    if (!G) return false;
    try {
      localStorage.setItem(key, this.serialize());
      localStorage.setItem(key + '-meta', JSON.stringify({ day: G.day, player: G.player, startYear: G.startYear, at: Date.now() }));
      return true;
    } catch (e) { return false; }
  },
  autosave() { if (G && !G.over && !G.headless) this.save(AUTO_KEY); },
  hasSave(key) { try { return !!localStorage.getItem(key); } catch (e) { return false; } },
  saveMeta(key) { try { return JSON.parse(localStorage.getItem(key + '-meta') || 'null'); } catch (e) { return null; } },
  saveLabel(key) { const m = this.saveMeta(key); if (!m) return ''; return `${FACTION_DEFS[m.player] ? FACTION_DEFS[m.player].short : ''}・${fmtDateShort(m.day, m.startYear || 796)}`; },
  latestSave() {
    const a = this.saveMeta(SAVE_KEY), b = this.saveMeta(AUTO_KEY);
    if (a && b) return a.at >= b.at ? SAVE_KEY : AUTO_KEY;
    if (a && this.hasSave(SAVE_KEY)) return SAVE_KEY;
    if (b && this.hasSave(AUTO_KEY)) return AUTO_KEY;
    return null;
  },
  load(key) {
    let s = null;
    try { s = localStorage.getItem(key); } catch (e) { return false; }
    if (!s) return false;
    return this.loadFromString(s);
  },
  loadFromString(s, view) {
    try {
      const g = JSON.parse(s);
      if (!g || !g.systems || !g.factions) return false;
      G = g;
      G.supplyMap = {}; G.headless = false; G.paused = true;
      computeSupply();
      G.terrVer = (G.terrVer || 0) + 1;
      this.enterStrat(!view);
      if (view && view.cam) Object.assign(MapView.cam, view.cam);
      UI.toast(`${fmtDate(G.day, G.startYear)}から再開した。`);
      return true;
    } catch (e) { console.error(e); return false; }
  }
};

function start(data) { Main.boot(data || {}); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => boot());
else boot();
function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
}

</script>
